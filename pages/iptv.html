  .pctrl { position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:center; gap:6px; padding:10px 12px; background:transparent; opacity:0; transition:opacity .25s; }

  .pbar:disabled { cursor:default; opacity:.55; }
  .pbar::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#10b981; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .pbar::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#10b981; border:2px solid #fff; }
  .ptime { font-size:12px; color:rgba(255,255,255,.9); white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .vbox { position:relative; flex-shrink:0; }
  .vtrack { position:absolute; bottom:38px; left:50%; transform:translateX(-50%); width:34px; height:104px; background:rgba(15,15,19,.94); border:1px solid rgba(255,255,255,.14); border-radius:14px; display:none; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .vbox.open .vtrack { display:flex; }
  .vbar { -webkit-appearance:none; appearance:none; width:78px; height:4px; border-radius:2px; background:linear-gradient(to right,#10b981 0%,#10b981 var(--vpct,100%),rgba(255,255,255,.28) var(--vpct,100%),rgba(255,255,255,.28) 100%); transform:rotate(-90deg); outline:none; cursor:pointer; }
  .vbar::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#10b981; border:2px solid #fff; }
  .vbar::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#10b981; border:2px solid #fff; }
  .status { font-size:12px; color:#f59e0b; margin-top:8px; display:none; align-items:center; gap:6px; }
  .status.show { display:flex; }
  .status.err { color:#ef4444; }
  .status svg { width:14px; height:14px; flex-shrink:0; }
  .tip { font-size:12px; color:#9ca3af; margin-top:8px; line-height:1.7; flex-shrink:0; }
  .tip b { color:#6b7280; }
  /* 种子文件选择弹窗：种子含多个文件（多个视频/音频/图片等）时，让用户选择播放哪个 / 下载哪个 */
  .tp-overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:999; display:none; align-items:center; justify-content:center; padding:16px; }
  .tp-overlay.show { display:flex; }
  .tp-box { width:min(580px,94vw); max-height:76vh; background:#fff; border-radius:12px; box-shadow:0 16px 50px rgba(0,0,0,.28); display:flex; flex-direction:column; overflow:hidden; }
  .tp-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; font-size:13.5px; font-weight:600; color:#111827; border-bottom:1px solid #f3f4f6; flex-shrink:0; }

  .tp-row { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; }

  @media (max-width:820px) {
    html, body { height:auto; overflow:auto; }

    .side-url .url-row button { padding:10px 16px; font-size:14px; }
  }
</style>

<body>
<script src="../assets/icons.js" defer></script>
<div class="topbar">
  <span class="logo">播放中心</span>
  <a class="home" href="../index.html"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-home"></use></svg> 首页</a>

<div class="wrap">

      <div class="side-tabs">
        <button id="tabTv" class="active" onclick="switchPane('tv')"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-signal"></use></svg>电视</button>
        <button id="tabLocal" onclick="switchPane('local')"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-folder"></use></svg>本地</button>
      </div>
      <div id="paneTv">
        <div class="ch-list" id="chList"></div>
      </div>
      <div id="paneLocal" style="display:none">
        <input type="file" id="localInput" accept="video/*,audio/*,.mkv,.avi,.flv,.wmv,.ts,.mov,.mp4,.webm,.mp3,.wav,.flac,.aac,.m4a,.ogg,.opus,.ncm,.kgm,.vpr,.qmc0,.qmc2,.qmc3,.qmc4,.qmc6,.qmc8,.qmcflac,.qmcflac0,.qmcflac1,.mflac,.mflac0,.mgg,.mgg0,.mgg1,.kgma,.kwm,.uc,.uc0,.tm0,.tm3,.tkm,.xm,.torrent" multiple style="display:none">
        <div class="local-add" onclick="document.getElementById('localInput').click()"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-plus"></use></svg> 添加本地文件（可多选）</div>
        <div class="local-list" id="localList"></div>
      </div>
      <div class="side-url">
        <div class="url-row">
          <input id="urlInput" placeholder="粘贴网址：mp4 · mp3 · m3u8 · flv · dash · 磁力 · 种子" autocomplete="off" autocorrect="off" spellcheck="false">
          <button onclick="playUrl()">解析</button>
        </div>
      </div>
    </div>
    <div class="player-col">
      <div class="card">
        <div class="player-box" id="playerBox">
          <video id="video" playsinline preload="auto"></video>
          <iframe id="biliFrame" style="display:none;width:100%;height:100%;border:none;border-radius:14px" allowfullscreen></iframe>
          <!-- 纯音乐播放时的动态可视化层（旋转唱片 + 声波，避免黑屏） -->
          <div class="music-vis" id="musicVis">
            <div class="mv-disc"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-music"></use></svg></div>
            <div class="mv-bars"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="mv-name" id="mvName"></div>
          </div>
          <div class="pctrl" id="pctrl">
            <button class="pb" id="btnPlay" onclick="togglePlay()" title="播放 / 暂停"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-play"></use></svg></button>
            <div class="pbar-wrap">
              <input type="range" class="pbar" id="pbar" min="0" max="1000" value="0" step="1">
            </div>
            <span class="ptime" id="ptime">0:00</span>
            <div class="vbox" id="vbox">
              <button class="pb" id="btnVol" onclick="toggleVol()" title="音量"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-volume"></use></svg></button>
              <div class="vtrack" id="vtrack">
                <input type="range" class="vbar" id="vbar" min="0" max="100" value="100" step="1">
              </div>
            </div>
            <button class="pb" id="btnFs" onclick="toggleFs()" title="全屏"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-fullscreen"></use></svg></button>
            <button class="pb" id="btnDl" onclick="downloadCur()" title="下载当前内容"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-download"></use></svg></button>
          </div>
        </div>
        <div class="status" id="status"></div>
        <div class="tip"><b>提示：</b>直播源来自公开 IPTV 列表，可能随时失效；本地视频 / 音频完全在浏览器内播放，不上传；磁力 / 种子通过 P2P 下载，完成后自动播放，内容仅保存在当前浏览器中。种子含多个文件（多个视频 / 音频 / 图片等）时，会弹出选择面板，可挑要播放或下载的文件。</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ---------- 内置默认频道（公开 IPTV 源，https 为主） ---------- */
  var DEFAULT=[
    {g:'央视', c:[
      {n:'CCTV-9 纪录', u:'https://xykt-fix.github.io/Y77.m3u8'}
    ]},
    {g:'卫视', c:[
      {n:'河北卫视', u:'https://event.pull.hebtv.com/live/live101.m3u8'}
    ]},
    {g:'地方', c:[
      {n:'哈尔滨新闻综合', u:'https://stream.hrbtv.net/xwzh/playlist.m3u8'},
      {n:'哈尔滨影视', u:'https://stream.hrbtv.net/yspd/playlist.m3u8'},
      {n:'兰州新闻综合', u:'https://liveplus.lzr.com.cn/xwzh/HD/live.m3u8'},
      {n:'兰州文旅', u:'https://liveplus.lzr.com.cn/wlpd/HD/live.m3u8'},
      {n:'白城新闻综合', u:'https://stream2.jlntv.cn/baicheng1/sd/live.m3u8'},
      {n:'浙江国际', u:'https://ali-m-l.cztv.com/channels/lantian/channel10/1080p.m3u8'}
    ]}
  ];
  var LS_KEY='iptv_channels';
  var video=document.getElementById('video'), statusEl=document.getElementById('status');
  var hls=null, flvP=null, dashP=null, cur=null, curLocal=null;
  var localFiles=[];
  var ph=document.querySelector('.ph');
  // 磁力 / 种子（WebTorrent P2P）
  var wtClient=null, wtTorrent=null, wtStream=null, wtProgTimer=null;
  var curDownload=null; // {name, kind:'direct'|'torrent', url} 当前可下载内容

  function getChannels(){
    try{ var d=JSON.parse(localStorage.getItem(LS_KEY)); if(d&&d.length) return d; }catch(e){}
    return DEFAULT;
  }
  function setStatus(msg,isErr){
    statusEl.innerHTML='<svg class="icon" viewBox="0 0 24 24"><use href="#'+(isErr?'icon-alert':'icon-zap')+'"></use></svg> '+msg;
    statusEl.className='status show'+(isErr?' err':'');
  }
  function clearStatus(){ statusEl.className='status'; statusEl.innerHTML=''; }
  function setNow(t){ var e=document.getElementById('nowName'); if(e) e.textContent=t; }
  function hidePh(){ /* 占位层已删除，空函数 */ }

  // 停止所有引擎，准备新播放
  function stopEngines(){
    ipConvSeq++; // 使进行中的转码作废
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    if(flvP){ try{flvP.destroy();}catch(e){} flvP=null; }
    if(dashP){ try{dashP.reset();}catch(e){} dashP=null; }
    stopTorrent();
    video.removeAttribute('src'); video.load();
    var bf=document.getElementById('biliFrame'); if(bf){ bf.style.display='none'; bf.src='about:blank'; }
    video.style.display='';
  }
  // 停止磁力下载 / 边下边播
  function stopTorrent(){
    if(wtStream){ try{ wtStream.destroy(); }catch(e){} wtStream=null; }
    if(wtTorrent){ try{ wtTorrent.destroy(); }catch(e){} wtTorrent=null; }
    wtTorrent=null;
    if(wtProgTimer){ clearInterval(wtProgTimer); wtProgTimer=null; }
    curDownload=null;
    if(window.closeTorrentPicker) window.closeTorrentPicker();
  }
  // 隐藏音乐可视化层（切台/换源/停止时调用）
  function hideVisGlobal(){ var el=document.getElementById('musicVis'); if(el) el.classList.remove('show'); }

  // 左侧 Tab 切换：电视 / 本地
  window.switchPane=function(t){
    document.getElementById('tabTv').classList.toggle('active', t==='tv');
    document.getElementById('tabLocal').classList.toggle('active', t==='local');
    document.getElementById('paneTv').style.display = t==='tv' ? '' : 'none';
    document.getElementById('paneLocal').style.display = t==='local' ? '' : 'none';
  };

  // ---------- 电视 ----------
  function play(grp,ch){
    cur=ch; curLocal=null;
    setNow(ch.n+'　·　'+grp);
    clearStatus();
    hideVisGlobal();
    stopEngines();
    setStatus('正在连接 '+ch.n+'…');

  function fileKind(name){
    var ext=(name.split('.').pop()||'').toLowerCase();
    if(/^(mp4|mkv|avi|mov|webm|ts|m4v|flv|wmv|rmvb)$/.test(ext)) return 'video';
    if(/^(mp3|wav|flac|aac|m4a|ogg|oga|opus)$/.test(ext)) return 'audio';
    if(/^(jpg|jpeg|png|gif|webp|bmp|svg|ico|avif|heic)$/.test(ext)) return 'image';
    return 'other';
  }

  // ---- 本地视频懒转码：仅当浏览器无法直接播放时，才下载 ffmpeg 引擎（多源 CDN 回退），转换后播放 ----
  var ipConvSeq = 0; // 转码令牌：切台/切文件时自增，使进行中的转码作废
  var IP_FF_FILES = {
    lib: '../assets/vendor/ffmpeg/ffmpeg.min.js?v=2',
    core: [
      'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
      'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
      '../assets/vendor/ffmpeg/ffmpeg-core.js?v=2'
    ],
    wasm: [
      'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
      'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
      '../assets/vendor/ffmpeg/ffmpeg-core.wasm?v=2'
    ]
  };
  var ipFF = null, ipFFLoading = null;
  function ipFfmpegSize(n){ if(!n) return '0 B'; var u=['B','KB','MB','GB'],i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return (i?n.toFixed(1):n)+' '+u[i]; }
  function ipFfmpegBlob(list, label, onP){
    if(typeof list==='string') list=[list];
    function one(i){
      if(i>=list.length) return Promise.reject(new Error(label+' 下载失败（所有源均不可用），请刷新重试'));
      return new Promise(function(resolve,reject){
        var x=new XMLHttpRequest();
        x.open('GET', list[i], true);
        x.responseType='blob';
        x.onprogress=function(e){ if(onP) onP(e.lengthComputable, e.loaded, e.total); };
        x.onload=function(){ if(x.status>=200&&x.status<300) resolve(x.response); else reject(new Error('HTTP '+x.status)); };
        x.onerror=function(){ reject(new Error('网络错误')); };
        x.send();
      }).catch(function(){ if(onP) onP(false,0,0); return one(i+1); });
    }
    return one(0);
  }
  function ipFfmpegDl(loaded, total, hasTotal){
    if(hasTotal){ var pct=total?Math.min(100,Math.round(loaded/total*100)):0; setStatus('正在下载转换引擎（约 32MB，CDN 加速）：<b>'+pct+'%</b>　'+ipFfmpegSize(loaded)+' / '+ipFfmpegSize(total)); }
    else setStatus('正在下载转换引擎（约 32MB，CDN 加速）：已下载 <b>'+ipFfmpegSize(loaded)+'</b>，请稍候…');
  }
  function ipLoadFFmpeg(){
    if(ipFF&&ipFF.loaded) return Promise.resolve(ipFF);
    if(ipFFLoading) return ipFFLoading;
    ipFFLoading=new Promise(function(resolve,reject){
      var s=document.createElement('script');
      s.src=IP_FF_FILES.lib;
      s.onload=resolve;
      s.onerror=function(){ ipFFLoading=null; reject(new Error('ffmpeg 库加载失败，请刷新重试')); };
      document.head.appendChild(s);
    }).then(function(){
      if(!window.FFmpegWASM||!window.FFmpegWASM.FFmpeg) throw new Error('ffmpeg 库加载失败，请刷新重试');
      return Promise.all([
        ipFfmpegBlob(IP_FF_FILES.core, '核心脚本'),
        ipFfmpegBlob(IP_FF_FILES.wasm, '解码器', function(h,d,t){ ipFfmpegDl(d,t,h); })
      ]);
    }).then(function(b){
      var f=new window.FFmpegWASM.FFmpeg();
      f.on('progress', function(ev){
        if(ev&&typeof ev.progress==='number'&&isFinite(ev.progress)&&ev.progress>0){
          setStatus('正在转换格式：<b>'+Math.round(Math.min(ev.progress,1)*100)+'%</b>（本地处理，不上传，大文件需稍等）');
        }
      });
      return f.load({coreURL:URL.createObjectURL(b[0]), wasmURL:URL.createObjectURL(b[1])}).then(function(){ ipFF=f; return f; });
    }).catch(function(e){
      ipFF=null; ipFFLoading=null;
      throw (e&&e.message)?e:new Error('转换引擎加载失败，请刷新重试');
    });
    return ipFFLoading;
  }
  // 浏览器原生能直接播放的格式：直接播，不下载引擎
  function canNativePlay(ext){
    if(/^(mp3|wav|flac|aac|m4a|ogg|oga|opus)$/.test(ext)) return true; // 音频原生可解
    if(/^(mp4|m4v|webm|mov|ogv)$/.test(ext)) return true; // 常见视频容器原生可放
    return false;
  }
  // 探测 blob 能否被浏览器解码：重封装产物先验一下，避免"重封装成功但黑屏"（如 HEVC/AC3 编码）
  function ipProbePlayable(blob){
    return new Promise(function(resolve){
      var v=document.createElement('video');
      v.muted=true; v.preload='metadata';
      var done=false;
      function fin(ok){ if(done) return; done=true; if(v.src){ try{URL.revokeObjectURL(v.src);}catch(e){} } v.removeAttribute('src'); resolve(ok); }
      v.onloadedmetadata=function(){ fin(true); };
      v.onerror=function(){ fin(false); };
      v.src=URL.createObjectURL(blob);
      setTimeout(function(){ fin(false); }, 8000); // 8秒无结果视为不可播，回退完整转码
    });
  }
  // 浏览器放不了的格式：懒加载引擎转换后播放（先秒级重封装，探测不可播再完整转码）
  function ipPlayConvert(blob, name, ext){
    var seq=ipConvSeq;
    var inName='ip_in.'+ext, outName='ip_out.mp4';
    if(blob.size>1073741824){ // 超过 1GB：内存有限，先预警
      setStatus('文件较大（'+ipFfmpegSize(blob.size)+'），浏览器内转码内存有限，请耐心等待，可能较慢…');
    }else{
      setStatus('浏览器不支持 '+ext.toUpperCase()+'，正在加载转换引擎（约 32MB，仅首次，CDN 加速）…');
    }
    ipLoadFFmpeg().then(function(){
      if(seq!==ipConvSeq) return Promise.reject({abort:1});
      setStatus('正在读取文件…');
      return blob.arrayBuffer();
    }).then(function(buf){
      var f=ipFF;
      function doFull(){
        return f.deleteFile(outName).catch(function(){})
          .then(function(){ return f.exec(['-i', inName, '-map', '0:v:0', '-map', '0:a:0?', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '23', '-c:a', 'aac', '-b:a', '128k', outName]); });
      }
      return f.deleteFile(inName).catch(function(){})
        .then(function(){ return f.deleteFile(outName).catch(function(){}); })
        .then(function(){ return f.writeFile(inName, new Uint8Array(buf)); })
        // 第一步：秒级重封装（只换容器不改编码，源已是 H.264 时几秒完成）
        .then(function(){ return f.exec(['-i', inName, '-map', '0:v:0', '-map', '0:a:0?', '-c', 'copy', outName]); })
        .then(function(){ return f.readFile(outName); })
        // 重封装产物先探测浏览器能否解码：不能（如 HEVC/AC3）则回退完整转码
        .then(function(out){
          if(!out||!out.length) return doFull().then(function(){ return f.readFile(outName); });
          return ipProbePlayable(new Blob([out], {type:'video/mp4'})).then(function(ok){
            if(ok) return out;
            setStatus('该文件编码浏览器不识别，正在完整转码（需稍等）…');
            return doFull().then(function(){ return f.readFile(outName); });
          });
        });
    }).then(function(out){
      if(seq!==ipConvSeq) return Promise.reject({abort:1});
      if(!out||!out.length){ setStatus('转换失败：未生成可播放文件，可先在工具箱用"格式转换"转好再播', true); return; }
      var b=new Blob([out], {type:'video/mp4'});
      video.src=URL.createObjectURL(b);
      video.play().catch(function(){});
      setStatus('已转换为 MP4 开始播放（本地处理，不上传）');
      renderTv(); renderLocal();
    }).catch(function(e){
      if(e&&e.abort) return; // 已切换播放，忽略
      video.removeAttribute('src');
      setStatus('转换播放失败：'+((e&&e.message)||'未知错误')+'，可先在工具箱用"格式转换"转好再播', true);
    });
  }

  function fmtSize(b){
    if(b>1073741824) return (b/1073741824).toFixed(2)+' GB';
    if(b>1048576) return (b/1048576).toFixed(1)+' MB';
    if(b>1024) return (b/1024).toFixed(1)+' KB';
    return b+' B';
  }
  function onTorrentReady(torrent){
    if(!torrent || torrent!==wtTorrent) return; // 已切换到其他播放
    var nm=(torrent.name||'BT 种子').slice(0,40);
    setNow('磁力种子：'+nm);
    var files=torrent.files||[];
    if(!files.length){ setStatus('种子内没有文件',true); return; }
    // 按类型分类：视频 / 音频 / 图片 / 其他
    var vids=[], auds=[], imgs=[], others=[];
    files.forEach(function(f){
      var k=fileKind(f.name);
      if(k==='video') vids.push(f);
      else if(k==='audio') auds.push(f);
      else if(k==='image') imgs.push(f);
      else others.push(f);
    });
    // 解析成功一律弹出文件列表，让用户明确选择播放哪个 / 下载哪个（不自动播放、不打扰）
    curDownload=null;
    showTorrentPicker(files, vids, auds, imgs, others);
  }

  // P2P 下载完成后播放（浏览器端 getBlob 拉取整个文件；streamTo 需 Service Worker，不作为默认路径）
  function playTorrentFile(pick){
    curDownload={name:pick.name, kind:'torrent'};
    var fname=pick.name.slice(0,40);
    setNow('磁力种子：'+fname);
    var mv=document.getElementById('musicVis');
    if(/\.(mp3|wav|flac|aac|m4a|ogg|oga|opus)$/i.test(pick.name)){
      if(mv){ mv.classList.add('show'); mv.classList.remove('paused'); }
      var mvName=document.getElementById('mvName'); if(mvName) mvName.textContent=pick.name;
    }else if(mv) mv.classList.remove('show');
    setStatus('正在下载：'+fname+'（完成后自动播放）');
    var played=false;
    function startPlay(blob){
      if(played) return; played=true;
      var ext=(pick.name.match(/\.([^.]+)$/)||[, 'mp4'])[1].toLowerCase();
      if(canNativePlay(ext)){
        video.src=URL.createObjectURL(blob);
        var p=video.play();
        if(p&&p.then){
          p.then(function(){ setStatus('下载完成，开始播放：'+fname); })
           .catch(function(){ setStatus('下载完成，点击播放按钮开始播放：'+fname); });
        }else{
          setStatus('下载完成，开始播放：'+fname);
        }
      }else{
        setStatus('下载完成，正在转换格式后播放…');
        ipPlayConvert(blob, pick.name, ext);
      }
    }
    pick.getBlob(function(err, blob){
      if(err || !blob){ setStatus('获取磁力文件失败',true); return; }
      if(!wtTorrent || pick._torrent!==wtTorrent) return; // 已切换到其他播放
      startPlay(blob);
    });
    // 进度轮询：实时显示下载进度/连接数
    if(wtProgTimer) clearInterval(wtProgTimer);
    wtProgTimer=setInterval(function(){
      if(!wtTorrent) return;
      var pct=Math.round((wtTorrent.progress||0)*100);
      var peers=wtTorrent.numPeers||0;
      setStatus('磁力下载 '+pct+'% · 节点 '+peers+' · '+fname);
      if(wtTorrent.done){
        clearInterval(wtProgTimer); wtProgTimer=null;
      }
    }, 1200);
  }

  // 种子文件选择弹窗：视频/音频 → 播放，图片/其他 → 下载
  function showTorrentPicker(files, vids, auds, imgs, others){
    var ov=document.getElementById('tpOverlay');
    if(!ov){
      ov=document.createElement('div');
      ov.id='tpOverlay';
      ov.className='tp-overlay';
      ov.innerHTML='<div class="tp-box"><div class="tp-head"><span></span><button class="tp-close" onclick="closeTorrentPicker()"><svg class="icon" viewBox="0 0 24 24"><use href="#icon-x"></use></svg></button></div><div class="tp-list"></div></div>';
      document.body.appendChild(ov);
    }
    var nPlay=vids.length+auds.length, nImg=imgs.length, nOther=others.length;
    var sum='种子共 '+files.length+' 个文件';
    if(nPlay) sum+=' · '+nPlay+' 个可播放';
    if(nImg) sum+=' · '+nImg+' 张图片';
    if(nOther) sum+=' · '+nOther+' 个其他文件';
    ov.querySelector('.tp-head span').textContent='选择要播放 / 下载的文件（'+sum+'）';
    var list=ov.querySelector('.tp-list');
    list.innerHTML='';
    // 组排序：视频 → 音频 → 图片 → 其他
    vids.concat(auds, imgs, others).forEach(function(f){
      var k=fileKind(f.name);
      var icn = k==='video' ? 'icon-film' : k==='audio' ? 'icon-music' : k==='image' ? 'icon-image' : 'icon-file';
      var row=document.createElement('div');
      row.className='tp-row';
      row.innerHTML='<svg class="icon" viewBox="0 0 24 24"><use href="#'+icn+'"></use></svg><span class="tp-name"></span><span class="tp-size"></span><button class="tp-btn'+(k==='video'||k==='audio'?'':' dl')+'">'+(k==='video'||k==='audio'?'播放':'下载')+'</button>';
      row.querySelector('.tp-name').textContent=f.name;
      row.querySelector('.tp-size').textContent=fmtSize(f.length);
      row.querySelector('.tp-btn').onclick=function(){
        if(!wtTorrent || f._torrent!==wtTorrent) return; // 已切换到其他播放
        closeTorrentPicker();
        if(k==='video'||k==='audio') playTorrentFile(f);
        else downloadTorrentFile(f);
      };
      list.appendChild(row);
    });
    ov.classList.add('show');
    setStatus('种子解析成功，请选择要播放 / 下载的文件');
  }
  window.closeTorrentPicker=function(){
    var ov=document.getElementById('tpOverlay');
    if(ov) ov.classList.remove('show');
  };

  // 直接下载种子中的某个文件（图片 / 其他类型）
  function downloadTorrentFile(f){
    curDownload={name:f.name, kind:'torrent'};
    var fname=f.name.slice(0,40);
    setNow('磁力种子：'+fname);
    setStatus('正在生成文件：'+fname+'（P2P 下载中）');
    if(wtProgTimer) clearInterval(wtProgTimer);
    wtProgTimer=setInterval(function(){
      if(!wtTorrent) return;
      var pct=Math.round((wtTorrent.progress||0)*100);
      setStatus('磁力下载 '+pct+'% · 节点 '+(wtTorrent.numPeers||0)+' · '+fname);
      if(wtTorrent.done){ clearInterval(wtProgTimer); wtProgTimer=null; }
    }, 1200);
    f.getBlob(function(err, blob){
      if(wtProgTimer){ clearInterval(wtProgTimer); wtProgTimer=null; }
      if(err || !blob){ setStatus('生成文件失败',true); return; }
      if(!wtTorrent || f._torrent!==wtTorrent) return; // 已切换到其他播放
      saveBlob(blob, f.name);
      setStatus('已开始下载：'+f.name);
    });
  }

  // ---------- 下载 ----------
  function saveBlob(blob, name){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name||'download';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 3000);
  }
  window.downloadCur=function(){
    if(!curDownload){ setStatus('当前内容无法下载（电视直播 / 在线直播流不支持保存）',true); return; }
    // 本地文件 / 解密音频：直接保存
    if(curDownload.kind==='local'){
      saveBlob(curDownload.file, curDownload.name);
      setStatus('已开始下载：'+curDownload.name);
      return;
    }
    if(curDownload.kind==='blob'){
      saveBlob(curDownload.blob, curDownload.name);
      setStatus('已开始下载：'+curDownload.name);
      return;
    }
    if(curDownload.kind==='torrent'){
      if(!wtTorrent || !wtTorrent.done){ setStatus('磁力文件还在下载中，请等下载完成后保存',true); return; }
      var tgt=null;
      (wtTorrent.files||[]).forEach(function(f){ if(f.name===curDownload.name) tgt=f; });
      if(!tgt){ setStatus('未找到对应文件',true); return; }
      setStatus('正在生成文件…');
      tgt.getBlob(function(err, blob){
        if(err || !blob){ setStatus('生成文件失败',true); return; }
        saveBlob(blob, tgt.name);
        setStatus('已开始下载：'+tgt.name);
      });
      return;
    }
    // 直链视频/音频
    setStatus('正在下载：'+curDownload.name+'…');
    fetch(curDownload.url, { mode:'cors' }).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.blob();
    }).then(function(blob){
      saveBlob(blob, curDownload.name);
      setStatus('已开始下载：'+curDownload.name);
    }).catch(function(e){
      setStatus('直链下载失败（跨域或网络原因），可尝试在浏览器中右键视频另存为', true);
    });
  };

  // ---------- 在线 URL ----------
  function detect(url){
    var p=(url||'').split('?')[0].split('#')[0].toLowerCase();
    if(/^magnet:/i.test(url)) return 'magnet';
    if(/\.torrent($|\?)/.test(p)) return 'magnet';
    if(/\.m3u8($|\/)/.test(p)) return 'hls';
    if(/\.flv($|\/)/.test(p)) return 'flv';
    if(/\.mpd($|\/)/.test(p)) return 'dash';
    if(/\.(mp3|wav|flac|aac|m4a|ogg|oga|opus)($|\/)/.test(p)) return 'audio';
    return 'video';
  }
  window.playUrl=function(){
    var inp=document.getElementById('urlInput');
    var url=(inp.value||'').trim();
    if(!url){ setStatus('请先粘贴在线网址 / 磁力链接 / 种子',true); return; }
    // 磁力链接 / 种子文件：交给 WebTorrent 处理
    if(/^magnet:/i.test(url) || /\.torrent($|\?)/i.test(url.toLowerCase())){
      playMagnet(url);
      return;
    }
    if(!/^https?:\/\//i.test(url)){
      if(/^[\w-]+(\.[\w-]+)+(\/|$)/i.test(url)) url='http://'+url;
      else{ setStatus('链接格式不正确，需以 http:// 或 https:// 开头',true); return; }
    }
    // B 站视频：解析出真实播放地址再播
    var bvM=url.match(/bilibili\.com\/video\/(BV[0-9A-Za-z]{10})/);
    if(bvM){ playBili(bvM[1]); return; }
    if(/b23\.tv\//i.test(url)){ setStatus('暂不支持 b23.tv 短链，请复制网页版完整链接（bilibili.com/video/BV…）',true); return; }
    var shortName=url.replace(/^https?:\/\//,'').replace(/^www\./,'').slice(0,42);
    cur=null; curLocal=null;
    setNow('在线：'+shortName);
    clearStatus(); stopEngines();
    setStatus('正在加载…');
    var t=detect(url);
    var mv=document.getElementById('musicVis'), mvName=document.getElementById('mvName');
    if(t==='audio'){ if(mv){ mv.classList.add('show'); mv.classList.remove('paused'); } if(mvName) mvName.textContent=shortName; }
    else if(mv) mv.classList.remove('show');
    try{
      if(t==='hls'){
        if(window.Hls && Hls.isSupported()){
          hls=new Hls();
          hls.on(Hls.Events.ERROR,function(ev,data){ if(data&&data.fatal) setStatus('直播源加载失败',true); });
          hls.loadSource(url); hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED,function(){ video.play().catch(function(){}); });
        }else if(video.canPlayType('application/vnd.apple.mpegurl')){
          video.src=url;
        }else{ setStatus('当前浏览器不支持 M3U8 直播流',true); return; }
      }else if(t==='flv'){
        if(window.flvjs && flvjs.isSupported()){
          flvP=flvjs.createPlayer({type:'flv',url:url,isLive:true});
          flvP.on(flvjs.Events.ERROR,function(){ setStatus('FLV 流加载失败',true); });
          flvP.attachMediaElement(video); flvP.load(); flvP.play();
        }else{ setStatus('当前浏览器不支持 FLV 播放',true); return; }
      }else if(t==='dash'){
        if(window.dashjs){
          dashP=dashjs.MediaPlayer().create();
          dashP.on(dashP.events.ERROR,function(){ setStatus('DASH 流加载失败',true); });
          dashP.initialize(video,url,true);
        }else{ setStatus('当前浏览器不支持 DASH 播放',true); return; }
      }else{
        // 直链视频 / 音频：记录下载信息（直播流不支持下载）
        curDownload={name:shortName, kind:'direct', url:url};
        video.src=url;
        video.play().catch(function(){});
      }
    }catch(e){
      setStatus('播放出错：'+(e.message||e),true); return;
    }
    renderTv(); renderLocal();
  };

  // B 站视频：用官方嵌入播放器（无需服务器反代）
  function playBili(bv){
    cur=null; curLocal=null;
    setNow('B站视频：'+bv);
    clearStatus(); hidePh();
    hideVisGlobal();
    stopEngines();
    video.style.display='none';
    var bf=document.getElementById('biliFrame');
    bf.style.display='block';
    bf.src='https://player.bilibili.com/player.html?bvid='+bv+'&high_quality=1&autoplay=1&danmaku=1';
    renderTv(); renderLocal();
  }

  // 输入框回车即播
  document.getElementById('urlInput').addEventListener('keydown',function(e){ if(e.key==='Enter') playUrl(); });

  video.addEventListener('playing',function(){ clearStatus(); hidePh(); });
  video.addEventListener('waiting',function(){ setStatus('缓冲中…'); });
  video.addEventListener('error',function(){
    if(curLocal!==null){ setStatus('该本地文件无法播放（浏览器不支持此编码或文件已损坏），可先用工具箱的"格式转换"转成 MP4 再播', true); return; }
    if(cur) setStatus('播放失败，该直播源可能已失效', true);
  });

  /* ---------- 自定义控制条：播放 / 进度 / 音量（上下）/ 全屏 ---------- */
  var playerBox=document.getElementById('playerBox'), pctrl=document.getElementById('pctrl');
  var btnPlay=document.getElementById('btnPlay'), btnVol=document.getElementById('btnVol'), btnFs=document.getElementById('btnFs');
  var pbar=document.getElementById('pbar'), ptime=document.getElementById('ptime');
  var vbar=document.getElementById('vbar'), vbox=document.getElementById('vbox'), vtrack=document.getElementById('vtrack');
  var volLast=1, ctrlTimer=null;

  function isLive(){ return !isFinite(video.duration)||isNaN(video.duration); }
  function fmtT(s){ if(!isFinite(s)||isNaN(s)||s<0) return '--:--'; s=Math.floor(s); var m=Math.floor(s/60),ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function showCtrl(hold){
    pctrl.classList.add('show');
    clearTimeout(ctrlTimer);
    if(hold) return;
    ctrlTimer=setTimeout(function(){ if(!video.paused && !vbox.classList.contains('open')) pctrl.classList.remove('show'); },2600);
  }
  function setVolUI(){
    var v=video.muted?0:Math.round((video.volume||0)*100);
    vbar.value=v;
    vbar.style.setProperty('--vpct', v+'%');
    btnVol.querySelector('use').setAttribute('href','#icon-'+(v===0?'volume-mute':'volume'));
  }
  window.togglePlay=function(){ if(video.paused) video.play().catch(function(){}); else video.pause(); };
  window.toggleVol=function(){ vbox.classList.toggle('open'); if(vbox.classList.contains('open')) showCtrl(true); };
  window.toggleFs=function(){
    if(!document.fullscreenElement){ if(playerBox.requestFullscreen) playerBox.requestFullscreen().catch(function(){}); }
    else{ if(document.exitFullscreen) document.exitFullscreen(); }
  };
  pbar.addEventListener('input',function(){
    if(isLive()||!video.duration) return;
    var r=pbar.value/1000;
    video.currentTime=r*video.duration;
    // 拖动瞬间同步填充进度，避免"点先走、填充后追"的滞后
    pbar.style.setProperty('--pct',(r*100)+'%');
    ptime.textContent=fmtT(video.currentTime)+' / '+fmtT(video.duration);
  });
  vbar.addEventListener('input',function(){
    var v=vbar.value/100;
    video.muted=false; video.volume=v; if(v>0) volLast=v;
    setVolUI();
  });
  video.addEventListener('play',function(){ btnPlay.querySelector('use').setAttribute('href','#icon-pause'); showCtrl(); var el=document.getElementById('musicVis'); if(el) el.classList.remove('paused'); });
  video.addEventListener('pause',function(){ btnPlay.querySelector('use').setAttribute('href','#icon-play'); showCtrl(true); var el=document.getElementById('musicVis'); if(el) el.classList.add('paused'); });
  video.addEventListener('timeupdate',function(){
    if(!isLive()&&video.duration){
      pbar.disabled=false;
      pbar.value=Math.round(video.currentTime/video.duration*1000);
      pbar.style.setProperty('--pct',(video.currentTime/video.duration*100)+'%');
      ptime.textContent=fmtT(video.currentTime)+' / '+fmtT(video.duration);
    }else{
      pbar.disabled=true; pbar.value=0;
      ptime.textContent='直播 · '+fmtT(video.currentTime);
    }
  });
  video.addEventListener('click',function(){ showCtrl(true); window.togglePlay(); });
  video.addEventListener('ended',function(){ if(ph) ph.style.display=''; hideVisGlobal(); });
  document.addEventListener('fullscreenchange',function(){
    btnFs.querySelector('use').setAttribute('href','#icon-'+(document.fullscreenElement?'fullscreen-exit':'fullscreen'));
  });
  playerBox.addEventListener('mousemove',function(){ if(video.currentTime||!video.paused) showCtrl(); });
  pctrl.addEventListener('mousemove',function(e){ e.stopPropagation(); showCtrl(true); });
  document.addEventListener('click',function(e){
    if(vbox.contains(e.target)) return;
    if(vbox.classList.contains('open')){ vbox.classList.remove('open'); showCtrl(); }
  });
  setVolUI();

  renderTv();
  renderLocal();

  // 嵌入模式（?embed=1）：用于工具箱内嵌展示，恢复左右分栏大屏布局（控制条保持透明样式）
  if (/[?&]embed=1/.test(location.search)) {
    var tb = document.querySelector('.topbar');
    if (tb) tb.style.display = 'none';
    var st = document.createElement('style');
    st.textContent =
      'html,body{height:100%;overflow:hidden;}' +
      '.wrap{max-width:none;height:100%;display:flex;align-items:stretch;}' +
      '.main{width:100%;height:100%;gap:14px;align-items:stretch;flex-direction:row !important;}' +
      '.side{flex:0 0 250px !important;display:flex;flex-direction:column;border-radius:20px;}' +
      '.ch-list,.local-list{flex:1;max-height:none !important;min-height:0 !important;height:auto;padding:6px 0 10px;}' +
      '.player-col{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}' +
      '.card{flex:1;display:flex;flex-direction:column;min-height:0;padding:16px;border-radius:20px;}' +
      '.card-title{flex-shrink:0;font-size:15px;margin-bottom:10px;}' +
      '.side-url{flex-shrink:0;padding:8px 10px 10px;}' +
      '.side-url .url-row{margin:0;gap:8px;}' +
      '.side-url .url-row input{padding:8px 12px;font-size:13px;}' +
      '.side-url .url-row button{padding:8px 12px;font-size:13px;}' +
      '.player-box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:14px;}' +
      '.player-box video{width:100%;height:100%;max-height:none !important;aspect-ratio:auto;object-fit:contain;border-radius:10px;}' +
      '.status{flex-shrink:0;}' +
      '.tip{flex-shrink:0;margin-top:10px;display:none;}' +
      '@media (max-width:820px){' +
      'html,body{height:auto;overflow:auto;}' +
      '.wrap{height:auto;display:block;padding:10px 10px 14px;}' +
      '.main{flex-direction:column !important;gap:10px;height:auto;}' +
      '.side{flex:0 0 auto;width:100%;max-height:220px;}' +
      '.ch-list,.local-list{max-height:150px !important;}' +
      '.side-url{padding:10px 14px 0;border-top:0;background:transparent;}' +
      '.side-url .url-row input{padding:10px 14px;font-size:14px;}' +
      '.side-url .url-row button{padding:10px 16px;font-size:14px;}' +
      '.player-col{height:auto;}' +
      '.card{flex:none;min-height:0;padding:12px;}' +
      '.player-box{min-height:0;aspect-ratio:16/9;}' +
      '.player-box video{max-height:none;}' +
      '.tip{display:none;}' +
      '}';
    document.head.appendChild(st);
  }
})();
</script>
</body>
