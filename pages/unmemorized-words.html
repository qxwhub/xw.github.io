<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未记住的单词</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#059669;--okbg:#ecfdf5;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{font-size:19px;margin:0;}
  h1 small{font-weight:400;color:var(--muted);font-size:11px;margin-left:2px;}
  .meta{color:var(--muted);font-size:11px;margin-left:auto;line-height:1.5;text-align:right;}
  .toolbar{position:sticky;top:51px;z-index:9;background:var(--bg);padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);}
  #q{flex:1;min-width:160px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;outline:none;}
  #q:focus{border-color:var(--accent);}
  .prog{font-size:12px;color:var(--muted);white-space:nowrap;}
  .prog b{color:var(--ok);}
  .bar{width:120px;height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
  .bar > i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s;}
  .toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
  .vbtns{display:flex;gap:4px;}
  .vbtns button{font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--muted);}
  .vbtns button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{padding:14px 18px 60px;max-width:980px;margin:0 auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
  .w{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;position:relative;}
  .w.done{border-color:#a7f3d0;background:var(--okbg);}
  .w-top{display:flex;align-items:center;gap:8px;}
  .w .en{font-size:15px;font-weight:700;cursor:pointer;}
  .w .ipa{font-size:11px;color:var(--muted);font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .w .zh{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55;}
  .w .zh.none{font-style:italic;opacity:.7;}
  .w .act{display:flex;gap:6px;flex:0 0 auto;}
  .w .spk,.w .rem{font:inherit;font-size:12px;font-weight:600;line-height:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--muted);}
  .w .spk.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .w .rem.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .empty{color:var(--muted);font-size:13px;padding:40px 0;text-align:center;display:none;}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:0 0 30px;}
</style>
</head>
<body>
<header>
  <h1>未记住的单词<small>生词本</small></h1>
  <div class="meta" id="meta">金山词霸生词本 · 加载中…</div>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="搜索：输入英文或中文，如 suburb / 郊区" autocomplete="off">
  <div class="vbtns" id="vbtns">
    <button id="voiceBtn" type="button">美音</button>
    <button id="rateBtn" type="button">1.0×</button>
  </div>
  <div class="prog" id="prog"></div>
  <label class="toggle"><input type="checkbox" id="hideDone"> 仅看未记住</label>
</div>

<main>
  <div class="grid" id="list"></div>
  <div class="empty" id="empty">没有匹配的单词</div>
</main>
<footer>数据来自金山词霸「我的生词本」导出 · 点击单词或喇叭可朗读 · 「记住」进度保存在本机浏览器</footer>

<script src="unmemorized-words-data.js?v=1"></script>
<script>
(function(){
  var words = window.UMW || [];
  var STORE = 'umw_remembered_v1';
  var remembered = {};
  try { remembered = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch(e){ remembered = {}; }

  var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
  var voiceMode = 'US';   // US / UK
  var rateMode = 1.0;
  var curBtn = null;

  function pickVoice(){
    if (!synth || !synth.getVoices) return null;
    var vs = synth.getVoices() || [];
    var lang = voiceMode === 'UK' ? 'en-GB' : 'en-US';
    for (var i=0;i<vs.length;i++){ if (vs[i].lang === lang) return vs[i]; }
    for (var j=0;j<vs.length;j++){ if (vs[j].lang && vs[j].lang.indexOf((voiceMode==='UK'?'en-GB':'en-US').slice(0,2))===0) return vs[j]; }
    return null;
  }
  function speak(text, btn){
    if (!synth || !text) return;
    try { synth.cancel(); } catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if (v) u.voice = v;
    u.lang = voiceMode === 'UK' ? 'en-GB' : 'en-US';
    u.rate = rateMode; u.pitch = 1;
    if (btn){
      if (curBtn && curBtn !== btn) curBtn.classList.remove('on');
      btn.classList.add('on'); curBtn = btn;
    }
    u.onend = u.onerror = function(){
      if (btn) btn.classList.remove('on');
      if (curBtn === btn) curBtn = null;
    };
    synth.speak(u);
  }

  var list = document.getElementById('list');
  var frag = document.createDocumentFragment();

  words.forEach(function(it){
    var w = it.w, p = it.p || '', m = it.m || '';
    var card = document.createElement('div');
    card.className = 'w' + (remembered[w] ? ' done' : '');
    card.dataset.w = w;
    card.dataset.m = m;
    card.dataset.done = remembered[w] ? '1' : '0';

    var top = document.createElement('div'); top.className = 'w-top';
    var en = document.createElement('span'); en.className = 'en'; en.textContent = w;
    var ipa = document.createElement('span'); ipa.className = 'ipa'; ipa.textContent = p;
    var act = document.createElement('div'); act.className = 'act';
    var spk = document.createElement('button'); spk.className = 'spk'; spk.type = 'button'; spk.textContent = '🔊';
    if (!synth) spk.style.display = 'none';
    var rem = document.createElement('button'); rem.className = 'rem' + (remembered[w] ? ' on' : '');
    rem.type = 'button'; rem.textContent = remembered[w] ? '已记住' : '记住';
    act.appendChild(spk); act.appendChild(rem);
    top.appendChild(en); top.appendChild(ipa); top.appendChild(act);

    var zh = document.createElement('div'); zh.className = 'zh' + (m ? '' : ' none');
    zh.textContent = m ? m : '（无释义）';

    card.appendChild(top); card.appendChild(zh);
    frag.appendChild(card);
  });
  list.appendChild(frag);

  // ---- 朗读 ----
  document.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('.w .spk') : null;
    if (b){ ev.stopPropagation(); var c = b.closest('.w'); if (c) speak(c.dataset.w, b); return; }
    var en = ev.target.closest ? ev.target.closest('.w .en') : null;
    if (en){ ev.stopPropagation(); var c2 = en.closest('.w'); if (c2) speak(c2.dataset.w, en.parentNode.querySelector('.spk')); }
  });

  // ---- 标记记住 ----
  document.addEventListener('click', function(ev){
    var rem = ev.target.closest ? ev.target.closest('.w .rem') : null;
    if (!rem) return;
    ev.stopPropagation();
    var card = rem.closest('.w');
    var w = card.dataset.w;
    if (remembered[w]) { delete remembered[w]; card.classList.remove('done'); rem.classList.remove('on'); rem.textContent = '记住'; card.dataset.done = '0'; }
    else { remembered[w] = 1; card.classList.add('done'); rem.classList.add('on'); rem.textContent = '已记住'; card.dataset.done = '1'; }
    try { localStorage.setItem(STORE, JSON.stringify(remembered)); } catch(e){}
    update();
  });

  // ---- 语音/语速切换 ----
  var voiceBtn = document.getElementById('voiceBtn'), rateBtn = document.getElementById('rateBtn');
  if (synth){
    voiceBtn.style.display = ''; rateBtn.style.display = '';
    voiceBtn.onclick = function(){ voiceMode = voiceMode === 'US' ? 'UK' : 'US'; voiceBtn.textContent = voiceMode === 'UK' ? '英音' : '美音'; voiceBtn.classList.toggle('on', voiceMode==='UK'); };
    var rates = [0.8,1.0,1.2,1.5]; var ri = 1;
    rateBtn.onclick = function(){ ri = (ri+1)%rates.length; rateMode = rates[ri]; rateBtn.textContent = rateMode.toFixed(1)+'×'; rateBtn.classList.toggle('on', rateMode!==1.0); };
  } else { voiceBtn.style.display='none'; rateBtn.style.display='none'; }

  // ---- 搜索 + 过滤 ----
  var q = document.getElementById('q'), hideDone = document.getElementById('hideDone');
  var empty = document.getElementById('empty');
  function update(){
    var kw = q.value.trim().toLowerCase();
    var cards = list.children;
    var shown = 0, total = cards.length, doneCount = 0;
    for (var i=0;i<cards.length;i++){
      var c = cards[i];
      if (c.dataset.done === '1') doneCount++;
      var match = !kw || c.dataset.w.toLowerCase().indexOf(kw) >= 0 || c.dataset.m.toLowerCase().indexOf(kw) >= 0;
      var visible = match && !(hideDone.checked && c.dataset.done === '1');
      c.style.display = visible ? '' : 'none';
      if (visible) shown++;
    }
    empty.style.display = shown ? 'none' : 'block';
    var pct = total ? Math.round(doneCount/total*100) : 0;
    document.getElementById('prog').innerHTML = '已记住 <b>'+doneCount+'</b> / '+total+' <span class="bar"><i style="width:'+pct+'%"></i></span>';
  }
  q.addEventListener('input', update);
  hideDone.addEventListener('change', update);

  // ---- meta + 初始化 ----
  document.getElementById('meta').textContent = '金山词霸生词本 · 导出 2026-10-08 · 共 '+words.length+' 词';
  update();
})();
</script>
</body>
</html>
