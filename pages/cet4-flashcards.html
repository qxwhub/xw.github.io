<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四级单词卡片 · 乱序记忆</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1a1d21; --muted:#6b7280;
    --line:#e5e7eb; --accent:#111827; --blue:#2563eb; --green:#16a34a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100%;
  }
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:11px 18px 9px; position:sticky; top:0; z-index:20;
  }
  .wrap{max-width:760px; margin:0 auto; width:100%;}
  h1{margin:0; font-size:15px; letter-spacing:.1px; display:flex; align-items:center; gap:8px;}
  h1 small{font-weight:400; color:var(--muted); font-size:11px; margin-left:2px;}
  .bar{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:8px;}
  .tbtn{
    font:inherit; font-size:12px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:7px; padding:5px 11px; cursor:pointer;
    transition:border-color .12s, background .12s, color .12s; display:inline-flex; align-items:center; gap:5px;
  }
  .tbtn:hover{border-color:#c9ced6; background:#fafbfc;}
  .tbtn[aria-pressed="true"]{background:#e8f1fe; border-color:#b9d3fb; color:var(--blue); font-weight:600;}
  .tbtn svg{width:14px; height:14px;}
  #shuffleBtn .ico-restore{display:none;}
  #shuffleBtn[aria-pressed="true"] .ico-shuffle{display:none;}
  #shuffleBtn[aria-pressed="true"] .ico-restore{display:inline-block;}
  .spacer{flex:1;}
  .stat{font-size:11.5px; color:var(--muted);}
  .stat b{color:var(--ink);}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:22px 16px 14px;}
  .stage{width:100%; max-width:560px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:26px 26px 22px; box-shadow:0 10px 30px rgba(17,24,39,.06);
    cursor:pointer; user-select:none; transition:transform .12s, box-shadow .12s;
    position:relative; min-height:300px; display:flex; flex-direction:column;
    touch-action:pan-y; will-change:transform;
    -webkit-tap-highlight-color:transparent;
  }
  .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .progress{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .progress b{color:var(--ink); font-size:15px;}
  .mastered-tag{
    font-size:11px; color:var(--green); background:#eafaf0; border:1px solid #b6e6c8;
    border-radius:20px; padding:3px 10px; display:none; align-items:center; gap:4px;
  }
  .mastered-tag.show{display:inline-flex;}

  .word{font-size:46px; font-weight:700; letter-spacing:.3px; line-height:1.1; word-break:break-word;}
  .phon{margin-top:10px; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:16px;}
  .phon .ipa{font-size:15px; letter-spacing:.3px;}
  .spk{
    width:30px; height:30px; border:1px solid var(--line); background:#fff; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
    transition:color .12s, border-color .12s, background .12s; flex:0 0 auto;
  }
  .spk:hover{color:var(--blue); border-color:#b9d3fb;}
  .spk:active{transform:scale(.9); background:#e8f1fe; border-color:#b9d3fb; color:var(--blue);}
  .spk svg{width:15px; height:15px;}
  .spk.on{color:var(--blue); background:#e8f1fe; border-color:#b9d3fb;}
  @keyframes spkPulse{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  .spk.on svg{animation:spkPulse .5s ease-out;}

  .mean{
    margin-top:18px; font-size:17px; color:var(--ink); line-height:1.65; flex:1;
    border-top:1px dashed var(--line); padding-top:16px;
  }
  .mean.masked{filter:blur(6px); opacity:.35; user-select:none;}
  .reveal-hint{
    margin-top:14px; font-size:12px; color:var(--muted); display:none; text-align:center;
  }
  .reveal-hint.show{display:block;}

  .nav{display:flex; gap:9px; margin-top:18px;}
  .nav .tbtn{flex:1; justify-content:center; padding:11px 0; font-size:13.5px;}
  .nav .tbtn:disabled{opacity:.4; cursor:default;}
  .star-btn[aria-pressed="true"]{background:#eafaf0; border-color:#b6e6c8; color:var(--green); font-weight:600;}

  .tips{max-width:760px; margin:0 auto; padding:6px 16px 26px; color:var(--muted); font-size:11.5px; text-align:center; line-height:1.7;}
  .tips kbd{background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--ink); font-family:inherit;}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>四级单词卡片 <small>乱序记忆 · 点卡片看释义</small></h1>
    <div class="bar">
      <button class="tbtn" id="shuffleBtn" aria-pressed="false" title="打乱顺序 (S)">
        <svg class="ico-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        <svg class="ico-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span id="shuffleLbl">打乱顺序</span>
      </button>
      <button class="tbtn" id="hideBtn" aria-pressed="false" title="遮盖释义自测">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        遮盖释义
      </button>
      <span class="spacer"></span>
      <span class="stat">已掌握 <b id="doneCnt">0</b> / <span id="totalCnt">0</span></span>
    </div>
  </div>
</header>

<main>
  <div class="stage">
    <div class="card" id="card">
      <div class="card-top">
        <div class="progress"><b id="curIdx">0</b> / <span id="total2">0</span></div>
        <div class="mastered-tag" id="masteredTag">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="m12 17.3 6.18 3.7-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21Z"/></svg>
          已掌握
        </div>
      </div>
      <div class="word" id="word">—</div>
      <div class="phon">
        <span class="ipa" id="ipa"></span>
        <button class="spk" id="spk" title="朗读 (发音)">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12Zm-2.5 7.5a7 7 0 0 0 0-15v2.06a5 5 0 0 1 0 10.88V19.5Z"/></svg>
        </button>
      </div>
      <div class="mean" id="mean"></div>
      <div class="reveal-hint" id="revealHint">点击卡片 / 按空格 显示释义</div>
    </div>

    <div class="nav">
      <button class="tbtn" id="prevBtn">← 上一张</button>
      <button class="tbtn star-btn" id="starBtn" aria-pressed="false" title="标记已掌握">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="m12 17.3 6.18 3.7-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21Z"/></svg>
        已掌握
      </button>
      <button class="tbtn" id="nextBtn">下一张 →</button>
    </div>
  </div>
</main>

<div class="tips">
  手机上：轻点卡片看释义，<b>左右滑动换词</b>；点话筒只朗读、不会翻页。电脑快捷键：<kbd>←</kbd> 上一张 · <kbd>→</kbd> 下一张 · <kbd>空格</kbd> 显示释义 · <kbd>S</kbd> 打乱顺序 · <kbd>M</kbd> 标记已掌握
</div>

<script src="basic-english-cet4-data.js"></script>
<script>
(function(){
  var DATA = (window.BE_CET4 || []).filter(function(d){ return d && d.w; });
  var N = DATA.length;

  var K_IDX='cet4fc_idx', K_ORD='cet4fc_order', K_DONE='cet4fc_done', K_HIDE='cet4fc_hide', K_SHUF='cet4fc_shuffled';
  function load(k,def){ try{ var v=localStorage.getItem(k); return v==null?def:JSON.parse(v);}catch(e){return def;} }
  function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  // order: array of indices into DATA
  var order = load(K_ORD, null);
  if(!order || order.length!==N){
    order = DATA.map(function(_,i){return i;});
    save(K_ORD, order);
  }
  var pos = Math.min(Math.max(load(K_IDX,0)|0,0), N-1);
  var done = load(K_DONE, {});          // {word:true}
  var hideMode = load(K_HIDE, false);

  // 是否处于乱序：优先读存档；旧数据没有标记时，按当前顺序是否等于原序推断
  var shuffled = load(K_SHUF, null);
  if(shuffled===null){
    shuffled=false;
    for(var _i=0;_i<order.length;_i++){ if(order[_i]!==_i){ shuffled=true; break; } }
  }

  // elements
  var elWord=document.getElementById('word'), elIpa=document.getElementById('ipa'),
      elMean=document.getElementById('mean'), elCur=document.getElementById('curIdx'),
      elTotal=document.getElementById('totalCnt'), elTotal2=document.getElementById('total2'),
      elDone=document.getElementById('doneCnt'), elCard=document.getElementById('card'),
      elSpk=document.getElementById('spk'), elReveal=document.getElementById('revealHint'),
      elMasteredTag=document.getElementById('masteredTag'),
      btnPrev=document.getElementById('prevBtn'), btnNext=document.getElementById('nextBtn'),
      btnShuffle=document.getElementById('shuffleBtn'), btnHide=document.getElementById('hideBtn'),
      btnStar=document.getElementById('starBtn');
  var elShuffleLbl=document.getElementById('shuffleLbl');

  elTotal.textContent=N; elTotal2.textContent=N;
  btnHide.setAttribute('aria-pressed', hideMode?'true':'false');
  updateShuffleBtn();

  var revealed=false; // for current card when hideMode on

  function curWord(){ return DATA[order[pos]]; }

  function render(){
    var d = curWord();
    elWord.textContent = d.w || '—';
    elIpa.textContent = d.ipa ? ('/'+d.ipa+'/') : '';
    elMean.textContent = d.zh || '';
    elCur.textContent = pos+1;

    var isDone = !!done[d.w];
    btnStar.setAttribute('aria-pressed', isDone?'true':'false');
    elMasteredTag.classList.toggle('show', isDone);

    // hide/reveal logic
    if(hideMode){
      elMean.classList.add('masked');
      elReveal.classList.add('show');
      if(revealed){ elMean.classList.remove('masked'); }
    } else {
      elMean.classList.remove('masked');
      elReveal.classList.remove('show');
    }

    btnPrev.disabled = (pos<=0);
    btnNext.disabled = (pos>=N-1);

    elDone.textContent = Object.keys(done).length;
    save(K_IDX, pos);
  }

  function goto(p){
    pos = Math.min(Math.max(p,0), N-1);
    revealed=false;
    render();
  }

  // speech
  var utter=null;
  function speak(){
    if(!('speechSynthesis' in window)) return;
    var d=curWord(); if(!d||!d.w) return;
    try{
      window.speechSynthesis.cancel();
      utter=new SpeechSynthesisUtterance(d.w);
      utter.lang='en-US'; utter.rate=0.9;
      utter.onstart=function(){ elSpk.classList.add('on'); };
      utter.onend=utter.onerror=function(){ elSpk.classList.remove('on'); };
      window.speechSynthesis.speak(utter);
    }catch(e){}
  }

  function updateShuffleBtn(){
    btnShuffle.setAttribute('aria-pressed', shuffled?'true':'false');
    btnShuffle.title = shuffled ? '当前乱序，点击恢复原顺序 (S)' : '打乱顺序 (S)';
    if(elShuffleLbl) elShuffleLbl.textContent = shuffled ? '已打乱 · 恢复' : '打乱顺序';
  }

  function shuffle(){
    var ci = order[pos];                     // 记住当前词，打乱后仍停在它上面
    for(var i=order.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=order[i]; order[i]=order[j]; order[j]=t;
    }
    save(K_ORD, order);
    pos = order.indexOf(ci); if(pos<0) pos=0;
    shuffled=true; save(K_SHUF, true);
    revealed=false;
    updateShuffleBtn();
    render();
  }

  function restoreOrder(){
    var w = curWord() ? curWord().w : null;
    order = DATA.map(function(_,i){return i;});
    save(K_ORD, order);
    pos=0;
    if(w){ for(var i=0;i<DATA.length;i++){ if(DATA[i].w===w){ pos=i; break; } } }
    shuffled=false; save(K_SHUF, false);
    revealed=false;
    updateShuffleBtn();
    render();
  }

  function toggleShuffle(){ if(shuffled){ restoreOrder(); } else { shuffle(); } }

  function toggleHide(){
    hideMode=!hideMode; revealed=false;
    btnHide.setAttribute('aria-pressed', hideMode?'true':'false');
    save(K_HIDE, hideMode);
    render();
  }

  function toggleStar(){
    var d=curWord(); if(!d) return;
    if(done[d.w]){ delete done[d.w]; } else { done[d.w]=true; }
    save(K_DONE, done);
    render();
  }

  function reveal(){
    if(hideMode && !revealed){ revealed=true; elMean.classList.remove('masked'); }
  }

  // events
  btnPrev.onclick=function(){ goto(pos-1); };
  btnNext.onclick=function(){ goto(pos+1); };
  btnShuffle.onclick=toggleShuffle;
  btnHide.onclick=toggleHide;
  btnStar.onclick=toggleStar;

  // 发音按钮：事件不冒泡到卡片，只有话筒自己有反馈
  function stopEv(e){ e.stopPropagation(); }
  ['touchstart','touchmove','touchend','pointerdown','pointerup'].forEach(function(t){
    elSpk.addEventListener(t, stopEv, {passive:true});
  });
  elSpk.onclick=function(e){ e.stopPropagation(); speak(); };

  // 卡片：轻点看释义；左右滑动换词
  var swipeX=0, swipeY=0, swiping=false, swiped=false, slideBusy=false;
  elCard.onclick=function(){
    if(swiped){ swiped=false; return; }
    reveal();
  };
  elCard.addEventListener('touchstart', function(e){
    if(e.touches.length!==1 || slideBusy) return;
    swipeX=e.touches[0].clientX; swipeY=e.touches[0].clientY;
    swiping=true; swiped=false;
  }, {passive:true});
  elCard.addEventListener('touchmove', function(e){
    if(!swiping) return;
    var dx=e.touches[0].clientX-swipeX, dy=e.touches[0].clientY-swipeY;
    if(Math.abs(dx)>Math.abs(dy)) swiped=true;
    if(Math.abs(dx)>6){
      var pull=Math.max(-70, Math.min(70, dx*0.45));
      elCard.style.transition='none';
      elCard.style.transform='translateX('+pull+'px)';
    }
  }, {passive:true});
  elCard.addEventListener('touchend', function(e){
    if(!swiping) return; swiping=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-swipeX, dy=t.clientY-swipeY;
    var horiz = Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.2;
    if(horiz && !slideBusy){
      swiped=true;
      slideTo(dx<0?1:-1);
    } else {
      elCard.style.transition='transform .16s ease';
      elCard.style.transform='translateX(0)';
      setTimeout(function(){ elCard.style.transition=''; },180);
    }
  }, {passive:true});

  function slideTo(dir){
    var np=pos+dir;
    if(np<0 || np>=N){                       // 到头了：回弹
      elCard.style.transition='transform .16s ease';
      elCard.style.transform='translateX(0)';
      setTimeout(function(){ elCard.style.transition=''; },180);
      return;
    }
    slideBusy=true;
    elCard.style.transition='transform .16s ease, opacity .16s ease';
    elCard.style.transform='translateX('+(dir>0?-60:60)+'px)';
    elCard.style.opacity='0';
    setTimeout(function(){
      goto(np);
      elCard.style.transition='none';
      elCard.style.transform='translateX('+(dir>0?50:-50)+'px)';
      elCard.style.opacity='0';
      void elCard.offsetWidth;               // 强制回流，保证有入场动画
      elCard.style.transition='transform .18s ease, opacity .18s ease';
      elCard.style.transform='translateX(0)';
      elCard.style.opacity='1';
      setTimeout(function(){
        elCard.style.transition=''; elCard.style.opacity=''; slideBusy=false;
      },190);
    },160);
  }

  document.addEventListener('keydown', function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==='ArrowLeft'){ goto(pos-1); }
    else if(e.key==='ArrowRight'){ goto(pos+1); }
    else if(e.key===' '){ e.preventDefault(); reveal(); }
    else if(e.key==='s'||e.key==='S'){ toggleShuffle(); }
    else if(e.key==='m'||e.key==='M'){ toggleStar(); }
  });

  render();
})();
</script>
</body>
</html>
