<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>山海经 · 山海世界（试作）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l3 7h7l-5.5 4 2 7L12 17l-6.5 4 2-7L2 9h7z' fill='%232fae6a'/%3E%3C/svg%3E">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
      background:#dfeef7; color:#1f2937; }
    #scene { position:fixed; inset:0; }
    canvas { display:block; }

    #hud { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:12px;
      padding:10px 16px; background:rgba(255,255,255,.82); backdrop-filter:blur(8px);
      box-shadow:0 2px 14px rgba(31,41,55,.12); color:#1f2937; }
    #hud .title { font-size:16px; font-weight:800; white-space:nowrap; }
    #hud .title small { font-size:11px; font-weight:500; color:#6b7280; display:block; margin-top:1px; }
    #hud .prog { font-size:12px; background:#eef6ef; color:#15803d; border:1px solid #bbf0c8;
      padding:4px 10px; border-radius:999px; white-space:nowrap; font-weight:600; }
    #hud .spacer { flex:1; }
    #hud .chips { display:flex; gap:6px; flex-wrap:wrap; }
    #hud .chip { font-size:12px; color:#374151; background:rgba(31,41,55,.06); border:1px solid rgba(31,41,55,.12);
      padding:4px 10px; border-radius:999px; cursor:pointer; transition:all .15s; white-space:nowrap; }
    #hud .chip:hover { background:rgba(31,41,55,.12); }
    #hud .chip.done { background:#dcfce7; border-color:#86efac; color:#15803d; }

    #overviewBtn { position:fixed; top:64px; left:16px; z-index:20; display:none; align-items:center; gap:6px;
      font-size:12px; color:#1f2937; background:rgba(255,255,255,.9); border:1px solid rgba(31,41,55,.15);
      padding:6px 12px; border-radius:999px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    #overviewBtn:hover { background:#fff; }

    #hint { position:fixed; bottom:14px; left:0; right:0; z-index:20; text-align:center; color:#374151;
      font-size:12px; opacity:.85; pointer-events:none;
      background:rgba(255,255,255,.72); backdrop-filter:blur(4px); max-width:max-content; margin:0 auto;
      padding:5px 14px; border-radius:999px; box-shadow:0 2px 10px rgba(0,0,0,.08); }

    #miniMap { position:fixed; top:64px; right:14px; z-index:22; width:132px; height:132px; border-radius:14px;
      background:rgba(255,255,255,.94); border:1px solid rgba(31,41,55,.15); box-shadow:0 4px 18px rgba(0,0,0,.12);
      cursor:pointer; overflow:hidden; padding:8px; transition:transform .12s; }
    #miniMap:hover { transform:scale(1.03); }
    #miniMap .mm-title { font-size:11px; font-weight:700; color:#374151; margin-bottom:3px; display:flex; justify-content:space-between; }
    #miniMap svg { width:100%; height:calc(100% - 19px); display:block; }

    #mapPanel { position:fixed; top:80px; right:14px; width:min(88vw,420px); bottom:14px; z-index:30;
      background:rgba(255,255,255,.97); border:1px solid rgba(31,41,55,.15); border-radius:16px;
      box-shadow:0 10px 40px rgba(31,41,55,.22); transform:translateX(115%); transition:transform .32s cubic-bezier(.22,.61,.36,1);
      display:flex; flex-direction:column; overflow:hidden; }
    #mapPanel.show { transform:translateX(0); }
    #mapPanel .mp-head { display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
      border-bottom:1px solid #eef0f2; }
    #mapPanel .mp-head b { font-size:14px; color:#1f2937; }
    #mapPanel .mp-tools { display:flex; gap:6px; align-items:center; }
    #mapPanel .mp-tools .zoomLv { font-size:11px; color:#6b7280; min-width:34px; text-align:center; font-variant-numeric:tabular-nums; }
    #mapPanel .mp-tools button { width:30px; height:30px; border:1px solid rgba(31,41,55,.15); background:#f8fafc;
      border-radius:8px; font-size:16px; color:#374151; cursor:pointer; }
    #mapPanel .mp-tools button:hover { background:#eef2f7; }
    #mapPanel .mp-close { border:none; background:transparent; font-size:18px; color:#9ca3af; cursor:pointer; width:30px; height:30px; }
    #mapPanel .mp-body { flex:1; overflow:hidden; position:relative; cursor:grab; touch-action:none; }
    #mapPanel .mp-body.grabbing { cursor:grabbing; }
    #mapPanel svg { width:100%; height:100%; display:block; touch-action:none; user-select:none; }
    #mapPanel .mp-foot { padding:8px 14px; font-size:11px; color:#9ca3af; border-top:1px solid #eef0f2; }

    #card { position:fixed; top:0; right:0; height:100%; width:380px; max-width:90vw; z-index:40;
      background:#fff; box-shadow:-8px 0 40px rgba(31,41,55,.25); transform:translateX(105%);
      transition:transform .35s cubic-bezier(.22,.61,.36,1); display:flex; flex-direction:column; }
    #card.open { transform:translateX(0); }
    #card .c-head { display:flex; align-items:flex-start; gap:12px; padding:18px 18px 10px; border-bottom:1px solid #eef0f2; }
    #card .c-svg { width:84px; height:84px; flex-shrink:0; background:#f6faf6; border-radius:14px; border:1px solid #e7efe7; padding:6px; }
    #card .c-svg svg { width:100%; height:100%; }
    #card .c-name { flex:1; min-width:0; }
    #card .c-name h2 { font-size:19px; color:#1f2937; }
    #card .c-name .py { font-size:12px; color:#9ca3af; margin-top:2px; }
    #card .c-name .tag { display:inline-block; margin-top:6px; font-size:11px; color:#0d9488; background:#ccfbf1;
      border:1px solid #99f6e4; padding:1px 8px; border-radius:999px; }
    #card .c-close { width:30px; height:30px; flex-shrink:0; border:none; background:#f3f4f6; border-radius:8px;
      color:#6b7280; font-size:16px; cursor:pointer; }
    #card .c-close:hover { background:#e5e7eb; }
    #card .c-body { padding:14px 18px 24px; overflow-y:auto; flex:1; }
    #card .c-body h3 { font-size:13px; color:#e11d48; margin:16px 0 6px; }
    #card .c-body h3:first-child { margin-top:0; }
    #card .c-body p { font-size:13px; color:#4b5563; line-height:1.9; }
    #card .c-body .orig { background:#f6faf6; border-left:3px solid #2fae6a; padding:10px 12px; border-radius:0 8px 8px 0;
      font-size:13px; color:#14532d; line-height:1.9; }
    #card .c-foot { padding:10px 18px 16px; border-top:1px solid #eef0f2; font-size:11px; color:#9ca3af; }

    #loading { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
      background:#dfeef7; color:#475569; font-size:14px; }
    #loading.hide { display:none; }

    @media (max-width:560px) {
      #hud .title { font-size:14px; }
      #hud .chips { display:none; }
      #card { width:100%; max-width:100%; }
      #miniMap { width:106px; height:106px; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>

  <div id="hud">
    <div class="title">山海经 · 山海世界<small>试作 Demo · 3 个地点 · 进入探索发现异兽草木</small></div>
    <div class="prog" id="prog">已发现 0 / 0</div>
    <div class="spacer"></div>
    <div class="chips" id="chips"></div>
  </div>

  <button id="overviewBtn" onclick="backToOverview()">← 返回总览</button>

  <div id="hint">拖拽旋转 · 滚轮缩放 · 右上角地图点开放大 · 点击发光点发现异兽草木</div>

  <div id="miniMap" onclick="togglePanel(true)" title="点击放大地图">
    <div class="mm-title"><span>山海舆图</span><span>⤢</span></div>
    <svg id="miniSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div id="mapPanel">
    <div class="mp-head">
      <b>山海舆图</b>
      <div class="mp-tools">
        <button onclick="zoomMap(1.25)" title="放大">＋</button>
        <span class="zoomLv" id="zoomLv">1.0×</span>
        <button onclick="zoomMap(0.8)" title="缩小">－</button>
        <button onclick="resetMap()" title="复位">⟲</button>
        <button class="mp-close" onclick="togglePanel(false)" title="收起">✕</button>
      </div>
    </div>
    <div class="mp-body" id="mpBody">
      <svg id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="mp-foot">滚轮 / 双指缩放（以光标为中心）· 拖拽平移 · 点击地点飞入该处</div>
  </div>

  <div id="card">
    <div class="c-head">
      <div class="c-svg" id="cSvg"></div>
      <div class="c-name">
        <h2 id="cName">—</h2>
        <div class="py" id="cPy"></div>
        <span class="tag" id="cTag"></span>
      </div>
      <button class="c-close" onclick="closeCard()">✕</button>
    </div>
    <div class="c-body" id="cBody"></div>
    <div class="c-foot">原文取自权威本；白话/解读为整理说明，非逐字译文。</div>
  </div>

  <div id="loading">正在加载山海世界…（需联网加载 3D 库）</div>

  <script src="shanhaijing-map.js?v=2"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const DATA = window.SHANHAIJING_MAP;
    if (!DATA || !DATA.places) {
      document.getElementById('loading').textContent = '数据加载失败';
      throw new Error('no data');
    }

    const PLACE_POS = {
      zhong: new THREE.Vector3(0, 0, 0),
      nan:   new THREE.Vector3(0, 0, 78),
      bei:   new THREE.Vector3(0, 0, -78)
    };
    const SPREAD = 30;
    const SUN_DIR = new THREE.Vector3(0.55, 0.72, 0.42).normalize();

    let renderer, scene, camera, controls, clock;
    const markers = [];
    const spinners = [];
    const clouds = [];
    const birds = [];
    let waterGeo = null, waterBase = null, water = null;
    let actx = null;

    const STORE = 'shj_shanhai_unlocked_v2';
    function getUnlocked() { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { return []; } }
    function saveUnlocked(a) { try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }
    let unlocked = getUnlocked();

    // ---------- 地形高度 ----------
    function smoothstep(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    function terrainHeight(x, z) {
      let h = 0;
      h += Math.sin(x * 0.017 + 1.3) * Math.cos(z * 0.015 - 0.7) * 5.6;
      h += Math.sin(x * 0.034 - 0.4) * Math.cos(z * 0.029 + 1.1) * 3.0;
      h += Math.sin((x + z) * 0.012) * 4.2;
      h += Math.sin(x * 0.065 + z * 0.052) * 1.3;
      h += Math.cos(x * 0.11 - z * 0.083) * 0.7;
      h += Math.sin(x * 0.21 + z * 0.17) * 0.3;
      const d = Math.hypot(x, z);
      h += Math.max(0, (d - 120) * 0.14);
      const ridge = Math.pow(Math.abs(Math.sin(x * 0.021 + z * 0.009)), 1.8);
      h += ridge * 9 * Math.max(0, (d - 70) / 110);
      for (const k in PLACE_POS) {
        const pc = PLACE_POS[k];
        const dd = Math.hypot(x - pc.x, z - pc.z);
        const w = smoothstep(18, 48, dd);
        h = h * (0.16 + 0.84 * w) + 0.8;
      }
      return h;
    }

    // ---------- 场景 ----------
    function init() {
      const host = document.getElementById('scene');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      host.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfe3ff);
      scene.fog = new THREE.Fog(0xcfe8fb, 150, 360);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2200);
      camera.position.set(0, 95, 185);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 20;
      controls.maxDistance = 320;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.target.set(0, 4, 0);

      scene.add(new THREE.HemisphereLight(0xdcefff, 0x6b8f4e, 1.0));
      scene.add(new THREE.AmbientLight(0xffffff, 0.18));
      const sun = new THREE.DirectionalLight(0xfff4e0, 1.3);
      sun.position.copy(SUN_DIR).multiplyScalar(180);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 10; sun.shadow.camera.far = 480;
      sun.shadow.camera.left = -190; sun.shadow.camera.right = 190;
      sun.shadow.camera.top = 190; sun.shadow.camera.bottom = -190;
      sun.shadow.bias = -0.0004;
      scene.add(sun);

      buildSky();
      buildSunGlow();
      buildClouds();
      buildTerrain();
      buildWater();
      buildDistantPeaks();
      buildTrees();
      buildUndergrowth();
      buildBirds();
      buildPlaceMarkers();

      clock = new THREE.Clock();

      let downX = 0, downY = 0;
      renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Math.abs(e.clientX - downX) < 6 && Math.abs(e.clientY - downY) < 6) handleClick(e);
      });
      window.addEventListener('resize', onResize);

      buildMiniMap();
      buildChips();
      updateProgress();
      document.getElementById('loading').classList.add('hide');
      animate();
    }

    // ---------- 天空 / 太阳 / 云 ----------
    function buildSky() {
      const mat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          top: { value: new THREE.Color(0x3f7fc4) },
          mid: { value: new THREE.Color(0x9cc9ec) },
          bot: { value: new THREE.Color(0xdfeefb) }
        },
        vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
        fragmentShader: [
          'varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;',
          'void main(){',
          '  float h = normalize(vP).y;',
          '  vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.65)) : mix(mid, bot, pow(-h, 0.5));',
          '  gl_FragColor = vec4(c, 1.0);',
          '}'
        ].join('\n')
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(1100, 40, 24), mat));
    }
    function radialTex(stops) {
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      stops.forEach(s => g.addColorStop(s[0], s[1]));
      ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(cv);
    }
    function buildSunGlow() {
      const tex = radialTex([[0, 'rgba(255,250,225,1)'], [0.25, 'rgba(255,238,180,0.85)'], [1, 'rgba(255,236,170,0)']]);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
      sp.position.copy(SUN_DIR).multiplyScalar(720);
      sp.scale.set(220, 220, 1);
      scene.add(sp);
    }
    function cloudTex() {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
      const ctx = cv.getContext('2d');
      for (let i = 0; i < 9; i++) {
        const x = 48 + Math.random() * 160, y = 52 + Math.random() * 36, r = 22 + Math.random() * 30;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,0.92)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
      return new THREE.CanvasTexture(cv);
    }
    function buildClouds() {
      for (let i = 0; i < 9; i++) {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex(), transparent: true, depthWrite: false, fog: false }));
        const ang = Math.random() * Math.PI * 2, rad = 120 + Math.random() * 420;
        sp.position.set(Math.cos(ang) * rad, 90 + Math.random() * 90, Math.sin(ang) * rad);
        const s = 80 + Math.random() * 130;
        sp.scale.set(s, s * 0.5, 1);
        sp.userData.speed = 0.6 + Math.random() * 1.2;
        scene.add(sp);
        clouds.push(sp);
      }
    }

    // ---------- 地形 ----------
    function terrainColor(h, jitter) {
      const bands = [
        [0x8fb06b, -99], [0x5e9c3f, 1.2], [0x456f34, 6.0],
        [0x7d7a52, 12.0], [0x928c82, 17.5], [0xf0f4f7, 24.0]
      ];
      let col = new THREE.Color(bands[0][0]);
      for (let i = 1; i < bands.length; i++) {
        if (h <= bands[i][1]) {
          const t = (h - bands[i - 1][1]) / (bands[i][1] - bands[i - 1][1]);
          col = new THREE.Color(bands[i - 1][0]).lerp(new THREE.Color(bands[i][0]), Math.max(0, Math.min(1, t)));
          break;
        }
        col = new THREE.Color(bands[i][0]);
      }
      col.multiplyScalar(1 + jitter * 0.06);
      return col;
    }
    function buildTerrain() {
      const SIZE = 420, SEG = 200;
      const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = [];
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const h = terrainHeight(x, z);
        pos.setY(i, h);
        const jitter = Math.sin(x * 0.9 + z * 0.7) * 0.5 + Math.sin(x * 0.37 - z * 0.51) * 0.5;
        const c = terrainColor(h, jitter);
        colors.push(c.r, c.g, c.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.98, metalness: 0 }));
      m.receiveShadow = true;
      scene.add(m);
    }

    // ---------- 湖（网格平面 + 透明遮罩 + 波浪） ----------
    function shorelineAlpha() {
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 30, 128, 128, 126);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.68, '#ffffff');
      g.addColorStop(1, '#000000');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
      const t = new THREE.CanvasTexture(cv);
      return t;
    }
    function buildWater() {
      const SZ = 64, SEGW = 44;
      const geo = new THREE.PlaneGeometry(SZ, SZ, SEGW, SEGW);
      geo.rotateX(-Math.PI / 2);
      waterBase = Float32Array.from(geo.attributes.position.array);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x2f86c4, transparent: true, opacity: 0.9, roughness: 0.08, metalness: 0.6,
        alphaMap: shorelineAlpha(), depthWrite: false
      });
      water = new THREE.Mesh(geo, mat);
      water.position.set(0, 0.9, 0);
      scene.add(water);
      waterGeo = geo;
    }

    // ---------- 远山雪峰 ----------
    function buildDistantPeaks() {
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x8d8a8f, roughness: 1, flatShading: true });
      const snowMat = new THREE.MeshStandardMaterial({ color: 0xf3f6f9, roughness: 0.9, flatShading: true });
      const count = 12;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + Math.random() * 0.2;
        const rad = 175 + Math.random() * 70;
        const hgt = 34 + Math.random() * 40;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        const base = new THREE.Mesh(new THREE.ConeGeometry(hgt * 0.62, hgt, 6), rockMat);
        base.position.set(x, hgt / 2 - 2, z);
        scene.add(base);
        const cap = new THREE.Mesh(new THREE.ConeGeometry(hgt * 0.3, hgt * 0.42, 6), snowMat);
        cap.position.set(x, hgt * 0.82, z);
        scene.add(cap);
      }
    }

    // ---------- 植被 ----------
    function makeInstanced(geo, mat, count) {
      const im = new THREE.InstancedMesh(geo, mat, Math.max(count, 1));
      im.castShadow = true; im.receiveShadow = true;
      im.count = count;
      return im;
    }
    function fillInstances(ims, list, scaleJitter, leafColorFn) {
      const M = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), col = new THREE.Color();
      list.forEach((pos, i) => {
        const sc = (0.85 + Math.random() * scaleJitter);
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI * 2);
        s.set(sc, sc * (0.9 + Math.random() * 0.35), sc);
        p.set(pos[0], pos[1], pos[2]);
        M.compose(p, q, s);
        ims.forEach((im, idx) => {
          im.setMatrixAt(i, M);
          if (leafColorFn && idx > 0) { col.copy(leafColorFn()); im.setColorAt(i, col); }
        });
      });
      ims.forEach(im => {
        im.instanceMatrix.needsUpdate = true;
        if (im.instanceColor) im.instanceColor.needsUpdate = true;
        scene.add(im);
      });
    }
    function avoidPoints() {
      const avoid = [];
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        p.finds.forEach(f => {
          avoid.push([pc.x + ((f.scene[0] - 50) / 50) * SPREAD, pc.z + ((f.scene[1] - 50) / 50) * SPREAD]);
        });
      });
      return avoid;
    }
    function buildTrees() {
      const avoid = avoidPoints();
      const pines = [], broads = [];
      let tries = 0;
      while (pines.length + broads.length < 280 && tries < 7000) {
        tries++;
        const ang = Math.random() * Math.PI * 2;
        const rad = 26 + Math.random() * 168;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 33) continue;
        if (Math.hypot(x, z) > 198) continue;
        let ok = true;
        for (const a of avoid) if (Math.hypot(x - a[0], z - a[1]) < 7.5) { ok = false; break; }
        if (!ok) continue;
        const y = terrainHeight(x, z);
        if (y > 26) continue;
        (Math.random() < 0.55 ? pines : broads).push([x, y, z]);
      }
      const pineCol = () => new THREE.Color().setHSL(0.31 + Math.random() * 0.05, 0.42 + Math.random() * 0.16, 0.24 + Math.random() * 0.1);
      const broadCol = () => new THREE.Color().setHSL(0.27 + Math.random() * 0.07, 0.4 + Math.random() * 0.2, 0.3 + Math.random() * 0.12);
      if (pines.length) {
        const trunkGeo = new THREE.CylinderGeometry(0.22, 0.34, 1.8, 6); trunkGeo.translate(0, 0.9, 0);
        const c1 = new THREE.ConeGeometry(1.75, 3.1, 7); c1.translate(0, 2.7, 0);
        const c2 = new THREE.ConeGeometry(1.25, 2.7, 7); c2.translate(0, 4.5, 0);
        const c3 = new THREE.ConeGeometry(0.78, 2.1, 7); c3.translate(0, 6.1, 0);
        fillInstances([
          makeInstanced(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 1 }), pines.length),
          makeInstanced(c1, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), pines.length),
          makeInstanced(c2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), pines.length),
          makeInstanced(c3, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), pines.length)
        ], pines, 0.9, pineCol);
      }
      if (broads.length) {
        const trunkGeo = new THREE.CylinderGeometry(0.26, 0.4, 2.6, 6); trunkGeo.translate(0, 1.3, 0);
        const ball = new THREE.IcosahedronGeometry(2.1, 1); ball.translate(0, 4.0, 0);
        const ball2 = new THREE.IcosahedronGeometry(1.4, 1); ball2.translate(0.9, 5.0, 0.4);
        fillInstances([
          makeInstanced(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 }), broads.length),
          makeInstanced(ball, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), broads.length),
          makeInstanced(ball2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), broads.length)
        ], broads, 0.85, broadCol);
      }
      // 岩石
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8f98, roughness: 1, flatShading: true });
      for (let i = 0; i < 34; i++) {
        const ang = Math.random() * Math.PI * 2, rad = 30 + Math.random() * 150;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 32) continue;
        const s = 1 + Math.random() * 2.6;
        const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
        r.position.set(x, terrainHeight(x, z) + s * 0.35, z);
        r.castShadow = true; r.receiveShadow = true;
        r.rotation.set(Math.random(), Math.random(), Math.random());
        scene.add(r);
      }
    }

    // ---------- 低层植被：草丛 + 灌木 ----------
    function buildUndergrowth() {
      const avoid = avoidPoints();
      const tufts = [], bushes = [];
      let tries = 0;
      while (tufts.length + bushes.length < 620 && tries < 9000) {
        tries++;
        const ang = Math.random() * Math.PI * 2;
        const rad = 24 + Math.random() * 175;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 33) continue;
        let near = false;
        for (const a of avoid) if (Math.hypot(x - a[0], z - a[1]) < 4.5) { near = true; break; }
        if (near) continue;
        const y = terrainHeight(x, z);
        if (y > 22) continue;
        if (Math.random() < 0.22 && bushes.length < 130) bushes.push([x, y, z]);
        else tufts.push([x, y, z]);
      }
      if (tufts.length) {
        const g = new THREE.ConeGeometry(0.22, 0.95, 4); g.translate(0, 0.48, 0);
        const colFn = () => new THREE.Color().setHSL(0.26 + Math.random() * 0.06, 0.5 + Math.random() * 0.2, 0.34 + Math.random() * 0.14);
        fillInstances([makeInstanced(g, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), tufts.length)], tufts, 0.9, colFn);
      }
      if (bushes.length) {
        const g = new THREE.IcosahedronGeometry(0.95, 0); g.scale(1, 0.72, 1); g.translate(0, 0.6, 0);
        const colFn = () => new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.42 + Math.random() * 0.18, 0.26 + Math.random() * 0.12);
        fillInstances([makeInstanced(g, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), bushes.length)], bushes, 0.7, colFn);
      }
    }

    // ---------- 飞鸟 ----------
    function buildBirds() {
      const mat = new THREE.MeshStandardMaterial({ color: 0x3a424c, roughness: 1, side: THREE.DoubleSide });
      for (let f = 0; f < 4; f++) {
        const cx = (Math.random() - 0.5) * 120, cz = (Math.random() - 0.5) * 160;
        const r = 40 + Math.random() * 60, y = 34 + Math.random() * 22;
        for (let b = 0; b < 4; b++) {
          const g = new THREE.Group();
          const wingGeo = new THREE.BoxGeometry(1.5, 0.07, 0.4);
          const left = new THREE.Mesh(wingGeo, mat); left.position.x = -0.75;
          const right = new THREE.Mesh(wingGeo, mat); right.position.x = 0.75;
          g.add(left, right);
          g.userData.a = Math.random() * Math.PI * 2;
          g.userData.r = r + (Math.random() - 0.5) * 16;
          g.userData.y = y + (Math.random() - 0.5) * 6;
          g.userData.cx = cx; g.userData.cz = cz;
          g.userData.spd = (0.25 + Math.random() * 0.2) * (Math.random() < 0.5 ? 1 : -1);
          g.userData.ph = Math.random() * 6;
          g.userData.left = left; g.userData.right = right;
          g.scale.setScalar(0.8 + Math.random() * 0.6);
          scene.add(g);
          birds.push(g);
        }
      }
    }

    // ---------- 地点地标 + 可发现点 ----------
    function buildPlaceMarkers() {
      const typeColor = { '兽': 0xff8a3c, '鸟': 0x3aa0ff, '草': 0x36c46a, '木': 0xb07a3a };
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        const gy = terrainHeight(pc.x, pc.z);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0xb9c2c8, roughness: 1, flatShading: true });
        const snowMat = new THREE.MeshStandardMaterial({ color: 0xf6f9fb, roughness: 0.9, flatShading: true });
        const pk = new THREE.Group();
        const b1 = new THREE.Mesh(new THREE.ConeGeometry(7, 20, 6), rockMat); b1.position.set(0, 10, 0);
        const s1 = new THREE.Mesh(new THREE.ConeGeometry(3.6, 8, 6), snowMat); s1.position.set(0, 16, 0);
        const b2 = new THREE.Mesh(new THREE.ConeGeometry(4.5, 12, 6), rockMat); b2.position.set(9, 6, 3);
        b1.castShadow = b2.castShadow = true;
        pk.add(b1, s1, b2);
        pk.position.set(pc.x - 6, gy - 2, pc.z - 24);
        scene.add(pk);
        scene.add(makeLabel(p.name, pc.x - 6, gy + 24, pc.z - 24, '#1f2937', '#ffffff'));

        p.finds.forEach(f => {
          const wx = pc.x + ((f.scene[0] - 50) / 50) * SPREAD;
          const wz = pc.z + ((f.scene[1] - 50) / 50) * SPREAD;
          const wy = terrainHeight(wx, wz);
          const col = typeColor[f.type] || 0xffd84a;
          const g = new THREE.Group();
          g.position.set(wx, wy, wz);

          const base = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.9, 0.6, 12),
            new THREE.MeshStandardMaterial({ color: 0xd7dee3, roughness: 0.9 }));
          base.position.y = 0.3; base.receiveShadow = true; base.castShadow = true;
          g.add(base);
          const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.42, 5, 10),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }));
          pillar.position.y = 3.1; pillar.castShadow = true;
          g.add(pillar);

          const orb = new THREE.Mesh(new THREE.SphereGeometry(1.35, 28, 28),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.95, roughness: 0.28 }));
          orb.position.y = 6.8;
          orb.userData.find = f; orb.userData.baseY = 6.8; orb.userData.phase = Math.random() * 6;
          g.add(orb);
          markers.push(orb);

          const ring = new THREE.Mesh(new THREE.TorusGeometry(2.15, 0.09, 10, 40),
            new THREE.MeshBasicMaterial({ color: col }));
          ring.position.y = 6.8; ring.rotation.x = Math.PI / 2;
          g.add(ring);
          spinners.push(ring);

          const disc = new THREE.Mesh(new THREE.CircleGeometry(2.6, 32),
            new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.22, depthWrite: false }));
          disc.rotation.x = -Math.PI / 2; disc.position.y = 0.02;
          g.add(disc);

          scene.add(g);
          f._orb = orb;
        });
      });
    }

    function makeLabel(text, x, y, z, textColor, bg) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = bg;
      roundRect(ctx, 6, 12, 244, 40, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(31,41,55,0.18)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.font = '700 28px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);
      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = 4;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      sp.scale.set(14, 3.5, 1);
      sp.position.set(x, y, z);
      return sp;
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    // ---------- 3D 交互 ----------
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function handleClick(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(markers, false)[0];
      if (hit) selectFind(hit.object.userData.find);
    }

    let flying = false;
    const camPos = new THREE.Vector3(), camTar = new THREE.Vector3();
    function flyTo(px, py, pz, tx, ty, tz) {
      camPos.set(px, py, pz); camTar.set(tx, ty, tz); flying = true; controls.enabled = false;
      document.getElementById('overviewBtn').style.display = 'inline-flex';
    }
    function backToOverview() {
      closeCard();
      flyTo(0, 95, 185, 0, 4, 0);
      document.getElementById('overviewBtn').style.display = 'none';
    }

    function selectFind(f) {
      const p = f._orb.getWorldPosition(new THREE.Vector3());
      flyTo(p.x + 16, p.y + 10, p.z + 26, p.x, p.y, p.z);
      openCard(f);
      if (unlocked.indexOf(f.id) < 0) {
        unlocked.push(f.id); saveUnlocked(unlocked);
        updateProgress(); buildChips(); chime(true);
      } else { chime(false); }
    }
    function flyToPlace(id) {
      const pc = PLACE_POS[id];
      const gy = terrainHeight(pc.x, pc.z);
      flyTo(pc.x + 4, gy + 62, pc.z + 95, pc.x, gy + 6, pc.z);
    }

    // ---------- HUD ----------
    function updateProgress() {

    function buildChips() {

    // ---------- 舆图 ----------
    const typeColorHex = { '兽': '#ff8a3c', '鸟': '#3aa0ff', '草': '#36c46a', '木': '#b07a3a' };
    function svgEl(tag, attrs) {
      const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }
    function addDefs(svg, uid) {
      const defs = svgEl('defs', {});
      defs.innerHTML =
        '<linearGradient id="mbg' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#f4f9fd"/><stop offset="1" stop-color="#d9e9f6"/></linearGradient>' +
        '<radialGradient id="mlake' + uid + '" cx="0.5" cy="0.5" r="0.5">' +
          '<stop offset="0" stop-color="#bfe2f7"/><stop offset="1" stop-color="#8fc4e8"/></radialGradient>';
      svg.appendChild(defs);
    }
    function drawMapBasics(parent, detailed, uid) {

        parent.appendChild(svgEl('line', { x1: 0, y1: i, x2: 100, y2: i, stroke: '#b9cfe3', 'stroke-width': 0.25, 'stroke-dasharray': '1.5 1.5' }));
      }
      parent.appendChild(svgEl('ellipse', { cx: 50, cy: 50, rx: 9, ry: 8, fill: 'url(#mlake' + uid + ')' }));
      parent.appendChild(svgEl('ellipse', { cx: 50, cy: 50, rx: 9, ry: 8, fill: 'none', stroke: '#7fb4dc', 'stroke-width': 0.4 }));
      parent.appendChild(svgEl('ellipse', { cx: 47, cy: 47, rx: 3, ry: 1.4, fill: 'rgba(255,255,255,0.55)', transform: 'rotate(-20 47 47)' }));

      if (detailed) {
        parent.appendChild(svgEl('path', {

        }));

        mounts.forEach(m => {
          parent.appendChild(svgEl('path', {

        [[22, 30], [72, 32], [28, 68], [74, 68]].forEach(m => {

      parent.appendChild(svgEl('path', { d: 'M' + cx + ' ' + (cy - 4) + ' L' + (cx + 2) + ' ' + (cy + 2) + ' L' + cx + ' ' + cy + ' Z', fill: '#c9d6e0' }));
      const nt = svgEl('text', { x: cx, y: cy - 6, 'font-size': 3.6, 'text-anchor': 'middle', fill: '#374151', 'font-weight': 700 });
      nt.textContent = 'N'; parent.appendChild(nt);

      if (detailed) {

        const items = [['#2fae6a', '地点'], ['#ff8a3c', '兽'], ['#3aa0ff', '鸟'], ['#36c46a', '草'], ['#b07a3a', '木']];
        items.forEach((it, i) => {

    function drawPlaces(parent) {
      DATA.places.forEach(p => {
        const g = svgEl('g', {});

          if (mapDragMoved) return;

        g.appendChild(svgEl('circle', { cx: p.mini[0], cy: p.mini[1], r: 7, fill: 'rgba(47,174,106,0.18)' }));

    let mapContent = null;
    let mapDragMoved = false;
    function buildMiniMap() {
      const mini = document.getElementById('miniSvg');
      mini.innerHTML = '';
      addDefs(mini, 'm');
      const mg = svgEl('g', {});
      mini.appendChild(mg);
      drawMapBasics(mg, false, 'm');
      drawPlaces(mg);

      const big = document.getElementById('mapSvg');
      big.innerHTML = '';
      addDefs(big, 'b');
      mapContent = svgEl('g', {});
      big.appendChild(mapContent);
      drawMapBasics(mapContent, true, 'b');
      drawPlaces(mapContent);
      applyMapView();
    }
    function togglePanel(force) {
      const panel = document.getElementById('mapPanel');
      const show = (typeof force === 'boolean') ? force : !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      document.getElementById('miniMap').style.display = show ? 'none' : 'block';
    }
    window.togglePanel = togglePanel;

    // ---------- 大地图：内容变换式缩放/平移（锚定光标） ----------
    const mapView = { s: 1, tx: 0, ty: 0 };
    const MAP_MIN = 1, MAP_MAX = 6;
    function clampView() {
      const lo = 100 - 100 * mapView.s;
      mapView.tx = Math.max(lo, Math.min(0, mapView.tx));
      mapView.ty = Math.max(lo, Math.min(0, mapView.ty));
    }
    function applyMapView() {
      clampView();
      if (mapContent) mapContent.setAttribute('transform', 'translate(' + mapView.tx + ' ' + mapView.ty + ') scale(' + mapView.s + ')');
      const lv = document.getElementById('zoomLv');
      if (lv) lv.textContent = mapView.s.toFixed(1) + '×';
    }
    function clientToVB(cx, cy) {
      const svg = document.getElementById('mapSvg');
      const pt = svg.createSVGPoint();
      pt.x = cx; pt.y = cy;
      const m = svg.getScreenCTM();
      if (!m) return { x: 50, y: 50 };
      const r = pt.matrixTransform(m.inverse());
      return { x: r.x, y: r.y };
    }
    function zoomAt(px, py, k) {
      const ns = Math.max(MAP_MIN, Math.min(MAP_MAX, mapView.s * k));
      if (ns === mapView.s) return;
      const rk = ns / mapView.s;
      mapView.tx = px - (px - mapView.tx) * rk;
      mapView.ty = py - (py - mapView.ty) * rk;
      mapView.s = ns;
      applyMapView();
    }
    window.zoomMap = function (k) { zoomAt(50, 50, k); };
    window.resetMap = function () { mapView.s = 1; mapView.tx = 0; mapView.ty = 0; applyMapView(); };

    (function mapInteractions() {
      const body = document.getElementById('mpBody');
      const svg = document.getElementById('mapSvg');
      const pointers = new Map();
      let lastDist = 0;

      body.addEventListener('wheel', e => {
        e.preventDefault();
        const p = clientToVB(e.clientX, e.clientY);
        zoomAt(p.x, p.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
      }, { passive: false });

      body.addEventListener('dblclick', e => {
        const p = clientToVB(e.clientX, e.clientY);
        zoomAt(p.x, p.y, 1.6);
      });

      function dist() {
        const a = [...pointers.values()];
        return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      }
      function mid() {
        const a = [...pointers.values()];
        return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
      }

      body.addEventListener('pointerdown', e => {
        try { body.setPointerCapture(e.pointerId); } catch (err) {}
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        mapDragMoved = false;
        if (pointers.size === 1) body.classList.add('grabbing');
        if (pointers.size === 2) lastDist = dist();
      });
      body.addEventListener('pointermove', e => {
        if (!pointers.has(e.pointerId)) return;
        const prev = pointers.get(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1) {
          const a = clientToVB(prev.x, prev.y);
          const b = clientToVB(e.clientX, e.clientY);
          mapView.tx += (b.x - a.x);
          mapView.ty += (b.y - a.y);
          applyMapView();
          if (Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y) > 2) mapDragMoved = true;
        } else if (pointers.size === 2) {
          const d = dist(), m = mid();
          if (lastDist > 0 && d > 0) {
            const mv = clientToVB(m.x, m.y);
            zoomAt(mv.x, mv.y, d / lastDist);
          }
          mapDragMoved = true;
          lastDist = d;
        }
      });
      function endPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) lastDist = 0;
        if (pointers.size === 0) body.classList.remove('grabbing');
      }
      body.addEventListener('pointerup', endPointer);
      body.addEventListener('pointercancel', endPointer);
    })();

    // ---------- 音效 ----------
    function ensureAudio() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === 'suspended') actx.resume();
    }
    function chime(isNew) {
      ensureAudio(); if (!actx) return;
      const notes = isNew ? [523.25, 587.33, 659.25, 783.99, 880.0] : [659.25, 783.99];
      const t0 = actx.currentTime;
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        const s = t0 + i * 0.09;
        g.gain.setValueAtTime(0, s);
        g.gain.linearRampToValueAtTime(0.15, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, s + 0.5);
        o.connect(g).connect(actx.destination);
        o.start(s); o.stop(s + 0.55);
      });
    }

    // ---------- 循环 ----------
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock ? Math.min(clock.getDelta(), 0.05) : 0.016;
      t += dt;
      markers.forEach(b => {
        b.material.emissiveIntensity = 0.7 + Math.sin(t * 2 + b.userData.phase) * 0.3;
        b.position.y = b.userData.baseY + Math.sin(t * 1.5 + b.userData.phase) * 0.3;
      });
      spinners.forEach(r => { r.rotation.z += 0.6 * dt; });
      clouds.forEach(c => {
        c.position.x += c.userData.speed * dt * 2;
        if (c.position.x > 560) c.position.x = -560;
      });
      birds.forEach(b => {
        const u = b.userData;
        u.a += u.spd * dt;
        b.position.set(u.cx + Math.cos(u.a) * u.r, u.y + Math.sin(u.a * 3) * 1.6, u.cz + Math.sin(u.a) * u.r);
        b.rotation.y = -u.a + Math.PI / 2;
        const f = Math.sin(t * 9 + u.ph) * 0.7;
        u.left.rotation.z = 0.45 + f;
        u.right.rotation.z = -0.45 - f;
      });
      if (waterGeo) {
        const pos = waterGeo.attributes.position;
        const arr = pos.array;
        for (let i = 0; i < pos.count; i++) {
          const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
          arr[i * 3 + 1] = Math.sin(x * 0.28 + t * 1.7) * 0.16 + Math.cos(z * 0.32 + t * 1.3) * 0.15;
        }
        pos.needsUpdate = true;
        waterGeo.computeVertexNormals();
      }
      if (flying) {
        camera.position.lerp(camPos, 0.08);
        controls.target.lerp(camTar, 0.08);
        camera.lookAt(controls.target);
        if (camera.position.distanceTo(camPos) < 1.2) { flying = false; controls.enabled = true; }
      } else {
        controls.update();
      }
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    try { init(); }
    catch (err) {
      document.getElementById('loading').textContent = '3D 初始化失败：' + (err && err.message ? err.message : err);
    }
    setTimeout(() => {
      const el = document.getElementById('loading');
      if (!el.classList.contains('hide')) el.textContent = '3D 库加载较慢，请确认网络后刷新。';
    }, 9000);
  </script>
</body>
