<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>山海经 · 山海世界（试作）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l3 7h7l-5.5 4 2 7L12 17l-6.5 4 2-7L2 9h7z' fill='%232fae6a'/%3E%3C/svg%3E">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
      background:#dfeef7; color:#1f2937; }
    #scene { position:fixed; inset:0; }
    canvas { display:block; }

    /* 顶部 HUD —— 明亮风 */
    #hud { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:12px;
      padding:10px 16px; background:rgba(255,255,255,.82); backdrop-filter:blur(8px);
      box-shadow:0 2px 14px rgba(31,41,55,.12); color:#1f2937; }
    #hud .title { font-size:16px; font-weight:800; white-space:nowrap; }
    #hud .title small { font-size:11px; font-weight:500; color:#6b7280; display:block; margin-top:1px; }
    #hud .prog { font-size:12px; background:#eef6ef; color:#15803d; border:1px solid #bbf0c8;
      padding:4px 10px; border-radius:999px; white-space:nowrap; font-weight:600; }
    #hud .spacer { flex:1; }
    #hud .chips { display:flex; gap:6px; flex-wrap:wrap; }
    #hud .chip { font-size:12px; color:#374151; background:rgba(31,41,55,.06); border:1px solid rgba(31,41,55,.12);
      padding:4px 10px; border-radius:999px; cursor:pointer; transition:all .15s; white-space:nowrap; }
    #hud .chip:hover { background:rgba(31,41,55,.12); }
    #hud .chip.done { background:#dcfce7; border-color:#86efac; color:#15803d; }

    /* 返回总览 */
    #overviewBtn { position:fixed; top:64px; left:16px; z-index:20; display:none; align-items:center; gap:6px;
      font-size:12px; color:#1f2937; background:rgba(255,255,255,.9); border:1px solid rgba(31,41,55,.15);
      padding:6px 12px; border-radius:999px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    #overviewBtn:hover { background:#fff; }

    /* 底部提示 */
    #hint { position:fixed; bottom:14px; left:0; right:0; z-index:20; text-align:center; color:#374151;
      font-size:12px; opacity:.8; pointer-events:none;
      background:rgba(255,255,255,.7); backdrop-filter:blur(4px); max-width:max-content; margin:0 auto;
      padding:5px 14px; border-radius:999px; box-shadow:0 2px 10px rgba(0,0,0,.08); }

    /* 右上角小地图（按钮式，点亮后展开右侧大地图） */
    #miniMap { position:fixed; top:64px; right:14px; z-index:22; width:128px; height:128px; border-radius:14px;
      background:rgba(255,255,255,.92); border:1px solid rgba(31,41,55,.15); box-shadow:0 4px 18px rgba(0,0,0,.12);
      cursor:pointer; overflow:hidden; padding:8px; transition:transform .12s; }
    #miniMap:hover { transform:scale(1.03); }
    #miniMap .mm-title { font-size:11px; font-weight:700; color:#374151; margin-bottom:4px; display:flex; justify-content:space-between; }
    #miniMap svg { width:100%; height:calc(100% - 20px); display:block; }

    /* 右侧大地图面板（小地图放大版，明亮风） */
    #mapPanel { position:fixed; top:80px; right:14px; width:min(88vw,400px); bottom:14px; z-index:30;
      background:rgba(255,255,255,.96); border:1px solid rgba(31,41,55,.15); border-radius:16px;
      box-shadow:0 10px 40px rgba(31,41,55,.22); transform:translateX(115%); transition:transform .32s cubic-bezier(.22,.61,.36,1);
      display:flex; flex-direction:column; overflow:hidden; }
    #mapPanel.show { transform:translateX(0); }
    #mapPanel .mp-head { display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
      border-bottom:1px solid #eef0f2; }
    #mapPanel .mp-head b { font-size:14px; color:#1f2937; }
    #mapPanel .mp-tools { display:flex; gap:6px; }
    #mapPanel .mp-tools button { width:30px; height:30px; border:1px solid rgba(31,41,55,.15); background:#f8fafc;
      border-radius:8px; font-size:16px; color:#374151; cursor:pointer; }
    #mapPanel .mp-tools button:hover { background:#eef2f7; }
    #mapPanel .mp-close { border:none; background:transparent; font-size:18px; color:#9ca3af; cursor:pointer; width:30px; height:30px; }
    #mapPanel .mp-body { flex:1; overflow:hidden; position:relative; cursor:grab; }
    #mapPanel .mp-body.grabbing { cursor:grabbing; }
    #mapPanel svg { width:100%; height:100%; display:block; touch-action:none; }
    #mapPanel .mp-foot { padding:8px 14px; font-size:11px; color:#9ca3af; border-top:1px solid #eef0f2; }

    /* 异兽卡（右侧滑入，明亮风） */
    #card { position:fixed; top:0; right:0; height:100%; width:380px; max-width:90vw; z-index:40;
      background:#fff; box-shadow:-8px 0 40px rgba(31,41,55,.25); transform:translateX(105%);
      transition:transform .35s cubic-bezier(.22,.61,.36,1); display:flex; flex-direction:column; }
    #card.open { transform:translateX(0); }
    #card .c-head { display:flex; align-items:flex-start; gap:12px; padding:18px 18px 10px; border-bottom:1px solid #eef0f2; }
    #card .c-svg { width:84px; height:84px; flex-shrink:0; background:#f6faf6; border-radius:14px; border:1px solid #e7efe7; padding:6px; }
    #card .c-svg svg { width:100%; height:100%; }
    #card .c-name { flex:1; min-width:0; }
    #card .c-name h2 { font-size:19px; color:#1f2937; }
    #card .c-name .py { font-size:12px; color:#9ca3af; margin-top:2px; }
    #card .c-name .tag { display:inline-block; margin-top:6px; font-size:11px; color:#0d9488; background:#ccfbf1;
      border:1px solid #99f6e4; padding:1px 8px; border-radius:999px; }
    #card .c-close { width:30px; height:30px; flex-shrink:0; border:none; background:#f3f4f6; border-radius:8px;
      color:#6b7280; font-size:16px; cursor:pointer; }
    #card .c-close:hover { background:#e5e7eb; }
    #card .c-body { padding:14px 18px 24px; overflow-y:auto; flex:1; }
    #card .c-body h3 { font-size:13px; color:#e11d48; margin:16px 0 6px; }
    #card .c-body h3:first-child { margin-top:0; }
    #card .c-body p { font-size:13px; color:#4b5563; line-height:1.9; }
    #card .c-body .orig { background:#f6faf6; border-left:3px solid #2fae6a; padding:10px 12px; border-radius:0 8px 8px 0;
      font-size:13px; color:#14532d; line-height:1.9; }
    #card .c-foot { padding:10px 18px 16px; border-top:1px solid #eef0f2; font-size:11px; color:#9ca3af; }

    /* 加载 */
    #loading { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
      background:#dfeef7; color:#475569; font-size:14px; }
    #loading.hide { display:none; }

    @media (max-width:560px) {
      #hud .title { font-size:14px; }
      #hud .chips { display:none; }
      #card { width:100%; max-width:100%; }
      #miniMap { width:104px; height:104px; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>

  <div id="hud">
    <div class="title">山海经 · 山海世界<small>试作 Demo · 3 个地点 · 进入探索发现异兽草木</small></div>
    <div class="prog" id="prog">已发现 0 / 0</div>
    <div class="spacer"></div>
    <div class="chips" id="chips"></div>
  </div>

  <button id="overviewBtn" onclick="backToOverview()">← 返回总览</button>

  <div id="hint">拖拽旋转 · 滚轮缩放 · 右上角地图可放大 · 点击发光点发现异兽草木</div>

  <!-- 右上角小地图 -->
  <div id="miniMap" onclick="togglePanel(true)" title="点击放大地图">
    <div class="mm-title"><span>山海舆图</span><span>⤢</span></div>
    <svg id="miniSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  </div>

  <!-- 右侧大地图面板 -->
  <div id="mapPanel">
    <div class="mp-head">
      <b>山海舆图 · 可缩放</b>
      <div class="mp-tools">
        <button onclick="zoomMap(1.25)" title="放大">＋</button>
        <button onclick="zoomMap(0.8)" title="缩小">－</button>
        <button onclick="resetMap()" title="复位">⟲</button>
        <button class="mp-close" onclick="togglePanel(false)" title="收起">✕</button>
      </div>
    </div>
    <div class="mp-body" id="mpBody">
      <svg id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="mp-foot">滚轮 / 双指缩放 · 拖拽平移 · 点击地点飞入该处实景</div>
  </div>

  <div id="card">
    <div class="c-head">
      <div class="c-svg" id="cSvg"></div>
      <div class="c-name">
        <h2 id="cName">—</h2>
        <div class="py" id="cPy"></div>
        <span class="tag" id="cTag"></span>
      </div>
      <button class="c-close" onclick="closeCard()">✕</button>
    </div>
    <div class="c-body" id="cBody"></div>
    <div class="c-foot">原文取自权威本；白话/解读为整理说明，非逐字译文。</div>
  </div>

  <div id="loading">正在加载山海世界…（需联网加载 3D 库）</div>

  <script src="shanhaijing-map.js?v=2"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const DATA = window.SHANHAIJING_MAP;
    if (!DATA || !DATA.places) {
      document.getElementById('loading').textContent = '数据加载失败';
      throw new Error('no data');
    }

    // 3 个地点在 3D 世界中的中心坐标（中山居中、南山在南+Z、北山在北-Z）
    const PLACE_POS = {
      zhong: new THREE.Vector3(0, 0, 0),
      nan:   new THREE.Vector3(0, 0, 78),
      bei:   new THREE.Vector3(0, 0, -78)
    };
    const SPREAD = 30; // 地点内异兽散布半径

    let renderer, scene, camera, controls;
    const markers = [];      // 可点击的发光点 mesh
    let actx = null;

    // 解锁进度
    const STORE = 'shj_shanhai_unlocked_v2';
    function getUnlocked() { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { return []; } }
    function saveUnlocked(a) { try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }
    let unlocked = getUnlocked();

    // ---------- 场景 ----------
    function init() {
      const host = document.getElementById('scene');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      host.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfe3ff);          // 明亮天空蓝
      scene.fog = new THREE.Fog(0xcfe8fb, 140, 320);          // 淡雾，远处自然过渡

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 95, 185);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 20;
      controls.maxDistance = 300;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.target.set(0, 4, 0);

      // 光照（明亮写实）
      scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8f4e, 1.05));
      const sun = new THREE.DirectionalLight(0xfff4e0, 1.25);
      sun.position.set(60, 120, 50);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 10; sun.shadow.camera.far = 400;
      sun.shadow.camera.left = -160; sun.shadow.camera.right = 160;
      sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -160;
      scene.add(sun);

      buildTerrain();
      buildWater();
      buildTrees();
      buildPlaceMarkers();

      // 交互
      let downX = 0, downY = 0;
      renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Math.abs(e.clientX - downX) < 6 && Math.abs(e.clientY - downY) < 6) handleClick(e);
      });
      window.addEventListener('resize', onResize);

      buildMiniMap();
      buildChips();
      updateProgress();
      document.getElementById('loading').classList.add('hide');
      animate();
    }

    // 程序化起伏地形（绿山土黄，写实）
    function buildTerrain() {
      const SIZE = 320, SEG = 120;
      const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = [];
      const cLow = new THREE.Color(0x5a8f3c);   // 草地绿
      const cMid = new THREE.Color(0x9a8a55);   // 土黄
      const cHigh = new THREE.Color(0xeef3f6);  // 山顶浅色
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        let h = Math.sin(x * 0.045) * 2.2 + Math.cos(z * 0.04) * 2.2
              + Math.sin((x + z) * 0.025) * 3.0 + Math.sin(x * 0.1 + z * 0.07) * 1.0;
        const d = Math.sqrt(x * x + z * z);
        h += Math.max(0, (d - 110) * 0.06);     // 边缘成山
        // 三处地点附近压平一点，便于放标记
        for (const k in PLACE_POS) {
          const pc = PLACE_POS[k];
          const dd = Math.sqrt((x - pc.x) ** 2 + (z - pc.z) ** 2);
          if (dd < 34) h = h * (dd / 34) * 0.5;  // 局部平缓
        }
        pos.setY(i, h);
        const t = Math.max(0, Math.min(1, (h + 2) / 11));
        const col = new THREE.Color();
        if (t < 0.5) col.copy(cLow).lerp(cMid, t / 0.5);
        else col.copy(cMid).lerp(cHigh, (t - 0.5) / 0.5);
        colors.push(col.r, col.g, col.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 });
      const m = new THREE.Mesh(geo, mat);
      m.receiveShadow = true;
      scene.add(m);
    }

    function buildWater() {
      const water = new THREE.Mesh(
        new THREE.CircleGeometry(26, 48),
        new THREE.MeshStandardMaterial({ color: 0x2f86c4, transparent: true, opacity: 0.78, roughness: 0.22, metalness: 0.15 })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.set(0, 0.6, 0);
      water.receiveShadow = true;
      scene.add(water);
    }

    // 低多边形树木（写实植被感）
    function makeTree(x, z, scale) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5 * scale, 0.7 * scale, 4 * scale, 6),
        new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 })
      );
      trunk.position.y = 2 * scale; trunk.castShadow = true;
      g.add(trunk);
      const greens = [0x3f8f46, 0x4fa657, 0x36913f];
      for (let i = 0; i < 3; i++) {
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry((3 - i) * scale, (4 - i) * scale, 7),
          new THREE.MeshStandardMaterial({ color: greens[i % greens.length], roughness: 1 })
        );
        cone.position.y = (4 + i * 2.4) * scale; cone.castShadow = true;
        g.add(cone);
      }
      g.position.set(x, 0, z);
      return g;
    }
    function buildTrees() {
      // 在每个地点周围撒树，避开标记点
      const avoid = [];
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        p.finds.forEach(f => {
          const wx = pc.x + ((f.scene[0] - 50) / 50) * SPREAD;
          const wz = pc.z + ((f.scene[1] - 50) / 50) * SPREAD;
          avoid.push([wx, wz]);
        });
      });
      let placed = 0, tries = 0;
      while (placed < 90 && tries < 1200) {
        tries++;
        const ang = Math.random() * Math.PI * 2;
        const rad = 20 + Math.random() * 110;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        const lakeD = Math.sqrt(x * x + z * z);
        if (lakeD < 30) continue;                 // 让开中央湖
        let ok = true;
        for (const a of avoid) { if (Math.hypot(x - a[0], z - a[1]) < 7) { ok = false; break; } }
        if (!ok) continue;
        scene.add(makeTree(x, z, 0.8 + Math.random() * 0.7));
        placed++;
      }
      // 岩石点缀
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8f98, roughness: 1, flatShading: true });
      for (let i = 0; i < 26; i++) {
        const ang = Math.random() * Math.PI * 2, rad = 30 + Math.random() * 100;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 32) continue;
        const s = 1 + Math.random() * 2.4;
        const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
        r.position.set(x, s * 0.5, z); r.castShadow = true; r.receiveShadow = true;
        r.rotation.set(Math.random(), Math.random(), Math.random());
        scene.add(r);
      }
    }

    // 每个地点的异兽/草木发光标记
    function buildPlaceMarkers() {
      const typeColor = { '兽': 0xff8a3c, '鸟': 0x3aa0ff, '草': 0x36c46a, '木': 0xb07a3a };
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        // 地点地标：一座浅色山 + 名称
        const beacon = new THREE.Mesh(
          new THREE.ConeGeometry(6, 16, 5),
          new THREE.MeshStandardMaterial({ color: 0xcdd6dc, roughness: 1, flatShading: true })
        );
        beacon.position.set(pc.x, 8, pc.z - 22);
        beacon.castShadow = true;
        scene.add(beacon);
        scene.add(makeLabel(p.name, pc.x, 22, pc.z - 22, '#1f2937', '#ffffff'));

        p.finds.forEach(f => {
          const wx = pc.x + ((f.scene[0] - 50) / 50) * SPREAD;
          const wz = pc.z + ((f.scene[1] - 50) / 50) * SPREAD;
          const col = typeColor[f.type] || 0xffd84a;
          const g = new THREE.Group();
          g.position.set(wx, 0, wz);

          // 细柱
          const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.45, 5, 8),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 })
          );
          pillar.position.y = 2.5; pillar.castShadow = true;
          g.add(pillar);

          // 发光球（可点击）
          const orb = new THREE.Mesh(
            new THREE.SphereGeometry(1.3, 24, 24),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.9, roughness: 0.3 })
          );
          orb.position.y = 6.2;
          orb.userData.find = f;
          orb.userData.baseY = 6.2;
          g.add(orb);
          markers.push(orb);

          // 光环
          const ring = new THREE.Mesh(
            new THREE.TorusGeometry(2.1, 0.1, 8, 32),
            new THREE.MeshBasicMaterial({ color: col })
          );
          ring.position.y = 6.2; ring.rotation.x = Math.PI / 2;
          g.add(ring);
          f._ring = ring;

          scene.add(g);
          f._orb = orb;
        });
      });
    }

    function makeLabel(text, x, y, z, textColor, bg) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = bg;
      roundRect(ctx, 4, 12, 248, 40, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(31,41,55,0.18)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.font = '700 28px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);
      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = 4;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      sp.scale.set(14, 3.5, 1);
      sp.position.set(x, y, z);
      return sp;
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    // ---------- 交互 ----------
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function handleClick(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(markers, false)[0];
      if (hit) selectFind(hit.object.userData.find);
    }

    let flying = false;
    const camPos = new THREE.Vector3(), camTar = new THREE.Vector3();
    function flyTo(px, py, pz, tx, ty, tz) {
      camPos.set(px, py, pz); camTar.set(tx, ty, tz); flying = true; controls.enabled = false;
      document.getElementById('overviewBtn').style.display = 'inline-flex';
    }
    function backToOverview() {
      closeCard();
      flyTo(0, 95, 185, 0, 4, 0);
      document.getElementById('overviewBtn').style.display = 'none';
    }
    window.backToOverview = backToOverview;

    function selectFind(f) {
      const p = f._orb.getWorldPosition(new THREE.Vector3());
      flyTo(p.x + 16, p.y + 10, p.z + 26, p.x, p.y, p.z);
      openCard(f);
      if (unlocked.indexOf(f.id) < 0) {
        unlocked.push(f.id); saveUnlocked(unlocked);
        updateProgress(); buildChips(); chime();
      } else { chime(); }
    }
    function flyToPlace(id) {
      const pc = PLACE_POS[id];
      flyTo(pc.x + 4, 60, pc.z + 95, pc.x, 6, pc.z);
    }

    // ---------- 卡片 ----------
    function openCard(f) {
      document.getElementById('cSvg').innerHTML = f.svg;
      document.getElementById('cName').textContent = f.name;
      document.getElementById('cPy').textContent = f.region;
      document.getElementById('cTag').textContent = f.type + ' · ' + f.region;
      document.getElementById('cBody').innerHTML =
        '<h3>原文</h3><p class="orig">' + esc(f.original) + '</p>' +
        '<h3>白话</h3><p>' + esc(f.baihua) + '</p>' +
        '<h3>形象解读</h3><p>' + esc(f.note) + '</p>';
      document.getElementById('card').classList.add('open');
    }
    function closeCard() { document.getElementById('card').classList.remove('open'); }
    window.closeCard = closeCard;
    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // ---------- 顶部 HUD ----------
    function updateProgress() {
      const total = DATA.places.reduce((n, p) => n + p.finds.length, 0);
      document.getElementById('prog').textContent = '已发现 ' + unlocked.length + ' / ' + total;
    }
    function buildChips() {
      const box = document.getElementById('chips');
      box.innerHTML = '';
      DATA.places.forEach(p => p.finds.forEach(f => {
        const b = document.createElement('button');
        b.className = 'chip' + (unlocked.indexOf(f.id) >= 0 ? ' done' : '');
        b.textContent = f.name;
        b.onclick = () => selectFind(f);
        box.appendChild(b);
      }));
    }

    // ---------- 小地图 / 右侧大地图 ----------
    const typeColorHex = { '兽': '#ff8a3c', '鸟': '#3aa0ff', '草': '#36c46a', '木': '#b07a3a' };
    function buildMiniMap() {
      const mini = document.getElementById('miniSvg');
      const big = document.getElementById('mapSvg');
      [mini, big].forEach(svg => {
        svg.innerHTML = '';
        // 底色（明亮）
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('x', 0); bg.setAttribute('y', 0); bg.setAttribute('width', 100); bg.setAttribute('height', 100);
        bg.setAttribute('fill', '#eaf3fb'); bg.setAttribute('rx', 8);
        svg.appendChild(bg);
        // 中央湖
        const lake = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        lake.setAttribute('cx', 50); lake.setAttribute('cy', 50); lake.setAttribute('r', 9);
        lake.setAttribute('fill', '#bfe0f5');
        svg.appendChild(lake);
        // 地点标记
        DATA.places.forEach(p => {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.style.cursor = 'pointer';
          g.addEventListener('click', () => { togglePanel(false); flyToPlace(p.id); });
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', p.mini[0]); c.setAttribute('cy', p.mini[1]); c.setAttribute('r', 4.5);
          c.setAttribute('fill', '#2fae6a'); c.setAttribute('stroke', '#fff'); c.setAttribute('stroke-width', 1.5);
          g.appendChild(c);
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          t.setAttribute('x', p.mini[0]); t.setAttribute('y', p.mini[1] - 7);
          t.setAttribute('font-size', 6); t.setAttribute('text-anchor', 'middle'); t.setAttribute('fill', '#374151');
          t.setAttribute('font-weight', '700');
          t.textContent = p.name;
          g.appendChild(t);
          // 地点内发现点
          p.finds.forEach(f => {
            const fd = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            const fx = p.mini[0] + ((f.scene[0] - 50) / 50) * 9;
            const fy = p.mini[1] + ((f.scene[1] - 50) / 50) * 9;
            fd.setAttribute('cx', fx); fd.setAttribute('cy', fy); fd.setAttribute('r', 2);
            fd.setAttribute('fill', typeColorHex[f.type] || '#f5c542');
            g.appendChild(fd);
          });
          svg.appendChild(g);
        });
      });
    }
    function togglePanel(force) {
      const panel = document.getElementById('mapPanel');
      const show = (typeof force === 'boolean') ? force : !panel.classList.contains('show');
      panel.classList.toggle('show', show);
      document.getElementById('miniMap').style.display = show ? 'none' : 'block';
    }
    window.togglePanel = togglePanel;

    // 右侧大地图缩放/平移
    const mapState = { scale: 1, x: 0, y: 0 };
    const MAP_W = 100;  // viewBox 基准宽高
    function clampMap() {
      // 可视区域大小 = 100/scale；限制视窗原点在 [0 - span, span] 之内，保证地图不被拖出视野
      const span = MAP_W - MAP_W / mapState.scale;
      mapState.x = Math.max(0, Math.min(span, mapState.x));
      mapState.y = Math.max(0, Math.min(span, mapState.y));
    }
    function applyMapTransform() {
      clampMap();
      const svg = document.getElementById('mapSvg');
      svg.setAttribute('viewBox',
        (0 - mapState.x) + ' ' + (0 - mapState.y) + ' ' + (MAP_W / mapState.scale) + ' ' + (MAP_W / mapState.scale));
    }
    window.zoomMap = function (k) {
      mapState.scale = Math.max(1, Math.min(4, mapState.scale * k));
      applyMapTransform();
    };
    window.resetMap = function () { mapState.scale = 1; mapState.x = 0; mapState.y = 0; applyMapTransform(); };

    (function mapInteractions() {
      const body = document.getElementById('mpBody');
      const svg = document.getElementById('mapSvg');
      body.addEventListener('wheel', e => {
        e.preventDefault();
        const k = e.deltaY < 0 ? 1.12 : 0.89;
        mapState.scale = Math.max(1, Math.min(4, mapState.scale * k));
        applyMapTransform();
      }, { passive: false });
      let dragging = false, lx = 0, ly = 0;
      body.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; body.classList.add('grabbing'); });
      window.addEventListener('pointerup', () => { dragging = false; body.classList.remove('grabbing'); });
      body.addEventListener('pointermove', e => {
        if (!dragging) return;
        const rect = svg.getBoundingClientRect();
        const dx = (e.clientX - lx) / rect.width * (MAP_W / mapState.scale);
        const dy = (e.clientY - ly) / rect.height * (MAP_W / mapState.scale);
        mapState.x += dx; mapState.y += dy; lx = e.clientX; ly = e.clientY;
        applyMapTransform();
      });
    })();

    // ---------- 音效（Web Audio 合成古风五声音阶） ----------
    function ensureAudio() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === 'suspended') actx.resume();
    }
    function chime() {
      ensureAudio(); if (!actx) return;
      const notes = [523.25, 587.33, 659.25, 783.99, 880.0];
      const t0 = actx.currentTime;
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        const s = t0 + i * 0.09;
        g.gain.setValueAtTime(0, s);
        g.gain.linearRampToValueAtTime(0.16, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, s + 0.5);
        o.connect(g).connect(actx.destination);
        o.start(s); o.stop(s + 0.55);
      });
    }

    // ---------- 循环 ----------
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.016;
      markers.forEach(b => {
        b.material.emissiveIntensity = 0.7 + Math.sin(t * 2 + b.position.x) * 0.3;
        b.position.y = b.userData.baseY + Math.sin(t * 1.5 + b.position.x) * 0.3;
        if (b.userData.find._ring) b.userData.find._ring.rotation.z += 0.01;
      });
      if (flying) {
        camera.position.lerp(camPos, 0.08);
        controls.target.lerp(camTar, 0.08);
        camera.lookAt(controls.target);
        if (camera.position.distanceTo(camPos) < 1.2) { flying = false; controls.enabled = true; }
      } else {
        controls.update();
      }
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    try { init(); }
    catch (err) {
      document.getElementById('loading').textContent = '3D 初始化失败：' + (err && err.message ? err.message : err);
    }
    setTimeout(() => {
      const el = document.getElementById('loading');
      if (!el.classList.contains('hide')) el.textContent = '3D 库加载较慢，请确认网络后刷新。';
    }, 9000);
  </script>
</body>
</html>
