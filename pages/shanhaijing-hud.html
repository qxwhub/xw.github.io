<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>山海经 · 山海世界（试作）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l3 7h7l-5.5 4 2 7L12 17l-6.5 4 2-7L2 9h7z' fill='%232fae6a'/%3E%3C/svg%3E">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
      background:#dfeef7; color:#1f2937; }
    #scene { position:fixed; inset:0; }
    canvas { display:block; }

    #hud { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:10px;
      padding:8px 12px; background:rgba(255,255,255,.66); backdrop-filter:blur(8px);
      box-shadow:0 1px 10px rgba(31,41,55,.08); color:#1f2937; pointer-events:none; }
    #hud > * { pointer-events:auto; }
    #hud .spacer { flex:1; }
    /* D-Pad 方向按钮（右下） */
    #dpad { position:fixed; right:24px; bottom:26px; z-index:25; width:160px; height:160px;
      display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
      gap:4px; }
    #dpad .dpad-btn { border:1px solid rgba(31,41,55,.18);
      background:rgba(255,255,255,.58); backdrop-filter:blur(4px); color:#374151;
      font-size:22px; font-weight:700; cursor:pointer; user-select:none;
      box-shadow:0 2px 8px rgba(0,0,0,.12); transition:all .08s; border-radius:12px; }
    #dpad .dpad-btn:active, #dpad .dpad-btn.hold {
      background:rgba(20,184,166,.85); color:#fff; transform:scale(0.92); box-shadow:inset 0 2px 6px rgba(0,0,0,.25); }
    #dpad .up    { grid-column:2; grid-row:1; }
    #dpad .down  { grid-column:2; grid-row:3; }
    #dpad .left  { grid-column:1; grid-row:2; }
    #dpad .right { grid-column:3; grid-row:2; }
    #dpad .center{ grid-column:2; grid-row:2; font-size:18px; background:rgba(47,174,106,.75); color:#fff; }
    #dpad .center:active, #dpad .center.hold { background:rgba(22,163,74,.95); transform:scale(0.92); }

    /* mapPanel 底部环境条（时间/天气/音效） */
    #mapPanel .mp-env { padding:6px 10px; border-top:1px solid #eef0f2; background:#fafbfc; }
    #mapPanel .mp-env .env-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:11px; color:#4b5563; }
    #mapPanel .mp-env label { font-size:11px; color:#6b7280; white-space:nowrap; }
    #mapPanel .mp-env .timeVal { font-size:12px; font-weight:700; color:#1f2937; min-width:44px; font-variant-numeric:tabular-nums; }
    #mapPanel .mp-env .weatherGroup { display:flex; gap:4px; }
    #mapPanel .mp-env .weatherGroup button { border:1px solid rgba(31,41,55,.12); background:#fff;
      border-radius:6px; padding:2px 10px; font-size:11px; color:#4b5563; cursor:pointer; }
    #mapPanel .mp-env .weatherGroup button.on { background:#e0f2fe; border-color:#7dd3fc; color:#0369a1; font-weight:700; }
    #mapPanel .mp-env .toggle { position:relative; width:32px; height:18px; border-radius:999px; background:#d1d5db; cursor:pointer; transition:background .2s; flex-shrink:0; }
    #mapPanel .mp-env .toggle.on { background:#2fae6a; }
    #mapPanel .mp-env .toggle::after { content:''; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%;
      background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
    #mapPanel .mp-env .toggle.on::after { transform:translateX(14px); }

    #miniMap { position:fixed; top:50px; right:10px; z-index:22; width:132px; height:132px; border-radius:14px;
      background:rgba(255,255,255,.94); border:1px solid rgba(31,41,55,.15); box-shadow:0 4px 18px rgba(0,0,0,.12);
      cursor:pointer; overflow:hidden; padding:8px; transition:transform .12s; }
    #miniMap:hover { transform:scale(1.03); }
    #miniMap .mm-title { font-size:11px; font-weight:700; color:#374151; margin-bottom:3px; display:flex; justify-content:space-between; }
    #miniMap svg { width:100%; height:calc(100% - 19px); display:block; }

    #mapPanel { position:fixed; top:50px; right:10px; width:min(88vw,420px); bottom:10px; z-index:30;
      background:rgba(255,255,255,.97); border:1px solid rgba(31,41,55,.15); border-radius:16px;
      box-shadow:0 10px 40px rgba(31,41,55,.22); transform:translateX(115%); transition:transform .32s cubic-bezier(.22,.61,.36,1);
      display:flex; flex-direction:column; overflow:hidden; }
    #mapPanel.show { transform:translateX(0); }
    #mapPanel .mp-head { display:flex; align-items:center; justify-content:flex-end; padding:8px 10px;
      border-bottom:1px solid #eef0f2; }
    #mapPanel .mp-tools { display:flex; gap:5px; align-items:center; }
    #mapPanel .mp-tools .zoomLv { font-size:11px; color:#6b7280; min-width:34px; text-align:center; font-variant-numeric:tabular-nums; }
    #mapPanel .mp-tools button { width:30px; height:30px; border:1px solid rgba(31,41,55,.15); background:#f8fafc;
      border-radius:8px; font-size:16px; color:#374151; cursor:pointer; }
    #mapPanel .mp-tools button:hover { background:#eef2f7; }
    #mapPanel .mp-close { border:none; background:transparent; font-size:18px; color:#9ca3af; cursor:pointer; width:30px; height:30px; }
    #mapPanel .mp-body { flex:1; overflow:hidden; position:relative; cursor:grab; touch-action:none; }
    #mapPanel .mp-body.grabbing { cursor:grabbing; }
    #mapPanel svg { width:100%; height:100%; display:block; touch-action:none; user-select:none; }
    #mapPanel .mp-foot { padding:8px 14px; font-size:11px; color:#9ca3af; border-top:1px solid #eef0f2; }

    #card { position:fixed; top:0; right:0; height:100%; width:380px; max-width:90vw; z-index:40;
      background:#fff; box-shadow:-8px 0 40px rgba(31,41,55,.25); transform:translateX(105%);
      transition:transform .35s cubic-bezier(.22,.61,.36,1); display:flex; flex-direction:column; }
    #card.open { transform:translateX(0); }
    #card .c-head { display:flex; align-items:flex-start; gap:12px; padding:18px 18px 10px; border-bottom:1px solid #eef0f2; }
    #card .c-svg { width:84px; height:84px; flex-shrink:0; background:#f6faf6; border-radius:14px; border:1px solid #e7efe7; padding:6px; }
    #card .c-svg svg { width:100%; height:100%; }
    #card .c-name { flex:1; min-width:0; }
    #card .c-name h2 { font-size:19px; color:#1f2937; }
    #card .c-name .py { font-size:12px; color:#9ca3af; margin-top:2px; }
    #card .c-name .tag { display:inline-block; margin-top:6px; font-size:11px; color:#0d9488; background:#ccfbf1;
      border:1px solid #99f6e4; padding:1px 8px; border-radius:999px; }
    #card .c-close { width:30px; height:30px; flex-shrink:0; border:none; background:#f3f4f6; border-radius:8px;
      color:#6b7280; font-size:16px; cursor:pointer; }
    #card .c-close:hover { background:#e5e7eb; }
    #card .c-body { padding:14px 18px 24px; overflow-y:auto; flex:1; }
    #card .c-body h3 { font-size:13px; color:#e11d48; margin:16px 0 6px; }
    #card .c-body h3:first-child { margin-top:0; }
    #card .c-body p { font-size:13px; color:#4b5563; line-height:1.9; }
    #card .c-body .orig { background:#f6faf6; border-left:3px solid #2fae6a; padding:10px 12px; border-radius:0 8px 8px 0;
      font-size:13px; color:#14532d; line-height:1.9; }
    #card .c-foot { padding:10px 18px 16px; border-top:1px solid #eef0f2; font-size:11px; color:#9ca3af; }

    #nearTip { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:26;
      background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:999px; padding:8px 18px; font-size:13px;
      box-shadow:0 6px 20px rgba(0,0,0,.14); cursor:pointer; font-weight:700; white-space:nowrap; }

    #loading { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
      background:#dfeef7; color:#475569; font-size:14px; }
    #loading.hide { display:none; }

    @media (max-width:560px) {
      #card { width:100%; max-width:100%; }
      #miniMap { width:106px; height:106px; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>

  <div id="hud">
    <div class="spacer"></div>
    <div class="hud-right"></div>
  </div>

  <!-- D-Pad 方向按钮 -->
  <div id="dpad">
    <button class="dpad-btn up" data-key="w">▲</button>
    <button class="dpad-btn left" data-key="a">◀</button>
    <button class="dpad-btn center" id="runBtn" data-key="shift">🏃</button>
    <button class="dpad-btn right" data-key="d">▶</button>
    <button class="dpad-btn down" data-key="s">▼</button>
  </div>

  <div id="nearTip" onclick="viewNear()"></div>

  <div id="miniMap" onclick="togglePanel(true)" title="点击放大地图">
    <div class="mm-title"><span>山海舆图</span><span>⤢</span></div>
    <svg id="miniSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div id="mapPanel">
    <div class="mp-head">
      <div class="mp-tools">
        <button onclick="zoomMap(1.25)" title="放大">＋</button>
        <span class="zoomLv" id="zoomLv">1.0×</span>
        <button onclick="zoomMap(0.8)" title="缩小">－</button>
        <button onclick="resetMap()" title="复位">⟲</button>
        <button class="mp-close" onclick="togglePanel(false)" title="收起">✕</button>
      </div>
    </div>
    <div class="mp-body" id="mpBody">
      <svg id="mapSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="mp-env">
      <div class="env-row">
        <label>时间 <span id="timeVal" class="timeVal">—:—</span></label>
        <label>天气</label>
        <div class="weatherGroup">
          <button id="wClear" class="on" onclick="setWeather('clear')">晴</button>
          <button id="wRain" onclick="setWeather('rain')">雨</button>
          <button id="wSnow" onclick="setWeather('snow')">雪</button>
        </div>
        <label>音效</label>
        <div class="toggle" id="soundToggle" onclick="toggleSound()"></div>
      </div>
    </div>
    <div class="mp-foot">滚轮 / 双指缩放（以光标为中心）· 拖拽平移 · 点击地点飞入该处</div>
  </div>

  <div id="card">
    <div class="c-head">
      <div class="c-svg" id="cSvg"></div>
      <div class="c-name">
        <h2 id="cName">—</h2>
        <div class="py" id="cPy"></div>
        <span class="tag" id="cTag"></span>
      </div>
      <button class="c-close" onclick="closeCard()">✕</button>
    </div>
    <div class="c-body" id="cBody"></div>
    <div class="c-foot">原文取自权威本；白话/解读为整理说明，非逐字译文。</div>
  </div>

  <div id="loading">正在加载山海世界…（需联网加载 3D 库）</div>

  <script src="shanhaijing-map.js?v=20260914"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const DATA = window.SHANHAIJING_MAP;
    if (!DATA || !DATA.places) {
      document.getElementById('loading').textContent = '数据加载失败';
      throw new Error('no data');
    }

    const PLACE_POS = {
      zhong: new THREE.Vector3(0, 0, 0),
      nan:   new THREE.Vector3(0, 0, 78),
      bei:   new THREE.Vector3(0, 0, -78)
    };
    const SPREAD = 30;
    const SUN_DIR = new THREE.Vector3(0.55, 0.72, 0.42).normalize();

    let renderer, scene, camera, controls, clock;
    let sunLight, hemiLight, ambientLight, skyMat, sunSprite, sunGlowMat;
    const markers = [];
    const spinners = [];
    const clouds = [];
    const birds = [];
    const creatures = [];   // 三维活物（异兽/异鸟/异草/异木 + 环境动物），带 update()
    let waterGeo = null, waterBase = null, water = null;
    let actx = null;
    let weatherSystem = null, weatherType = 'clear';
    const _now = new Date();
    let timeOfDay = _now.getHours() + _now.getMinutes() / 60;
    let soundOn = false;
    let audioNodes = { master: null, wind: null, rain: null, water: null, birdInt: null, windGain: null, rainGain: null, waterGain: null };

    const STORE = 'shj_shanhai_unlocked_v2';
    function getUnlocked() { try { return JSON.parse(localStorage.getItem(STORE) || '[]'); } catch (e) { return []; } }
    function saveUnlocked(a) { try { localStorage.setItem(STORE, JSON.stringify(a)); } catch (e) {} }
    let unlocked = getUnlocked();

    // ---------- 地形高度 ----------
    function smoothstep(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    function terrainHeight(x, z) {
      let h = 0;
      h += Math.sin(x * 0.017 + 1.3) * Math.cos(z * 0.015 - 0.7) * 5.6;
      h += Math.sin(x * 0.034 - 0.4) * Math.cos(z * 0.029 + 1.1) * 3.0;
      h += Math.sin((x + z) * 0.012) * 4.2;
      h += Math.sin(x * 0.065 + z * 0.052) * 1.3;
      h += Math.cos(x * 0.11 - z * 0.083) * 0.7;
      h += Math.sin(x * 0.21 + z * 0.17) * 0.3;
      const d = Math.hypot(x, z);
      h += Math.max(0, (d - 120) * 0.14);
      const ridge = Math.pow(Math.abs(Math.sin(x * 0.021 + z * 0.009)), 1.8);
      h += ridge * 9 * Math.max(0, (d - 70) / 110);
      for (const k in PLACE_POS) {
        const pc = PLACE_POS[k];
        const dd = Math.hypot(x - pc.x, z - pc.z);
        const w = smoothstep(18, 48, dd);
        h = h * (0.16 + 0.84 * w) + 0.8;
      }
      return h;
    }

    // ---------- 场景 ----------
    function init() {
      const host = document.getElementById('scene');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      host.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfe3ff);
      scene.fog = new THREE.Fog(0xcfe8fb, 150, 360);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2200);
      camera.position.set(0, 95, 185);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 20;
      controls.maxDistance = 320;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.target.set(0, 4, 0);

      hemiLight = new THREE.HemisphereLight(0xdcefff, 0x6b8f4e, 1.0);
      scene.add(hemiLight);
      ambientLight = new THREE.AmbientLight(0xffffff, 0.18);
      scene.add(ambientLight);
      sunLight = new THREE.DirectionalLight(0xfff4e0, 1.3);
      sunLight.position.copy(SUN_DIR).multiplyScalar(180);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 10; sunLight.shadow.camera.far = 480;
      sunLight.shadow.camera.left = -190; sunLight.shadow.camera.right = 190;
      sunLight.shadow.camera.top = 190; sunLight.shadow.camera.bottom = -190;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      buildSky();
      buildSunGlow();
      buildClouds();
      buildTerrain();
      buildWater();
      buildDistantPeaks();
      buildTrees();
      buildUndergrowth();
      buildBirds();
      buildPlaceMarkers();
      buildAmbientLife();
      buildPlayer();
      applyTime();

      clock = new THREE.Clock();

      let downX = 0, downY = 0;
      renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
      renderer.domElement.addEventListener('pointerup', e => {
        if (Math.abs(e.clientX - downX) < 6 && Math.abs(e.clientY - downY) < 6) handleClick(e);
      });
      window.addEventListener('resize', onResize);

      buildMiniMap();
      updateProgress();
      document.getElementById('loading').classList.add('hide');
      // 直接进入探索模式（和平精英式）
      setWalk(true);

      // 时间跟随真实系统时间
      applyTime();
      document.getElementById('timeVal').textContent = formatTime(timeOfDay);
      setInterval(() => {
        const d = new Date();
        const real = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
        let diff = real - timeOfDay;
        // 处理跨天
        if (diff > 12) diff -= 24;
        if (diff < -12) diff += 24;
        if (Math.abs(diff) > 0.003) setTimeOfDay(real);
      }, 1000);

      // 初始化随机天气 + 运行中随机切换
      const randTypes = ['clear', 'clear', 'rain', 'snow']; // clear 权重高一点
      setWeather(randTypes[Math.floor(Math.random() * randTypes.length)]);
      function scheduleWeather() {
        const delay = 30000 + Math.random() * 150000; // 30~180 秒
        setTimeout(() => {
          if (Math.random() < 0.25) { // 25% 概率变天
            let next;
            do { next = randTypes[Math.floor(Math.random() * randTypes.length)]; } while (next === weatherType && randTypes.length > 1);
            setWeather(next);
          }
          scheduleWeather();
        }, delay);
      }
      scheduleWeather();

      animate();
    }

    // ---------- 天空 / 太阳 / 云 ----------
    function buildSky() {
      skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          top: { value: new THREE.Color(0x3f7fc4) },
          mid: { value: new THREE.Color(0x9cc9ec) },
          bot: { value: new THREE.Color(0xdfeefb) }
        },
        vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
        fragmentShader: [
          'varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;',
          'void main(){',
          '  float h = normalize(vP).y;',
          '  vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.65)) : mix(mid, bot, pow(-h, 0.5));',
          '  gl_FragColor = vec4(c, 1.0);',
          '}'
        ].join('\n')
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(1100, 40, 24), skyMat));
    }
    function radialTex(stops) {
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      stops.forEach(s => g.addColorStop(s[0], s[1]));
      ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(cv);
    }
    function buildSunGlow() {
      const tex = radialTex([[0, 'rgba(255,250,225,1)'], [0.25, 'rgba(255,238,180,0.85)'], [1, 'rgba(255,236,170,0)']]);
      sunGlowMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
      sunSprite = new THREE.Sprite(sunGlowMat);
      sunSprite.position.copy(SUN_DIR).multiplyScalar(720);
      sunSprite.scale.set(220, 220, 1);
      scene.add(sunSprite);
    }
    function cloudTex() {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
      const ctx = cv.getContext('2d');
      for (let i = 0; i < 9; i++) {
        const x = 48 + Math.random() * 160, y = 52 + Math.random() * 36, r = 22 + Math.random() * 30;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,0.92)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      }
      return new THREE.CanvasTexture(cv);
    }
    function buildClouds() {
      for (let i = 0; i < 9; i++) {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex(), transparent: true, depthWrite: false, fog: false }));
        const ang = Math.random() * Math.PI * 2, rad = 120 + Math.random() * 420;
        sp.position.set(Math.cos(ang) * rad, 90 + Math.random() * 90, Math.sin(ang) * rad);
        const s = 80 + Math.random() * 130;
        sp.scale.set(s, s * 0.5, 1);
        sp.userData.speed = 0.6 + Math.random() * 1.2;
        scene.add(sp);
        clouds.push(sp);
      }
    }

    // ---------- 地形 ----------
    function terrainColor(h, jitter) {
      const bands = [
        [0x8fb06b, -99], [0x5e9c3f, 1.2], [0x456f34, 6.0],
        [0x7d7a52, 12.0], [0x928c82, 17.5], [0xf0f4f7, 24.0]
      ];
      let col = new THREE.Color(bands[0][0]);
      for (let i = 1; i < bands.length; i++) {
        if (h <= bands[i][1]) {
          const t = (h - bands[i - 1][1]) / (bands[i][1] - bands[i - 1][1]);
          col = new THREE.Color(bands[i - 1][0]).lerp(new THREE.Color(bands[i][0]), Math.max(0, Math.min(1, t)));
          break;
        }
        col = new THREE.Color(bands[i][0]);
      }
      col.multiplyScalar(1 + jitter * 0.06);
      return col;
    }
    function buildTerrain() {
      const SIZE = 420, SEG = 200;
      const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = [];
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const h = terrainHeight(x, z);
        pos.setY(i, h);
        const jitter = Math.sin(x * 0.9 + z * 0.7) * 0.5 + Math.sin(x * 0.37 - z * 0.51) * 0.5;
        const c = terrainColor(h, jitter);
        colors.push(c.r, c.g, c.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.98, metalness: 0 }));
      m.receiveShadow = true;
      scene.add(m);
    }

    // ---------- 湖（网格平面 + 透明遮罩 + 波浪） ----------
    function shorelineAlpha() {
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 30, 128, 128, 126);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.68, '#ffffff');
      g.addColorStop(1, '#000000');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
      const t = new THREE.CanvasTexture(cv);
      return t;
    }
    function buildWater() {
      const SZ = 64, SEGW = 44;
      const geo = new THREE.PlaneGeometry(SZ, SZ, SEGW, SEGW);
      geo.rotateX(-Math.PI / 2);
      waterBase = Float32Array.from(geo.attributes.position.array);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x2f86c4, transparent: true, opacity: 0.9, roughness: 0.08, metalness: 0.6,
        alphaMap: shorelineAlpha(), depthWrite: false
      });
      water = new THREE.Mesh(geo, mat);
      water.position.set(0, 0.9, 0);
      scene.add(water);
      waterGeo = geo;
    }

    // ---------- 远山雪峰 ----------
    function buildDistantPeaks() {
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x8d8a8f, roughness: 1, flatShading: true });
      const snowMat = new THREE.MeshStandardMaterial({ color: 0xf3f6f9, roughness: 0.9, flatShading: true });
      const count = 12;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + Math.random() * 0.2;
        const rad = 175 + Math.random() * 70;
        const hgt = 34 + Math.random() * 40;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        const base = new THREE.Mesh(new THREE.ConeGeometry(hgt * 0.62, hgt, 6), rockMat);
        base.position.set(x, hgt / 2 - 2, z);
        scene.add(base);
        const cap = new THREE.Mesh(new THREE.ConeGeometry(hgt * 0.3, hgt * 0.42, 6), snowMat);
        cap.position.set(x, hgt * 0.82, z);
        scene.add(cap);
      }
    }

    // ---------- 植被 ----------
    function makeInstanced(geo, mat, count) {
      const im = new THREE.InstancedMesh(geo, mat, Math.max(count, 1));
      im.castShadow = true; im.receiveShadow = true;
      im.count = count;
      return im;
    }
    function fillInstances(ims, list, scaleJitter, leafColorFn) {
      const M = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3(), col = new THREE.Color();
      list.forEach((pos, i) => {
        const sc = (0.85 + Math.random() * scaleJitter);
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI * 2);
        s.set(sc, sc * (0.9 + Math.random() * 0.35), sc);
        p.set(pos[0], pos[1], pos[2]);
        M.compose(p, q, s);
        ims.forEach((im, idx) => {
          im.setMatrixAt(i, M);
          if (leafColorFn && idx > 0) { col.copy(leafColorFn()); im.setColorAt(i, col); }
        });
      });
      ims.forEach(im => {
        im.instanceMatrix.needsUpdate = true;
        if (im.instanceColor) im.instanceColor.needsUpdate = true;
        scene.add(im);
      });
    }
    function avoidPoints() {
      const avoid = [];
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        p.finds.forEach(f => {
          avoid.push([pc.x + ((f.scene[0] - 50) / 50) * SPREAD, pc.z + ((f.scene[1] - 50) / 50) * SPREAD]);
        });
      });
      return avoid;
    }
    function buildTrees() {
      const avoid = avoidPoints();
      const pines = [], broads = [];
      let tries = 0;
      while (pines.length + broads.length < 280 && tries < 7000) {
        tries++;
        const ang = Math.random() * Math.PI * 2;
        const rad = 26 + Math.random() * 168;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 33) continue;
        if (Math.hypot(x, z) > 198) continue;
        let ok = true;
        for (const a of avoid) if (Math.hypot(x - a[0], z - a[1]) < 7.5) { ok = false; break; }
        if (!ok) continue;
        const y = terrainHeight(x, z);
        if (y > 26) continue;
        (Math.random() < 0.55 ? pines : broads).push([x, y, z]);
      }
      const pineCol = () => new THREE.Color().setHSL(0.31 + Math.random() * 0.05, 0.42 + Math.random() * 0.16, 0.24 + Math.random() * 0.1);
      const broadCol = () => new THREE.Color().setHSL(0.27 + Math.random() * 0.07, 0.4 + Math.random() * 0.2, 0.3 + Math.random() * 0.12);
      if (pines.length) {
        const trunkGeo = new THREE.CylinderGeometry(0.22, 0.34, 1.8, 6); trunkGeo.translate(0, 0.9, 0);
        const c1 = new THREE.ConeGeometry(1.75, 3.1, 7); c1.translate(0, 2.7, 0);
        const c2 = new THREE.ConeGeometry(1.25, 2.7, 7); c2.translate(0, 4.5, 0);
        const c3 = new THREE.ConeGeometry(0.78, 2.1, 7); c3.translate(0, 6.1, 0);
        fillInstances([
          makeInstanced(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 1 }), pines.length),
          makeInstanced(c1, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), pines.length),
          makeInstanced(c2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), pines.length),
          makeInstanced(c3, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), pines.length)
        ], pines, 0.9, pineCol);
      }
      if (broads.length) {
        const trunkGeo = new THREE.CylinderGeometry(0.26, 0.4, 2.6, 6); trunkGeo.translate(0, 1.3, 0);
        const ball = new THREE.IcosahedronGeometry(2.1, 1); ball.translate(0, 4.0, 0);
        const ball2 = new THREE.IcosahedronGeometry(1.4, 1); ball2.translate(0.9, 5.0, 0.4);
        fillInstances([
          makeInstanced(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 1 }), broads.length),
          makeInstanced(ball, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), broads.length),
          makeInstanced(ball2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), broads.length)
        ], broads, 0.85, broadCol);
      }
      // 岩石
      const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8f98, roughness: 1, flatShading: true });
      for (let i = 0; i < 34; i++) {
        const ang = Math.random() * Math.PI * 2, rad = 30 + Math.random() * 150;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 32) continue;
        const s = 1 + Math.random() * 2.6;
        const r = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
        r.position.set(x, terrainHeight(x, z) + s * 0.35, z);
        r.castShadow = true; r.receiveShadow = true;
        r.rotation.set(Math.random(), Math.random(), Math.random());
        scene.add(r);
      }
    }

    // ---------- 低层植被：草丛 + 灌木 ----------
    function buildUndergrowth() {
      const avoid = avoidPoints();
      const tufts = [], bushes = [];
      let tries = 0;
      while (tufts.length + bushes.length < 620 && tries < 9000) {
        tries++;
        const ang = Math.random() * Math.PI * 2;
        const rad = 24 + Math.random() * 175;
        const x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
        if (Math.hypot(x, z) < 33) continue;
        let near = false;
        for (const a of avoid) if (Math.hypot(x - a[0], z - a[1]) < 4.5) { near = true; break; }
        if (near) continue;
        const y = terrainHeight(x, z);
        if (y > 22) continue;
        if (Math.random() < 0.22 && bushes.length < 130) bushes.push([x, y, z]);
        else tufts.push([x, y, z]);
      }
      if (tufts.length) {
        const g = new THREE.ConeGeometry(0.22, 0.95, 4); g.translate(0, 0.48, 0);
        const colFn = () => new THREE.Color().setHSL(0.26 + Math.random() * 0.06, 0.5 + Math.random() * 0.2, 0.34 + Math.random() * 0.14);
        fillInstances([makeInstanced(g, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), tufts.length)], tufts, 0.9, colFn);
      }
      if (bushes.length) {
        const g = new THREE.IcosahedronGeometry(0.95, 0); g.scale(1, 0.72, 1); g.translate(0, 0.6, 0);
        const colFn = () => new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.42 + Math.random() * 0.18, 0.26 + Math.random() * 0.12);
        fillInstances([makeInstanced(g, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true }), bushes.length)], bushes, 0.7, colFn);
      }
    }

    // ---------- 飞鸟 ----------
    function buildBirds() {
      const mat = new THREE.MeshStandardMaterial({ color: 0x3a424c, roughness: 1, side: THREE.DoubleSide });
      for (let f = 0; f < 4; f++) {
        const cx = (Math.random() - 0.5) * 120, cz = (Math.random() - 0.5) * 160;
        const r = 40 + Math.random() * 60, y = 34 + Math.random() * 22;
        for (let b = 0; b < 4; b++) {
          const g = new THREE.Group();
          const wingGeo = new THREE.BoxGeometry(1.5, 0.07, 0.4);
          const left = new THREE.Mesh(wingGeo, mat); left.position.x = -0.75;
          const right = new THREE.Mesh(wingGeo, mat); right.position.x = 0.75;
          g.add(left, right);
          g.userData.a = Math.random() * Math.PI * 2;
          g.userData.r = r + (Math.random() - 0.5) * 16;
          g.userData.y = y + (Math.random() - 0.5) * 6;
          g.userData.cx = cx; g.userData.cz = cz;
          g.userData.spd = (0.25 + Math.random() * 0.2) * (Math.random() < 0.5 ? 1 : -1);
          g.userData.ph = Math.random() * 6;
          g.userData.left = left; g.userData.right = right;
          g.scale.setScalar(0.8 + Math.random() * 0.6);
          scene.add(g);
          birds.push(g);
        }
      }
    }

    // ---------- 三维活物建模（程序化组合 + 关节动画，不是几何块替代） ----------
    function M(color, opts) {
      return new THREE.MeshStandardMaterial(Object.assign(
        { color: color, roughness: 0.78, metalness: 0.02 }, opts || {}));
    }
    function ell(rx, ry, rz, seg) {
      const g = new THREE.SphereGeometry(1, seg || 20, Math.max(8, (seg || 20) - 6));
      g.scale(rx, ry, rz);
      return g;
    }
    function addMesh(parent, geo, mat, x, y, z, rx, ry, rz) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x || 0, y || 0, z || 0);
      m.rotation.set(rx || 0, ry || 0, rz || 0);
      m.castShadow = true;
      parent.add(m);
      return m;
    }

    // 四足动物：狐狸(九尾)/鹿/兔 通用骨架（躯干+颈+头+双耳+四腿关节+尾）
    function buildQuadruped(o) {
      o = Object.assign({
        body: 0xe8703a, belly: 0xf7ead6, paw: 0x5b2f18, earIn: 0xe9a0a8,
        tails: 9, tailLen: 1.0, antler: false, earH: 0.72, earW: 0.30,
        bodyScale: [1.15, 1.0, 2.0], legH: 1.2, scale: 1.75, hop: false, speed: 2.0
      }, o || {});
      const root = new THREE.Group();
      const fur = M(o.body), bellyM = M(o.belly), pawM = M(o.paw);
      const lift = new THREE.Group(); lift.position.y = o.legH * 1.95 - 1.45; root.add(lift);
      const core = new THREE.Group(); lift.add(core);

      addMesh(core, ell(o.bodyScale[0], o.bodyScale[1], o.bodyScale[2]), fur, 0, 1.55, 0);
      addMesh(core, ell(o.bodyScale[0] * 0.72, o.bodyScale[1] * 0.7, o.bodyScale[2] * 0.78), bellyM, 0, 1.12, 0.22);
      addMesh(core, ell(0.6, 0.6, 0.68), fur, 0, 2.25, 1.5);

      const head = new THREE.Group(); head.position.set(0, 2.72, 1.98); core.add(head);
      addMesh(head, ell(0.7, 0.64, 0.76), fur, 0, 0, 0);
      addMesh(head, new THREE.ConeGeometry(0.33, 0.92, 14), fur, 0, -0.12, 0.82, Math.PI / 2, 0, 0);
      addMesh(head, ell(0.15, 0.12, 0.1), M(0x241a14, { roughness: 0.3 }), 0, -0.1, 1.26);
      [-1, 1].forEach(s => {
        addMesh(head, new THREE.ConeGeometry(o.earW, o.earH, 4), fur, s * 0.4, 0.62 + o.earH * 0.3, -0.05, -0.16, s * 0.34, 0);
        addMesh(head, new THREE.ConeGeometry(o.earW * 0.55, o.earH * 0.62, 4), M(o.earIn), s * 0.42, 0.6 + o.earH * 0.3, 0.07, -0.16, s * 0.34, 0);
        addMesh(head, ell(0.1, 0.12, 0.08), M(0x14141a, { roughness: 0.22 }), s * 0.31, 0.1, 0.64);
      });
      if (o.antler) {
        const am = M(0xd9c9a6, { flatShading: true });
        [-1, 1].forEach(s => {
          addMesh(head, new THREE.CylinderGeometry(0.05, 0.08, 0.9, 6), am, s * 0.3, 0.8, -0.12, -0.25, 0, s * 0.5);
          addMesh(head, new THREE.CylinderGeometry(0.04, 0.06, 0.55, 6), am, s * 0.55, 1.25, -0.12, -0.25, 0, s * 1.1);
          addMesh(head, new THREE.CylinderGeometry(0.035, 0.05, 0.45, 6), am, s * 0.72, 1.5, -0.12, -0.25, 0, s * 1.5);
        });
      }

      const legs = [];
      [[-0.52, 1.1], [0.52, 1.1], [-0.56, -1.0], [0.56, -1.0]].forEach((p, i) => {
        const hip = new THREE.Group(); hip.position.set(p[0], 1.45, p[1]); core.add(hip);
        addMesh(hip, new THREE.CylinderGeometry(0.28, 0.2, o.legH, 10), fur, 0, -o.legH / 2, 0);
        const knee = new THREE.Group(); knee.position.set(0, -o.legH, 0); hip.add(knee);
        addMesh(knee, new THREE.CylinderGeometry(0.2, 0.15, o.legH * 0.92, 10), fur, 0, -o.legH * 0.46, 0);
        addMesh(knee, ell(0.24, 0.14, 0.32), pawM, 0, -o.legH * 0.95, 0.06);
        legs.push({ hip: hip, knee: knee, phase: (i === 0 || i === 3) ? 0 : Math.PI, s: (p[0] > 0 ? 1 : -1) });
      });

      const tails = [];
      const n = Math.max(1, o.tails | 0);
      for (let i = 0; i < n; i++) {
        const a = n === 1 ? 0 : (i / (n - 1) - 0.5) * 1.6;
        const tg = new THREE.Group(); tg.position.set(0, 1.9, -1.8); tg.rotation.y = a; core.add(tg);
        const t1 = new THREE.Group(); t1.rotation.x = -0.55; tg.add(t1);
        addMesh(t1, new THREE.CylinderGeometry(0.19, 0.25, 1.25 * o.tailLen, 9), fur, 0, 0.62 * o.tailLen, 0);
        const t2 = new THREE.Group(); t2.position.set(0, 1.25 * o.tailLen, 0); t2.rotation.x = -0.5; t1.add(t2);
        addMesh(t2, new THREE.CylinderGeometry(0.14, 0.2, 0.95 * o.tailLen, 9), fur, 0, 0.47 * o.tailLen, 0);
        addMesh(t2, ell(0.28, 0.32, 0.28), n > 1 ? bellyM : fur, 0, 0.95 * o.tailLen, 0);
        tails.push({ g: tg, t1: t1, t2: t2, phase: i * 0.75 });
      }

      root.scale.setScalar(o.scale);
      const spd = o.speed;
      return {
        root: root,
        update: function (t) {
          const w = Math.sin(t * spd);
          core.position.y = o.hop ? Math.abs(Math.sin(t * spd)) * 0.5 : Math.abs(w) * 0.11;
          core.rotation.x = w * 0.02;
          core.rotation.y = Math.sin(t * 0.42) * 0.2;
          legs.forEach(L => {
            L.hip.rotation.x = w * (o.hop ? 0.85 : 0.5);
            L.knee.rotation.x = Math.max(0, -w) * (o.hop ? 1.0 : 0.6);
            L.hip.rotation.z = L.s * 0.06;
          });
          tails.forEach(T => {
            T.t1.rotation.x = -0.55 + Math.sin(t * 1.6 + T.phase) * (o.hop ? 0.05 : 0.16);
            T.t2.rotation.x = -0.5 + Math.sin(t * 1.9 + T.phase + 0.6) * 0.2;
            T.g.rotation.z = Math.sin(t * 1.5 + T.phase) * 0.26;
          });
        }
      };
    }

    // 鸟类：凤凰/精卫（躯干+头+喙+凤冠+双翼两段关节+尾羽扇+双腿）
    function buildBird(o) {
      o = Object.assign({
        body: 0xe23b2b, belly: 0xf7e2b8, wing: 0xf2a01c, tail: 0xf7d64a,
        beak: 0xf5c542, crest: true, scale: 1.25, flap: 4.2, speed: 2.0
      }, o || {});
      const root = new THREE.Group();
      const bodyM = M(o.body), wingM = M(o.wing, { flatShading: true }), tailM = M(o.tail);
      const lift = new THREE.Group(); lift.position.y = -1.0; root.add(lift);
      const core = new THREE.Group(); lift.add(core);

      addMesh(core, ell(0.92, 0.88, 1.65), bodyM, 0, 2.6, 0);
      addMesh(core, ell(0.68, 0.6, 1.0), M(o.belly), 0, 2.3, 0.45);

      const head = new THREE.Group(); head.position.set(0, 3.5, 1.3); core.add(head);
      addMesh(head, ell(0.58, 0.56, 0.6), bodyM, 0, 0, 0);
      addMesh(head, new THREE.ConeGeometry(0.21, 0.68, 12), M(o.beak), 0, -0.06, 0.6, Math.PI / 2, 0, 0);
      [-1, 1].forEach(s => addMesh(head, ell(0.1, 0.12, 0.09), M(0x14141a, { roughness: 0.2 }), s * 0.26, 0.12, 0.48));
      if (o.crest) {
        for (let i = 0; i < 3; i++) {
          const hh = 0.95 - i * 0.2;
          addMesh(head, new THREE.ConeGeometry(0.085, hh, 6), tailM, (i - 1) * 0.17, 0.5 + hh / 2 - 0.35, -0.18, 0.55, 0, (i - 1) * 0.28);
        }
      }

      const wings = [];
      [-1, 1].forEach(s => {
        const w = new THREE.Group(); w.position.set(s * 0.72, 3.0, 0.1); core.add(w);
        addMesh(w, ell(1.45, 0.12, 0.82), wingM, s * 1.35, 0, 0);
        const outer = new THREE.Group(); outer.position.set(s * 2.6, 0, 0); w.add(outer);
        addMesh(outer, ell(1.4, 0.09, 0.58), wingM, s * 1.25, 0, -0.04);
        for (let i = 0; i < 4; i++) addMesh(outer, ell(0.85, 0.055, 0.14), tailM, s * 2.1, 0, -0.26 - i * 0.15);
        wings.push({ w: w, outer: outer, s: s });
      });

      const tail = new THREE.Group(); tail.position.set(0, 2.45, -1.55); core.add(tail);
      for (let i = -2; i <= 2; i++) {
        const f = new THREE.Group(); f.rotation.y = i * 0.26; tail.add(f);
        addMesh(f, ell(0.2, 0.055, 1.85), (i === 0 ? tailM : wingM), 0, 0, -1.45, -0.08, 0, 0);
      }

      const legM = M(0xe8a83c);
      [-1, 1].forEach(s => {
        addMesh(core, new THREE.CylinderGeometry(0.06, 0.05, 0.95, 7), legM, s * 0.28, 1.55, 0.1);
        addMesh(core, ell(0.15, 0.05, 0.28), legM, s * 0.28, 1.02, 0.24);
      });

      root.scale.setScalar(o.scale);
      return {
        root: root,
        update: function (t) {
          const fl = Math.sin(t * o.flap);
          wings.forEach(W => {
            W.w.rotation.z = W.s * (0.3 + fl * 0.5);
            W.outer.rotation.z = W.s * (0.22 + fl * 0.45);
            W.w.rotation.x = fl * 0.1;
          });
          core.position.y = 0.35 + Math.sin(t * o.speed) * 0.3;
          core.rotation.z = fl * 0.05;
          tail.rotation.x = -0.05 + Math.sin(t * 2.3) * 0.12;
          head.rotation.y = Math.sin(t * 0.6) * 0.28;
        }
      };
    }

    // 灵草：祝余/茇（多片弯曲叶 + 发光花穗，随风摇曳）
    function buildGrassClump(o) {
      o = Object.assign({ leaf: 0x36a85a, leaf2: 0x7ccf6a, flower: 0xfff3c4, count: 8, h: 2.2, glow: true, scale: 1.6 }, o || {});
      const root = new THREE.Group();
      const lm1 = M(o.leaf, { side: THREE.DoubleSide, flatShading: true });
      const lm2 = M(o.leaf2, { side: THREE.DoubleSide, flatShading: true });
      const blades = [];
      for (let i = 0; i < o.count; i++) {
        const g = new THREE.Group();
        g.rotation.y = i * (Math.PI * 2 / o.count) + 0.3;
        g.rotation.z = 0.34 + (i % 3) * 0.09;
        root.add(g);
        const geo = new THREE.PlaneGeometry(0.34, o.h, 2, 7);
        const pos = geo.attributes.position;
        for (let k = 0; k < pos.count; k++) {
          const u = (pos.getY(k) + o.h / 2) / o.h;
          pos.setZ(k, -Math.pow(u, 2) * o.h * 0.42);
          pos.setX(k, pos.getX(k) * (1 - u * 0.8));
        }
        geo.computeVertexNormals();
        const leaf = new THREE.Mesh(geo, (i % 2) ? lm2 : lm1);
        leaf.position.y = o.h / 2;
        leaf.castShadow = true;
        g.add(leaf);
        blades.push({ g: g, phase: i * 0.55, base: g.rotation.z });
      }
      if (o.flower) {
        const fm = M(o.flower, { emissive: o.flower, emissiveIntensity: o.glow ? 0.5 : 0 });
        for (let i = 0; i < 4; i++) {
          const a = i * Math.PI / 2 + 0.5;
          addMesh(root, new THREE.CylinderGeometry(0.025, 0.035, o.h * 0.5, 6), M(0x4e9a4a),
            Math.sin(a) * 0.32, o.h * 0.6, Math.cos(a) * 0.32, 0, 0, -Math.sin(a) * 0.3);
          addMesh(root, new THREE.IcosahedronGeometry(0.19, 0), fm, Math.sin(a) * 0.5, o.h * 0.86, Math.cos(a) * 0.5);
        }
      }
      root.scale.setScalar(o.scale);
      return {
        root: root,
        update: function (t) {
          blades.forEach(B => {
            B.g.rotation.z = B.base + Math.sin(t * 1.5 + B.phase) * 0.16;
            B.g.rotation.x = Math.cos(t * 1.2 + B.phase) * 0.1;
          });
          root.rotation.z = Math.sin(t * 0.9) * 0.03;
        }
      };
    }

    // 灵木：帝休（树干+分叉+盘根+层叠树冠+果实，树冠随风轻摆）
    function buildTreeCreature(o) {
      o = Object.assign({ trunk: 0x8a5a34, leaf: 0x3f9c4a, leaf2: 0x67c06a, fruit: 0xef6b4a, h: 8.4, scale: 1.0 }, o || {});
      const root = new THREE.Group();
      const trunkM = M(o.trunk, { flatShading: true });
      addMesh(root, new THREE.CylinderGeometry(0.34, 0.62, o.h * 0.62, 9), trunkM, 0, o.h * 0.31, 0);
      [-1, 1].forEach(s => addMesh(root, new THREE.CylinderGeometry(0.13, 0.2, o.h * 0.3, 7), trunkM, s * 0.55, o.h * 0.6, 0, 0, 0, s * 0.6));
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + 0.4;
        addMesh(root, new THREE.CylinderGeometry(0.1, 0.2, 0.9, 6), trunkM, Math.sin(a) * 0.5, 0.3, Math.cos(a) * 0.5, Math.sin(a) * 0.7, 0, -Math.cos(a) * 0.7);
      }
      const crown = new THREE.Group(); crown.position.y = o.h * 0.72; root.add(crown);
      const cm = M(o.leaf, { flatShading: true }), cm2 = M(o.leaf2, { flatShading: true });
      const blobs = [[0, 0.7, 0, 2.0], [-1.3, 0.2, 0.5, 1.5], [1.3, 0.1, -0.4, 1.55], [0.2, -0.5, -1.2, 1.35], [-0.4, -0.4, 1.25, 1.3]];
      blobs.forEach((b, i) => {
        addMesh(crown, new THREE.IcosahedronGeometry(b[3], 1), (i % 2 ? cm2 : cm), b[0], b[1], b[2]).scale.set(1, 0.82, 1);
      });
      const fruitM = M(o.fruit, { emissive: o.fruit, emissiveIntensity: 0.25 });
      for (let i = 0; i < 6; i++) {
        const a = i * 1.9, r = 1.5 + (i % 3) * 0.45;
        addMesh(crown, new THREE.SphereGeometry(0.16, 10, 10), fruitM, Math.sin(a) * r, -0.15 + (i % 4) * 0.35, Math.cos(a) * r);
      }
      root.scale.setScalar(o.scale);
      return {
        root: root,
        update: function (t) {
          crown.rotation.z = Math.sin(t * 0.8) * 0.05;
          crown.rotation.x = Math.cos(t * 0.65) * 0.04;
          crown.position.y = o.h * 0.72 + Math.sin(t * 0.9) * 0.06;
        }
      };
    }

    // 按数据条目选模型
    function buildCreature(f) {
      if (f.type === '兽') return buildQuadruped({ tails: 9, tailLen: 1.0, scale: 1.75, speed: 2.0 });
      if (f.type === '鸟') {
        if (f.id === 'jingwei') {
          return buildBird({ body: 0x333a45, belly: 0xf1f5fa, wing: 0x4d5664, tail: 0xdfe7f0, beak: 0xf1c04a, crest: false, scale: 1.15 });
        }
        return buildBird({ scale: 1.25 });
      }
      if (f.type === '草') {
        if (f.id === 'ba') return buildGrassClump({ leaf: 0x5aa83c, leaf2: 0x8ed166, flower: 0xf3e18a, h: 2.0, scale: 1.5 });
        return buildGrassClump({ leaf: 0x2fa75a, leaf2: 0x79d07c, flower: 0xfff0b8, h: 2.3, scale: 1.6 });
      }
      if (f.type === '木') return buildTreeCreature({ scale: 1.0 });
      return buildQuadruped({ tails: 1, scale: 1.2 });
    }

    // 环境活物：各地点周边散布鹿群、野兔，地面有活物走动
    function buildAmbientLife() {
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * Math.PI * 2 + 0.7;
          const d = 15 + i * 5;
          const x = pc.x + Math.cos(a) * d, z = pc.z + Math.sin(a) * d;
          const deer = buildQuadruped({
            body: 0xb27b46, belly: 0xf2e6d3, paw: 0x4a3222, earIn: 0xd7b38c,
            tails: 1, tailLen: 0.55, antler: true, earH: 0.65, earW: 0.24,
            legH: 1.7, scale: 1.3, speed: 1.5
          });
          deer.root.position.set(x, terrainHeight(x, z), z);
          deer.root.rotation.y = a + Math.PI / 2;
          scene.add(deer.root);
          creatures.push(deer);
        }
        for (let i = 0; i < 4; i++) {
          const a = Math.random() * Math.PI * 2, d = 8 + Math.random() * 15;
          const x = pc.x + Math.cos(a) * d, z = pc.z + Math.sin(a) * d;
          const rab = buildQuadruped({
            body: 0xcfc3ae, belly: 0xfbf7ef, paw: 0x9a8f7c, earIn: 0xe7a9a9,
            tails: 1, tailLen: 0.32, earH: 1.15, earW: 0.16,
            bodyScale: [0.85, 0.8, 1.25], legH: 0.7, scale: 1.0, hop: true, speed: 5.0
          });
          rab.root.position.set(x, terrainHeight(x, z), z);
          rab.root.rotation.y = Math.random() * Math.PI * 2;
          scene.add(rab.root);
          creatures.push(rab);
        }
      });
    }

    // ---------- 人物视角探索（自由走动） ----------
    let walkMode = false;
    let firstPerson = false;
    let player = null;
    let yaw = 0, pitch = -0.22;
    let nearFind = null;
    let walking = false, running = false;
    const keys = Object.create(null);
    const joy = { active: false, x: 0, y: 0, cx: 0, cy: 0 };

    function buildHuman() {
      const root = new THREE.Group();
      const skin = M(0xf2cba3), cloth = M(0x2f9e78), cloth2 = M(0x216b52), hair = M(0x2a2119);
      const lift = new THREE.Group(); lift.position.y = 0.92; root.add(lift);
      const core = new THREE.Group(); lift.add(core);

      addMesh(core, ell(0.5, 0.62, 0.34), cloth, 0, 2.05, 0);
      addMesh(core, ell(0.46, 0.42, 0.32), cloth2, 0, 1.42, 0);
      addMesh(core, ell(0.52, 0.2, 0.36), M(0xdcae6a), 0, 1.72, 0);      // 腰束

      const head = new THREE.Group(); head.position.set(0, 2.92, 0); core.add(head);
      addMesh(head, ell(0.33, 0.37, 0.33), skin, 0, 0, 0);
      addMesh(head, ell(0.36, 0.3, 0.36), hair, 0, 0.14, -0.02);
      addMesh(head, new THREE.CylinderGeometry(0.2, 0.24, 0.26, 10), hair, 0, 0.02, -0.3);
      [-1, 1].forEach(s => addMesh(head, ell(0.052, 0.062, 0.04), M(0x241f1a, { roughness: 0.25 }), s * 0.13, 0.01, 0.3));

      const arms = [];
      [-1, 1].forEach(s => {
        const sh = new THREE.Group(); sh.position.set(s * 0.54, 2.48, 0); core.add(sh);
        addMesh(sh, new THREE.CylinderGeometry(0.12, 0.1, 0.95, 8), cloth, 0, -0.48, 0);
        const el = new THREE.Group(); el.position.set(0, -0.96, 0); sh.add(el);
        addMesh(el, new THREE.CylinderGeometry(0.1, 0.088, 0.85, 8), skin, 0, -0.42, 0);
        arms.push({ sh: sh, el: el, s: s });
      });

      const legs = [];
      [-1, 1].forEach(s => {
        const hip = new THREE.Group(); hip.position.set(s * 0.24, 1.08, 0); core.add(hip);
        addMesh(hip, new THREE.CylinderGeometry(0.17, 0.14, 1.0, 8), cloth2, 0, -0.5, 0);
        const kn = new THREE.Group(); kn.position.set(0, -1.02, 0); hip.add(kn);
        addMesh(kn, new THREE.CylinderGeometry(0.14, 0.12, 0.95, 8), cloth2, 0, -0.46, 0);
        addMesh(kn, ell(0.16, 0.1, 0.26), M(0x3a2f26), 0, -0.96, 0.09);
        legs.push({ hip: hip, kn: kn, s: s });
      });

      root.scale.setScalar(1.6);
      return {
        root: root,
        update: function (t, dt, moving, isRun) {
          const sp = isRun ? 11 : 7.4;
          const w = moving ? Math.sin(t * sp) : 0;
          legs.forEach(L => {
            L.hip.rotation.x = w * 0.7;
            L.kn.rotation.x = Math.max(0, -w) * 0.85;
          });
          arms.forEach(A => {
            A.sh.rotation.x = -w * 0.55;
            A.el.rotation.x = moving ? (-0.2 - Math.max(0, w) * 0.4) : -0.18;
          });
          core.position.y = moving ? Math.abs(Math.sin(t * sp)) * 0.12 : Math.sin(t * 2) * 0.035;
          if (moving) head.rotation.y = Math.sin(t * 0.5) * 0.1;
        }
      };
    }

    function buildPlayer() {
      player = buildHuman();
      player.root.position.set(0, terrainHeight(0, 12), 12);
      player.root.visible = false;
      scene.add(player.root);
    }

    function setWalk(on) {
      if (walkMode === on) return;
      walkMode = on;
      if (walkMode) {
        if (document.getElementById('mapPanel').classList.contains('show')) togglePanel(false);
        player.root.visible = true;
        const tgt = controls.target;
        const px = tgt.x, pz = tgt.z + 8;
        player.root.position.set(px, terrainHeight(px, pz), pz);
        yaw = Math.atan2(-px, -pz);
        pitch = -0.22;
        controls.enabled = false;
      } else {
        firstPerson = false;
        player.root.visible = false;
        controls.enabled = true;
        nearFind = null;
        document.getElementById('nearTip').classList.remove('show');
      }
      // UI 同步
      document.getElementById('dpad').style.display = walkMode ? 'grid' : 'none';
      document.getElementById('miniMap').style.display = walkMode ? '' : 'none';
    }

    function lerpAngle(a, b, k) {
      let d = ((b - a) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
      return a + d * k;
    }

    function updateWalk(dt) {
      let mx = 0, mz = 0;
      if (keys['w'] || keys['arrowup']) mz += 1;
      if (keys['s'] || keys['arrowdown']) mz -= 1;
      if (keys['a'] || keys['arrowleft']) mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;
      mx += joy.x; mz += -joy.y;
      const len = Math.hypot(mx, mz);
      walking = len > 0.06;
      running = !!keys['shift'];

      if (walking) {
        const fwdX = Math.sin(yaw), fwdZ = Math.cos(yaw);
        const rgtX = Math.cos(yaw), rgtZ = -Math.sin(yaw);
        const dx = (fwdX * mz + rgtX * mx) / Math.max(1, len);
        const dz = (fwdZ * mz + rgtZ * mx) / Math.max(1, len);
        const spd = (running ? 30 : 15) * Math.min(1, len);
        const P = player.root.position;
        P.x += dx * spd * dt; P.z += dz * spd * dt;
        const R = 135, rr = Math.hypot(P.x, P.z);
        if (rr > R) { P.x = P.x / rr * R; P.z = P.z / rr * R; }
        player.root.rotation.y = lerpAngle(player.root.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 12));
      }
      player.root.position.y = terrainHeight(player.root.position.x, player.root.position.z);
      player.update(t, dt, walking, running);

      // 角色视角跟随
      const tx = player.root.position.x, ty = player.root.position.y + 4.6, tz = player.root.position.z;
      if (firstPerson) {
        const headH = 0.55;
        const eye = new THREE.Vector3(tx, player.root.position.y + headH, tz);
        const look = new THREE.Vector3(
          tx + Math.sin(yaw) * Math.cos(pitch),
          eye.y + Math.sin(pitch),
          tz + Math.cos(yaw) * Math.cos(pitch)
        );
        camera.position.lerp(eye, Math.min(1, dt * 12));
        camera.lookAt(look);
      } else {
        const cd = 17, cp = Math.cos(pitch);
        const want = new THREE.Vector3(
          tx - Math.sin(yaw) * cp * cd,
          Math.max(terrainHeight(tx, tz) + 1.6, ty - Math.sin(pitch) * cd),
          tz - Math.cos(yaw) * cp * cd
        );
        camera.position.lerp(want, Math.min(1, dt * 7));
        camera.lookAt(tx, ty, tz);
      }

      // 邻近提示
      let nd = 1e9, nf = null;
      markers.forEach(g => {
        const d = Math.hypot(g.position.x - tx, g.position.z - tz);
        if (d < nd) { nd = d; nf = g.userData.find; }
      });
      nearFind = (nd < 11) ? nf : null;
      const tip = document.getElementById('nearTip');
      if (nearFind) { tip.textContent = '发现 · ' + nearFind.name + '（点这里 / 按 E 查看）'; tip.classList.add('show'); }
      else tip.classList.remove('show');
    }

    window.viewNear = function () { if (walkMode && nearFind) selectFind(nearFind); };

    // D-Pad 按钮 → keys 状态（鼠标/触屏按下持续移动，松开停止）
    (function bindDPad() {
      document.querySelectorAll('#dpad .dpad-btn').forEach(btn => {
        const key = btn.dataset.key;
        const start = e => {
          e.preventDefault();
          try { btn.setPointerCapture(e.pointerId); } catch(err){}
          keys[key] = true;
          btn.classList.add('hold');
        };
        const end = () => { keys[key] = false; btn.classList.remove('hold'); };
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointercancel', end);
        btn.addEventListener('pointerleave', end);
      });
    })();

    // 键盘输入 → keys 状态 + D-Pad hold 反馈
    function dpBtnHold(key, on) {
      const b = document.querySelector('#dpad .dpad-btn[data-key="' + key + '"]');
      if (b) b.classList.toggle('hold', on);
    }
    window.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase();
      if (k === 'shift') { keys['shift'] = true; dpBtnHold('shift', true); }
      const kMap = { w:'w', a:'a', s:'s', d:'d', arrowup:'w', arrowleft:'a', arrowdown:'s', arrowright:'d' };
      if (kMap[k]) {
        e.preventDefault();
        keys[kMap[k]] = true;
        dpBtnHold(kMap[k], true);
      }
      if (walkMode && k === 'e') viewNear();
    });
    window.addEventListener('keyup', e => {
      const k = (e.key || '').toLowerCase();
      if (k === 'shift') { keys['shift'] = false; dpBtnHold('shift', false); }
      const kMap = { w:'w', a:'a', s:'s', d:'d', arrowup:'w', arrowleft:'a', arrowdown:'s', arrowright:'d' };
      if (kMap[k]) { keys[kMap[k]] = false; dpBtnHold(kMap[k], false); }
    });

    (function bindLook() {
      let lx = 0, ly = 0, drag = false;
      window.addEventListener('pointerdown', e => {
        if (!walkMode) return;
        const el = e.target;
        if (el && el.closest && el.closest('#dpad,#card,#miniMap,#mapPanel,#nearTip,#hud')) return;
        drag = true; lx = e.clientX; ly = e.clientY;
      });
      window.addEventListener('pointerup', () => { drag = false; });
      window.addEventListener('pointercancel', () => { drag = false; });
      window.addEventListener('pointermove', e => {
        if (!walkMode || !drag) return;
        yaw -= (e.clientX - lx) * 0.0045;
        pitch = Math.max(-1.15, Math.min(0.55, pitch - (e.clientY - ly) * 0.0035));
        lx = e.clientX; ly = e.clientY;
      });
    })();

    // ---------- 地点地标 + 可发现点 ----------
    function buildPlaceMarkers() {
      const typeColor = { '兽': 0xff8a3c, '鸟': 0x3aa0ff, '草': 0x36c46a, '木': 0xb07a3a };
      DATA.places.forEach(p => {
        const pc = PLACE_POS[p.id];
        const gy = terrainHeight(pc.x, pc.z);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0xb9c2c8, roughness: 1, flatShading: true });
        const snowMat = new THREE.MeshStandardMaterial({ color: 0xf6f9fb, roughness: 0.9, flatShading: true });
        const pk = new THREE.Group();
        const b1 = new THREE.Mesh(new THREE.ConeGeometry(7, 20, 6), rockMat); b1.position.set(0, 10, 0);
        const s1 = new THREE.Mesh(new THREE.ConeGeometry(3.6, 8, 6), snowMat); s1.position.set(0, 16, 0);
        const b2 = new THREE.Mesh(new THREE.ConeGeometry(4.5, 12, 6), rockMat); b2.position.set(9, 6, 3);
        b1.castShadow = b2.castShadow = true;
        pk.add(b1, s1, b2);
        pk.position.set(pc.x - 6, gy - 2, pc.z - 24);
        scene.add(pk);
        scene.add(makeLabel(p.name, pc.x - 6, gy + 24, pc.z - 24, '#1f2937', '#ffffff'));

        p.finds.forEach(f => {
          const wx = pc.x + ((f.scene[0] - 50) / 50) * SPREAD;
          const wz = pc.z + ((f.scene[1] - 50) / 50) * SPREAD;
          const wy = terrainHeight(wx, wz);
          const col = typeColor[f.type] || 0xffd84a;
          const g = new THREE.Group();
          g.position.set(wx, wy, wz);

          // 三维活物本体（程序化建模，各部位关节会动）
          const creature = buildCreature(f);
          const cr = creature.root;
          cr.rotation.y = Math.atan2(wx - pc.x, wz - pc.z) + Math.PI;
          g.add(cr);
          creatures.push(creature);
          f._creature = creature;

          // 脚下感应圈 + 旋转光环（保留"可发现"提示）
          const disc = new THREE.Mesh(new THREE.CircleGeometry(3.6, 40),
            new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.2, depthWrite: false }));
          disc.rotation.x = -Math.PI / 2; disc.position.y = 0.03;
          g.add(disc);

          const ring = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.1, 10, 44),
            new THREE.MeshBasicMaterial({ color: col }));
          ring.position.y = 0.14; ring.rotation.x = Math.PI / 2;
          g.add(ring);
          spinners.push(ring);

          g.userData.find = f;
          g.userData.disc = disc;
          g.userData.ring = ring;
          g.userData.phase = Math.random() * 6;

          // 定位锚点（供镜头飞入/血条定位，不参与渲染）
          const anchor = new THREE.Object3D();
          anchor.position.y = 4.2;
          g.add(anchor);

          scene.add(g);
          f._orb = anchor;
          markers.push(g);
        });
      });
    }

    function makeLabel(text, x, y, z, textColor, bg) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = bg;
      roundRect(ctx, 6, 12, 244, 40, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(31,41,55,0.18)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.font = '700 28px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 33);
      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = 4;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      sp.scale.set(14, 3.5, 1);
      sp.position.set(x, y, z);
      return sp;
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    // ---------- 3D 交互 ----------
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function handleClick(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(markers, true)[0];
      if (hit) {
        let o = hit.object;
        while (o && !o.userData.find) o = o.parent;
        if (o) selectFind(o.userData.find);
      }
    }

    function selectFind(f) {
      openCard(f);
      if (unlocked.indexOf(f.id) < 0) {
        unlocked.push(f.id); saveUnlocked(unlocked);
        updateProgress(); chime(true);
      } else { chime(false); }
    }
    function flyToPlace(id) {
      // 大地图点击地点 → 人物传送过去（和平精英式）
      const pc = PLACE_POS[id];
      const gy = terrainHeight(pc.x, pc.z);
      // 直接把人物放到目标点旁 8 单位处
      player.root.position.set(pc.x + 6, gy, pc.z + 10);
      player.root.rotation.y = Math.atan2(6, 10);
      yaw = Math.atan2(-6, -10);
      pitch = -0.22;
    }

    // ---------- 卡片 ----------
    function openCard(f) {
      document.getElementById('cSvg').innerHTML = f.svg;

    // ---------- 大地图：内容变换式缩放/平移（锚定光标） ----------
    const mapView = { s: 1, tx: 0, ty: 0 };
    const MAP_MIN = 1, MAP_MAX = 6;
    function clampView() {
      const lo = 100 - 100 * mapView.s;
      mapView.tx = Math.max(lo, Math.min(0, mapView.tx));
      mapView.ty = Math.max(lo, Math.min(0, mapView.ty));
    }
    function applyMapView() {
      clampView();
      if (mapContent) mapContent.setAttribute('transform', 'translate(' + mapView.tx + ' ' + mapView.ty + ') scale(' + mapView.s + ')');
      const lv = document.getElementById('zoomLv');
      if (lv) lv.textContent = mapView.s.toFixed(1) + '×';
    }
    function clientToVB(cx, cy) {
      const svg = document.getElementById('mapSvg');
      const pt = svg.createSVGPoint();
      pt.x = cx; pt.y = cy;
      const m = svg.getScreenCTM();
      if (!m) return { x: 50, y: 50 };
      const r = pt.matrixTransform(m.inverse());
      return { x: r.x, y: r.y };
    }
    function zoomAt(px, py, k) {
      const ns = Math.max(MAP_MIN, Math.min(MAP_MAX, mapView.s * k));
      if (ns === mapView.s) return;
      const rk = ns / mapView.s;
      mapView.tx = px - (px - mapView.tx) * rk;
      mapView.ty = py - (py - mapView.ty) * rk;
      mapView.s = ns;
      applyMapView();
    }
    window.zoomMap = function (k) { zoomAt(50, 50, k); };
    window.resetMap = function () { mapView.s = 1; mapView.tx = 0; mapView.ty = 0; applyMapView(); };

    (function mapInteractions() {
      const body = document.getElementById('mpBody');
      const svg = document.getElementById('mapSvg');
      const pointers = new Map();
      let lastDist = 0;

      body.addEventListener('wheel', e => {
        e.preventDefault();
        const p = clientToVB(e.clientX, e.clientY);
        zoomAt(p.x, p.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
      }, { passive: false });

      body.addEventListener('dblclick', e => {
        const p = clientToVB(e.clientX, e.clientY);
        zoomAt(p.x, p.y, 1.6);
      });

      function dist() {
        const a = [...pointers.values()];
        return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      }
      function mid() {
        const a = [...pointers.values()];
        return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
      }

      body.addEventListener('pointerdown', e => {
        try { body.setPointerCapture(e.pointerId); } catch (err) {}
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        mapDragMoved = false;
        if (pointers.size === 1) body.classList.add('grabbing');
        if (pointers.size === 2) lastDist = dist();
      });
      body.addEventListener('pointermove', e => {
        if (!pointers.has(e.pointerId)) return;
        const prev = pointers.get(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1) {
          const a = clientToVB(prev.x, prev.y);
          const b = clientToVB(e.clientX, e.clientY);
          mapView.tx += (b.x - a.x);
          mapView.ty += (b.y - a.y);
          applyMapView();
          if (Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y) > 10) mapDragMoved = true;
        } else if (pointers.size === 2) {
          const d = dist(), m = mid();
          if (lastDist > 0 && d > 0) {
            const mv = clientToVB(m.x, m.y);
            zoomAt(mv.x, mv.y, d / lastDist);
          }
          mapDragMoved = true;
          lastDist = d;
        }
      });
      function endPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) lastDist = 0;
        if (pointers.size === 0) body.classList.remove('grabbing');
      }
      body.addEventListener('pointerup', endPointer);
      body.addEventListener('pointercancel', endPointer);
    })();

    // ---------- 时间 / 天气 / 环境音效 ----------
    const TIME_PRESETS = {
      0:  { top: 0x0b1220, mid: 0x1a2740, bot: 0x2c3a5a, bg: 0x0b1220, fog: 0x1a2740, hemi: 0.18, amb: 0.06, sun: 0.0,  sunCol: 0xaabbd8 },
      6:  { top: 0x4a6fa5, mid: 0xf5c49a, bot: 0xffe8d1, bg: 0x6a8dc5, fog: 0xd9bfa0, hemi: 0.55, amb: 0.12, sun: 0.45, sunCol: 0xffd6a5 },
      12: { top: 0x3f7fc4, mid: 0x9cc9ec, bot: 0xdfeefb, bg: 0xbfe3ff, fog: 0xcfe8fb, hemi: 1.0,  amb: 0.18, sun: 1.3,  sunCol: 0xfff4e0 },
      18: { top: 0x4a5e8a, mid: 0xf2a86c, bot: 0xffd6c1, bg: 0x8fa8cf, fog: 0xeecbb0, hemi: 0.6,  amb: 0.13, sun: 0.55, sunCol: 0xffc080 },
      24: { top: 0x0b1220, mid: 0x1a2740, bot: 0x2c3a5a, bg: 0x0b1220, fog: 0x1a2740, hemi: 0.18, amb: 0.06, sun: 0.0,  sunCol: 0xaabbd8 }
    };
    function lerpColor(a, b, t) {
      const c1 = new THREE.Color(a), c2 = new THREE.Color(b);
      return c1.lerp(c2, t).getHex();
    }
    function getTimeState(h) {
      const keys = [0, 6, 12, 18, 24];
      let i = 0;
      while (i < keys.length - 1 && h > keys[i + 1]) i++;
      const k0 = keys[i], k1 = keys[i + 1];
      const t = (h - k0) / (k1 - k0);
      const a = TIME_PRESETS[k0], b = TIME_PRESETS[k1];
      const r = {};
      for (const k in a) r[k] = k === 'hemi' || k === 'amb' || k === 'sun' ? a[k] + (b[k] - a[k]) * t : lerpColor(a[k], b[k], t);
      return r;
    }
    function formatTime(h) {
      const hr = Math.floor(h) % 24;
      const mn = Math.floor((h % 1) * 60);
      return (hr < 10 ? '0' : '') + hr + ':' + (mn < 10 ? '0' : '') + mn;
    }
    function applyTime() {
      if (!sunLight) return;
      const s = getTimeState(timeOfDay);
      // 太阳方位：6点东地平，12点南天顶，18点西地平，夜间低于地平线
      const sunAngle = (timeOfDay - 6) / 12 * Math.PI;
      const r = 720;
      sunLight.position.set(Math.cos(sunAngle) * r, Math.sin(sunAngle) * r, 80);
      if (sunSprite) { sunSprite.position.copy(sunLight.position); sunSprite.visible = timeOfDay > 5 && timeOfDay < 19; }
      sunLight.color.setHex(s.sunCol); sunLight.intensity = s.sun;
      hemiLight.intensity = s.hemi;
      ambientLight.intensity = s.amb;
      scene.background.setHex(s.bg);
      scene.fog.color.setHex(s.fog);
      if (skyMat) {
        skyMat.uniforms.top.value.setHex(s.top);
        skyMat.uniforms.mid.value.setHex(s.mid);
        skyMat.uniforms.bot.value.setHex(s.bot);
      }
    }
    window.setTimeOfDay = function (v) {
      timeOfDay = parseFloat(v);
      if (timeOfDay >= 24) timeOfDay = 0;
      if (timeOfDay < 0) timeOfDay += 24;
      const tv = document.getElementById('timeVal');
      if (tv) tv.textContent = formatTime(timeOfDay);
      applyTime();
    };

    function buildWeather(type) {
      if (weatherSystem) { scene.remove(weatherSystem); weatherSystem.geometry.dispose(); weatherSystem.material.dispose(); weatherSystem = null; }
      if (type === 'clear') return;
      const count = type === 'rain' ? 5000 : 3500;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random()) * 170;
        pos[i * 3] = Math.cos(ang) * rad;
        pos[i * 3 + 1] = Math.random() * 100 + 8;
        pos[i * 3 + 2] = Math.sin(ang) * rad;
        if (type === 'rain') {
          vel[i * 3] = (Math.random() - 0.5) * 3;
          vel[i * 3 + 1] = -35 - Math.random() * 18;
          vel[i * 3 + 2] = (Math.random() - 0.5) * 3;
        } else {
          vel[i * 3] = (Math.random() - 0.5) * 2;
          vel[i * 3 + 1] = -3 - Math.random() * 4;
          vel[i * 3 + 2] = (Math.random() - 0.5) * 2;
        }
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('velocity', new THREE.BufferAttribute(vel, 3));
      const mat = new THREE.PointsMaterial({
        color: type === 'rain' ? 0xcce4f7 : 0xffffff,
        size: type === 'rain' ? 0.55 : 0.65,
        transparent: true,
        opacity: type === 'rain' ? 0.72 : 0.85,
        depthWrite: false,
        sizeAttenuation: true
      });
      weatherSystem = new THREE.Points(geo, mat);
      weatherSystem.frustumCulled = false;
      scene.add(weatherSystem);
    }
    function updateWeather(dt) {
      if (!weatherSystem || weatherType === 'clear') return;
      const pos = weatherSystem.geometry.attributes.position.array;
      const vel = weatherSystem.geometry.attributes.velocity.array;
      const count = pos.length / 3;
      for (let i = 0; i < count; i++) {
        pos[i * 3] += vel[i * 3] * dt;
        pos[i * 3 + 1] += vel[i * 3 + 1] * dt;
        pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        if (pos[i * 3 + 1] < 0) {
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.sqrt(Math.random()) * 170;
          pos[i * 3] = Math.cos(ang) * rad;
          pos[i * 3 + 1] = 90 + Math.random() * 25;
          pos[i * 3 + 2] = Math.sin(ang) * rad;
        }
      }
      weatherSystem.geometry.attributes.position.needsUpdate = true;
    }
    window.setWeather = function (type) {
      weatherType = type;
      buildWeather(type);
      ['clear','rain','snow'].forEach(k => document.getElementById('w' + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle('on', k === type));
      updateAmbientGains();
    };

    function buildNoiseBuffer(sec) {
      const len = actx.sampleRate * sec;
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }
    function startLoop(buf, gain, filterType, freq) {
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const filt = actx.createBiquadFilter();
      filt.type = filterType;
      filt.frequency.value = freq;
      src.connect(filt).connect(gain).connect(audioNodes.master);
      src.start();
      return { src, filt };
    }
    function chirp() {
      if (!actx || !soundOn) return;
      const g = actx.createGain();
      const o = actx.createOscillator();
      const f = 1800 + Math.random() * 1600;
      o.frequency.setValueAtTime(f, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f * 1.4, actx.currentTime + 0.08);
      g.gain.setValueAtTime(0, actx.currentTime);
      g.gain.linearRampToValueAtTime(0.018, actx.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.22);
      o.connect(g).connect(audioNodes.master);
      o.start(); o.stop(actx.currentTime + 0.25);
    }
    function scheduleBirds() {
      if (audioNodes.birdInt) return;
      audioNodes.birdInt = setInterval(() => {
        if (!soundOn || weatherType !== 'clear' || (timeOfDay >= 19 || timeOfDay <= 5)) return;
        if (Math.random() < 0.55) chirp();
      }, 1200 + Math.random() * 1800);
    }
    function updateAmbientGains() {
      if (!audioNodes.master) return;
      const day = timeOfDay > 6 && timeOfDay < 18 ? 1 : 0.35;
      const wind = weatherType === 'clear' ? 0.08 : weatherType === 'rain' ? 0.22 : 0.15;
      const rain = weatherType === 'rain' ? 0.28 : 0;
      const water = 0.05;
      if (audioNodes.windGain) audioNodes.windGain.gain.setTargetAtTime(wind * day, actx.currentTime, 0.4);
      if (audioNodes.rainGain) audioNodes.rainGain.gain.setTargetAtTime(rain * day, actx.currentTime, 0.4);
      if (audioNodes.waterGain) audioNodes.waterGain.gain.setTargetAtTime(water * day, actx.currentTime, 0.4);
    }
    function initAudio() {
      if (actx) return;
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return; }
      const master = actx.createGain();
      master.gain.value = 0.55;
      master.connect(actx.destination);
      audioNodes.master = master;
      audioNodes.windGain = actx.createGain(); audioNodes.windGain.gain.value = 0;
      audioNodes.rainGain = actx.createGain(); audioNodes.rainGain.gain.value = 0;
      audioNodes.waterGain = actx.createGain(); audioNodes.waterGain.gain.value = 0;
      const wBuf = buildNoiseBuffer(2.0), rBuf = buildNoiseBuffer(2.0), waBuf = buildNoiseBuffer(2.0);
      audioNodes.wind = startLoop(wBuf, audioNodes.windGain, 'lowpass', 350);
      audioNodes.rain = startLoop(rBuf, audioNodes.rainGain, 'highpass', 800);
      audioNodes.water = startLoop(waBuf, audioNodes.waterGain, 'lowpass', 180);
      scheduleBirds();
      updateAmbientGains();
    }
    window.toggleSound = function () {
      soundOn = !soundOn;
      document.getElementById('soundToggle').classList.toggle('on', soundOn);
      if (soundOn) { ensureAudio(); initAudio(); updateAmbientGains(); }
      else if (actx && actx.state === 'running') actx.suspend();
    };

    // ---------- 音效 ----------
    function ensureAudio() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === 'suspended') actx.resume();
    }
    function chime(isNew) {
      ensureAudio(); if (!actx) return;
      const notes = isNew ? [523.25, 587.33, 659.25, 783.99, 880.0] : [659.25, 783.99];
      const t0 = actx.currentTime;
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        const s = t0 + i * 0.09;
        g.gain.setValueAtTime(0, s);
        g.gain.linearRampToValueAtTime(0.15, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, s + 0.5);
        o.connect(g).connect(actx.destination);
        o.start(s); o.stop(s + 0.55);
      });
    }

    // ---------- 循环 ----------
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock ? Math.min(clock.getDelta(), 0.05) : 0.016;
      t += dt;
      // 所有三维活物动起来（走/跳/扇翅/摇尾/摇曳）
      creatures.forEach(c => c.update(t, dt));
      markers.forEach(g => {
        const u = g.userData;
        if (!u.disc) return;
        u.disc.material.opacity = 0.12 + Math.sin(t * 1.8 + u.phase) * 0.07;
      });
      spinners.forEach(r => { r.rotation.z += 0.6 * dt; });
      clouds.forEach(c => {
        c.position.x += c.userData.speed * dt * 2;
        if (c.position.x > 560) c.position.x = -560;
      });
      birds.forEach(b => {
        const u = b.userData;
        u.a += u.spd * dt;
        b.position.set(u.cx + Math.cos(u.a) * u.r, u.y + Math.sin(u.a * 3) * 1.6, u.cz + Math.sin(u.a) * u.r);
        b.rotation.y = -u.a + Math.PI / 2;
        const f = Math.sin(t * 9 + u.ph) * 0.7;
        u.left.rotation.z = 0.45 + f;
        u.right.rotation.z = -0.45 - f;
      });
      if (waterGeo) {
        const pos = waterGeo.attributes.position;
        const arr = pos.array;
        for (let i = 0; i < pos.count; i++) {
          const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
          arr[i * 3 + 1] = Math.sin(x * 0.28 + t * 1.7) * 0.16 + Math.cos(z * 0.32 + t * 1.3) * 0.15;
        }
        pos.needsUpdate = true;
        waterGeo.computeVertexNormals();
      }
      updateWeather(dt);
      if (walkMode) {
        updateWalk(dt);
      } else {
        controls.update();
      }
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    try { init(); }
    catch (err) {
      document.getElementById('loading').textContent = '3D 初始化失败：' + (err && err.message ? err.message : err);
    }
    setTimeout(() => {
      const el = document.getElementById('loading');
      if (!el.classList.contains('hide')) el.textContent = '3D 库加载较慢，请确认网络后刷新。';
    }, 9000);
  </script>
</body>
</html>
