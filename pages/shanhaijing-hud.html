<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>山海经 · 异兽图鉴（小地图）</title>
<style>
:root{
  --hud-bg: rgba(8,16,28,0.82);
  --hud-line: #38e1ff;
  --hud-dim: rgba(120,200,230,0.35);
  --accent: #ffce54;
  --ok: #34d058;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080f;color:#cfe9f5;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;background:
  radial-gradient(1200px 800px at 50% 42%, #0d1726 0%, #05080f 72%);}
/* 顶部标题栏 */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
  justify-content:space-between;padding:10px 14px;z-index:5;
  background:linear-gradient(180deg,rgba(5,8,15,0.92),rgba(5,8,15,0));}
.topbar .title{font-size:15px;letter-spacing:3px;color:#9fe9ff;text-shadow:0 0 8px rgba(56,225,255,0.5)}
.topbar .progress{font-size:13px;color:#ffce54}
/* 右上角小地图 */
.minimap{position:absolute;top:52px;right:14px;width:min(46vw,300px);height:min(46vw,300px);
  border-radius:18px;background:var(--hud-bg);
  border:1px solid rgba(56,225,255,0.5);
  box-shadow:0 0 24px rgba(56,225,255,0.25), inset 0 0 30px rgba(0,0,0,0.6);
  overflow:hidden;}
.mm-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(56,225,255,0.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,225,255,0.08) 1px,transparent 1px);
  background-size:30px 30px;}
.mm-compass{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;
  color:var(--hud-dim);letter-spacing:2px;z-index:2}
.mm-compass b{color:var(--hud-line)}
.mm-ring{position:absolute;inset:10px;border:1px dashed rgba(56,225,255,0.25);border-radius:50%}
/* 分区色块 */
.region{position:absolute;border:1px solid var(--hud-dim);border-radius:6px;
  background:rgba(56,225,255,0.05);}
.region span{position:absolute;bottom:2px;left:4px;font-size:9px;color:var(--hud-dim)}
/* 异兽点 */
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;cursor:pointer;z-index:4}
.pin .dot{position:absolute;inset:0;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);border:2px solid rgba(255,255,255,0.35)}
.pin.unlocked .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.pin .ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--accent);
  opacity:.6;animation:pulse 1.8s infinite}
.pin.unlocked .ring{border-color:var(--ok)}
@keyframes pulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.pin .lbl{position:absolute;left:20px;top:-2px;white-space:nowrap;font-size:11px;
  color:#e8f6ff;text-shadow:0 0 4px #000}
/* 中央准星（玩家） */
.reticle{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;
  border:1px solid rgba(56,225,255,0.5);border-radius:50%;z-index:2}
.reticle:before,.reticle:after{content:"";position:absolute;background:rgba(56,225,255,0.5)}
.reticle:before{left:50%;top:-8px;width:1px;height:8px;margin-left:-.5px}
.reticle:after{top:50%;left:-8px;height:1px;width:8px;margin-top:-.5px}
/* 异兽卡片 */
.card{position:absolute;top:52px;left:14px;width:min(54vw,360px);max-height:74vh;overflow:auto;
  background:var(--hud-bg);border:1px solid rgba(56,225,255,0.45);border-radius:14px;
  padding:14px;transform:translateX(-120%);opacity:0;transition:.35s;z-index:6;
  box-shadow:0 0 30px rgba(0,0,0,0.6)}
.card.show{transform:none;opacity:1}
.card .close{position:absolute;top:8px;right:10px;background:none;border:none;color:#9fe9ff;
  font-size:20px;cursor:pointer;line-height:1}
.card h2{margin:0 0 4px;color:#9fe9ff;letter-spacing:2px;font-size:18px}
.card .src{font-size:12px;color:#ffce54;margin-bottom:8px}
.card .art{text-align:center;margin:6px 0}
.card .art svg{max-width:150px;height:auto}
.card .sec{font-size:13px;line-height:1.6;margin-top:8px}
.card .sec b{color:#9fe9ff}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;
  color:var(--hud-dim);z-index:3}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">山海经 · 异兽图鉴</div>
    <div class="progress" id="prog">已解锁 0/3</div>
  </div>
  <div class="minimap" id="map">
    <div class="mm-grid"></div>
    <div class="mm-ring"></div>
    <div class="mm-compass"><b>N</b> · 北 ↑ &nbsp; 山海舆图</div>
    <div class="reticle"></div>
  </div>
  <div class="card" id="card"></div>
  <div class="hint">点击右上角小地图上的发光点，查看异兽</div>
</div>
<script src="shanhaijing-data.js"></script>
<script>
(function(){
  var D = window.SHANHAIJING;
  var MAP = { fox:[56,82], jingwei:[50,20], fenghuang:[44,78] };
  var mapEl = document.getElementById('map');
  var cardEl = document.getElementById('card');
  var progEl = document.getElementById('prog');
  var KEY = 'shjhud_unlocked_v1';
  var unlocked = [];
  try { unlocked = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){}
  if (!Array.isArray(unlocked)) unlocked = [];

  var regions = [
    {name:'中山经', x:38, y:38, w:24, h:24},
    {name:'南山经', x:38, y:70, w:24, h:18},
    {name:'西山经', x:6,  y:38, w:24, h:24},
    {name:'北山经', x:38, y:10, w:24, h:18},
    {name:'东山经', x:70, y:38, w:24, h:24}
  ];
  regions.forEach(function(r){
    var d = document.createElement('div');
    d.className = 'region';
    d.style.cssText = 'left:'+r.x+'%;top:'+r.y+'%;width:'+r.w+'%;height:'+r.h+'%';
    d.innerHTML = '<span>'+r.name+'</span>';
    mapEl.appendChild(d);
  });

  var actx;
  function playTone(){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var scale = [523.25, 587.33, 659.25, 783.99, 880.0];
      var f = scale[Math.floor(Math.random()*scale.length)];
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      var t = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.62);
    } catch(e){}
  }

  function closeCard(){ cardEl.classList.remove('show'); }
  window.closeCard = closeCard;

  function openCard(c){
    cardEl.innerHTML =
      '<button class="close" onclick="closeCard()">×</button>' +
      '<h2>'+c.name+'</h2>' +
      '<div class="src">出处：'+c.region+'</div>' +
      '<div class="art">'+c.svg+'</div>' +
      '<div class="sec"><b>原文</b><br>'+c.原文+'</div>' +
      '<div class="sec"><b>白话</b><br>'+c.白话+'</div>' +
      '<div class="sec"><b>形象解读</b><br>'+c.解读+'</div>';
    cardEl.classList.add('show');
    playTone();
    if (unlocked.indexOf(c.id) === -1){
      unlocked.push(c.id);
      try { localStorage.setItem(KEY, JSON.stringify(unlocked)); } catch(e){}
      updateProg();
    }
  }

  function updateProg(){
    progEl.textContent = '已解锁 '+unlocked.length+'/'+D.creatures.length;
  }

  D.creatures.forEach(function(c){
    var pos = MAP[c.id] || [50,50];
    var p = document.createElement('div');
    p.className = 'pin' + (unlocked.indexOf(c.id) !== -1 ? ' unlocked' : '');
    p.style.left = pos[0]+'%';
    p.style.top = pos[1]+'%';
    p.innerHTML = '<div class="ring"></div><div class="dot"></div><div class="lbl">'+c.name+'</div>';
    p.addEventListener('click', function(){ openCard(c); });
    mapEl.appendChild(p);
  });

  updateProg();
})();
</script>
</body>
</html>
