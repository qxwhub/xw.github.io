<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>山海经 · 地图探索</title>
<style>
:root{
  --hud-bg: rgba(8,16,28,0.82);
  --hud-line: #38e1ff;
  --hud-dim: rgba(120,200,230,0.35);
  --accent: #ffce54;
  --ok: #34d058;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080f;color:#cfe9f5;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;background:radial-gradient(1200px 800px at 40% 45%, #0d1726 0%, #05080f 72%)}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
  justify-content:space-between;padding:10px 14px;z-index:8;
  background:linear-gradient(180deg,rgba(5,8,15,0.92),rgba(5,8,15,0))}
.topbar .title{font-size:15px;letter-spacing:3px;color:#9fe9ff;text-shadow:0 0 8px rgba(56,225,255,0.5)}
.topbar .progress{font-size:13px;color:#ffce54}
/* 主画布：当前地点场景（不摊开全图） */
.stage{position:absolute;inset:0;transition:opacity .2s}
.stage.fade{opacity:0}
.scene-bg{position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(180deg,transparent,rgba(56,225,255,0.05) 45%,rgba(56,225,255,0.12))}
.scene-bg .mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%}
.scene-name{position:absolute;top:18%;left:6%;font-size:clamp(24px,6vw,46px);letter-spacing:6px;
  color:#dff4ff;text-shadow:0 0 18px rgba(56,225,255,0.35);opacity:.85}
.scene-sub{position:absolute;top:calc(18% + 52px);left:6%;font-size:13px;color:var(--hud-dim);letter-spacing:2px}
/* 场景内的发现点 */
.find{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;cursor:pointer;z-index:4}
.find .fdot{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,0.4)}
.find .fring{position:absolute;inset:-7px;border-radius:50%;border:1px solid #fff;opacity:.55;animation:fpulse 1.8s infinite}
.find.found .fdot{filter:saturate(1.2)}
@keyframes fpulse{0%{transform:scale(.65);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.find .flbl{position:absolute;left:24px;top:-3px;white-space:nowrap;font-size:12px;color:#eaf7ff;text-shadow:0 0 5px #000}
/* 右上角小地图：全局导航 */
.minimap{position:absolute;top:52px;right:14px;width:min(46vw,300px);height:min(46vw,300px);
  border-radius:18px;background:var(--hud-bg);border:1px solid rgba(56,225,255,0.5);
  box-shadow:0 0 24px rgba(56,225,255,0.25),inset 0 0 30px rgba(0,0,0,0.6);overflow:hidden;z-index:7}
.mm-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(56,225,255,0.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,225,255,0.08) 1px,transparent 1px);
  background-size:30px 30px}
.mm-ring{position:absolute;inset:10px;border:1px dashed rgba(56,225,255,0.25);border-radius:50%}
.mm-compass{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--hud-dim);z-index:2}
.mm-compass b{color:var(--hud-line)}
.pl{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;cursor:pointer;z-index:5}
.pl .pldot{position:absolute;inset:0;border-radius:50%;background:rgba(120,200,230,0.5);box-shadow:0 0 6px rgba(56,225,255,0.4)}
.pl.active .pldot{background:var(--hud-line);box-shadow:0 0 12px var(--hud-line)}
.pl.active{outline:2px solid rgba(56,225,255,0.7);outline-offset:3px;border-radius:50%}
.pl .plname{position:absolute;left:16px;top:-3px;white-space:nowrap;font-size:10px;color:var(--hud-dim);text-shadow:0 0 4px #000}
.pl.active .plname{color:#dff4ff}
/* 异兽卡片 */
.card{position:absolute;top:52px;left:14px;width:min(54vw,360px);max-height:74vh;overflow:auto;
  background:var(--hud-bg);border:1px solid rgba(56,225,255,0.45);border-radius:14px;
  padding:14px;transform:translateX(-120%);opacity:0;transition:.35s;z-index:9;
  box-shadow:0 0 30px rgba(0,0,0,0.6)}
.card.show{transform:none;opacity:1}
.card .close{position:absolute;top:8px;right:10px;background:none;border:none;color:#9fe9ff;font-size:20px;cursor:pointer;line-height:1}
.card .ftag{display:inline-block;font-size:11px;color:#04222e;padding:1px 8px;border-radius:8px;margin-bottom:6px;font-weight:700}
.card h2{margin:0 0 4px;color:#9fe9ff;letter-spacing:2px;font-size:18px}
.card .src{font-size:12px;color:#ffce54;margin-bottom:8px}
.card .art{text-align:center;margin:6px 0}
.card .art svg{max-width:150px;height:auto}
.card .sec{font-size:13px;line-height:1.6;margin-top:8px}
.card .sec b{color:#9fe9ff}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--hud-dim);z-index:3}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">山海经 · 地图探索</div>
    <div class="progress" id="prog">已发现 0/0</div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="minimap" id="mini">
    <div class="mm-grid"></div>
    <div class="mm-ring"></div>
    <div class="mm-compass"><b>N</b> 北 ↑ · 山海舆图</div>
  </div>
  <div class="card" id="card"></div>
  <div class="hint">点右上角小地图的地点进入该处；在场景里点发光点，发现异兽 / 异草</div>
</div>
<script src="shanhaijing-map.js"></script>
<script>
(function(){
  var M = window.SHANHAIJING_MAP.places;
  var COL = {兽:'#ff9b3d',鸟:'#5ab0ff',草:'#46d98a',木:'#c79a5b'};
  var KEY = 'shjmap_found_v1';
  var found = [];
  try { found = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){}
  if (!Array.isArray(found)) found = [];
  var current = M[0].id;
  var total = M.reduce(function(s,p){ return s + p.finds.length; }, 0);
  var miniEl = document.getElementById('mini');
  var stageEl = document.getElementById('stage');
  var cardEl = document.getElementById('card');
  var progEl = document.getElementById('prog');

  function allFinds(){
    var a = [];
    M.forEach(function(p){ p.finds.forEach(function(f){
      a.push(Object.assign({place:p.id, placeName:p.name}, f)); }); });
    return a;
  }

  function renderMini(){
    miniEl.querySelectorAll('.pl').forEach(function(e){ e.remove(); });
    M.forEach(function(p){
      var d = document.createElement('div');
      d.className = 'pl' + (p.id === current ? ' active' : '');
      d.style.left = p.mini[0] + '%';
      d.style.top = p.mini[1] + '%';
      d.innerHTML = '<span class="pldot"></span><span class="plname">'+p.name+'</span>';
      d.addEventListener('click', function(){ setPlace(p.id); });
      miniEl.appendChild(d);
    });
  }

  function setPlace(id){
    if (id === current) return;
    current = id;
    stageEl.classList.add('fade');
    setTimeout(function(){ renderStage(); renderMini(); stageEl.classList.remove('fade'); }, 200);
  }

  function renderStage(){
    var p = M.find(function(x){ return x.id === current; });
    var html =
      '<div class="scene-bg"><svg class="mtn" viewBox="0 0 1000 200" preserveAspectRatio="none">'
      + '<path d="M0 200 L0 120 Q150 40 300 110 Q450 20 600 100 Q780 30 1000 120 L1000 200 Z" '
      + 'fill="rgba(56,225,255,0.10)" stroke="rgba(56,225,255,0.25)"/></svg></div>'
      + '<div class="scene-name">'+p.sceneName+'</div>'
      + '<div class="scene-sub">'+p.name+' · 可发现 '+p.finds.length+' 种</div>';
    p.finds.forEach(function(f){
      var isF = found.indexOf(f.id) !== -1;
      html += '<div class="find'+(isF?' found':'')+'" data-id="'+f.id+'" style="left:'+f.scene[0]+'%;top:'+f.scene[1]+'%">'
            + '<span class="fring" style="border-color:'+COL[f.type]+'"></span>'
            + '<span class="fdot" style="background:'+COL[f.type]+';box-shadow:0 0 10px '+COL[f.type]+'"></span>'
            + '<span class="flbl">'+f.name+'</span></div>';
    });
    stageEl.innerHTML = html;
    stageEl.querySelectorAll('.find').forEach(function(el){
      el.addEventListener('click', function(){ openCard(el.getAttribute('data-id')); });
    });
  }

  function closeCard(){ cardEl.classList.remove('show'); }
  window.closeCard = closeCard;

  function openCard(fid){
    var f = allFinds().find(function(x){ return x.id === fid; });
    if (!f) return;
    cardEl.innerHTML =
      '<button class="close" onclick="closeCard()">×</button>'
      + '<span class="ftag" style="background:'+COL[f.type]+'">'+f.type+'</span>'
      + '<h2>'+f.name+'</h2>'
      + '<div class="src">出处：'+f.region+'（'+f.placeName+'）</div>'
      + '<div class="art">'+f.svg+'</div>'
      + '<div class="sec"><b>原文</b><br>'+f.original+'</div>'
      + '<div class="sec"><b>白话</b><br>'+f.baihua+'</div>'
      + '<div class="sec"><b>形象解读</b><br>'+f.note+'</div>';
    cardEl.classList.add('show');
    playTone();
    if (found.indexOf(f.id) === -1){
      found.push(f.id);
      try { localStorage.setItem(KEY, JSON.stringify(found)); } catch(e){}
      updateProg();
    }
  }

  function updateProg(){ progEl.textContent = '已发现 '+found.length+'/'+total; }

  var actx;
  function playTone(){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var scale = [523.25, 587.33, 659.25, 783.99, 880.0];
      var fr = scale[Math.floor(Math.random()*scale.length)];
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = fr;
      var t = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.6);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.62);
    } catch(e){}
  }

  renderMini();
  renderStage();
  updateProg();
})();
</script>
</body>
</html>
