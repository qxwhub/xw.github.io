<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行情接口连通性测试</title>
<style>
  :root{
    --ink:#1d1d1f; --muted:#86868b; --line:#e5e7eb; --card:#fff; --bg:#f5f6f8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;}
  a{color:inherit;}

  header{
    position:sticky; top:0; z-index:20; background:#fff;
    border-bottom:1px solid var(--line); padding:12px 16px;
  }
  .hd{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .hd h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.2px; white-space:nowrap;}
  .hd .sp{flex:1;}

  .tbtn{
    font:inherit; font-size:13px; color:#fff; background:#111827;
    border:1px solid #111827; border-radius:7px; padding:7px 16px; cursor:pointer;
    transition:background .12s; white-space:nowrap;
  }
  .tbtn:hover{background:#1f2937;}
  .tbtn:disabled{opacity:.55; cursor:default; background:#6b7280; border-color:#6b7280;}

  .wrap{max-width:760px; margin:0 auto; padding:16px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; margin-bottom:14px;
  }
  .card h2{margin:0 0 10px; font-size:14px; font-weight:700;}

  .big{
    font-size:15px; font-weight:700; line-height:1.6; margin-bottom:6px;
  }
  .big.ok{color:#0f6e56;}
  .big.bad{color:#a32d2d;}
  .big.idle{color:#5f5e5a;}
  .sub{font-size:12.5px; color:var(--muted); line-height:1.8;}

  .kv{
    display:flex; gap:8px; font-size:12.5px; padding:7px 0;
    border-bottom:1px dashed var(--line); line-height:1.6;
  }
  .kv:last-child{border-bottom:0;}
  .kv .k{color:var(--muted); min-width:76px; flex:0 0 auto;}
  .kv .v{color:var(--ink); word-break:break-all;}

  .notice{
    padding:9px 12px; border-radius:8px; background:#fffbeb; border:1px solid #fde68a;
    color:#92400e; font-size:11.5px; line-height:1.7; margin-bottom:14px;
  }
  .safe{
    padding:9px 12px; border-radius:8px; background:#e1f5ee; border:1px solid #9fe1cb;
    color:#085041; font-size:11.5px; line-height:1.7; margin-bottom:14px;
  }
  code{font-family:Consolas,Monaco,monospace; font-size:11.5px; background:#f3f4f6;
    padding:1px 5px; border-radius:4px; color:#1f2937;}
</style>
</head>
<body>

<header>
  <div class="hd">
    <h1>行情接口连通性测试</h1>
    <div class="sp"></div>
    <button class="tbtn" id="ping" type="button">测连接</button>
  </div>
</header>

<div class="wrap">

  <div class="safe">
    <b>此页面每次点击只发送 1 个请求</b>（拉 5 条样本），页面上<b>没有任何</b>能批量抓取的按钮，不会加重接口风控。
  </div>

  <div class="notice">
    本页仅用于检测公开行情接口是否可用，不提供任何投资建议。
  </div>

  <div class="card">
    <h2>当前状态</h2>
    <div class="big idle" id="state">尚未测试</div>
    <div class="sub" id="stateSub">点右上角「测连接」按钮，发送 1 个请求检测接口是否恢复。</div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <h2>返回详情</h2>
    <div id="details"></div>
  </div>

  <div class="card">
    <h2>说明</h2>
    <div class="sub">
      · 检测目标：东方财富公开行情接口<br>
      · 请求参数：只拉第 1 页、5 条记录（<code>pz=5</code>），请求量极小<br>
      · 若显示「接口不可用」：说明当前 IP 仍被接口方限流，请稍后再试，<b>不要连续点击</b><br>
      · 若显示「接口可用」：说明已恢复，可以进入下一步开发
    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  var API = 'https://push2.eastmoney.com/api/qt/clist/get';
  var FS_MARKET = 'm:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23';   // 沪深两市（不含北交所）

  var MIN_GAP = 5000;   // 两次点击至少间隔 5 秒，防手抖连点
  var lastAt = 0;

  var elBtn = document.getElementById('ping');
  var elState = document.getElementById('state');
  var elSub = document.getElementById('stateSub');
  var elCard = document.getElementById('detailCard');
  var elDet = document.getElementById('details');

  function buildUrl(){
    return API + '?po=1&np=1&fltt=2&invt=2&fid=f20'
      + '&fs=' + encodeURIComponent(FS_MARKET)
          .replace(/%2C/g,',').replace(/%3A/g,':').replace(/%2B/g,'+')
      + '&fields=f12,f14,f2,f20,f37&pn=1&pz=5';
  }

  function setState(cls, text, sub){
    elState.className = 'big ' + cls;
    elState.textContent = text;
    elSub.textContent = sub || '';
  }

  function kv(k, v){
    return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  elBtn.addEventListener('click', function(){
    var gap = Date.now() - lastAt;
    if (gap < MIN_GAP){
      setState('idle', '请稍等',
        '距上次测试不足 ' + Math.ceil((MIN_GAP - gap)/1000) + ' 秒，请勿连续点击。');
      return;
    }
    lastAt = Date.now();

    elBtn.disabled = true;
    setState('idle', '正在测试…', '正在发送 1 个请求（仅 5 条样本）…');
    elCard.style.display = 'none';

    var t0 = Date.now();
    fetch(buildUrl(), {mode:'cors', cache:'no-store'})
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(j){
        var d = j && j.data;
        if (!d || !d.diff || !d.diff.length){
          throw new Error('返回数据为空');
        }
        var ms = Date.now() - t0;
        setState('ok', '接口可用 ✓',
          '耗时 ' + ms + ' ms　·　本次只发送了 1 个请求');
        var rows = kv('沪深总数', '<b>' + d.total + '</b> 只');
        for (var i = 0; i < d.diff.length; i++){
          var s = d.diff[i];
          rows += kv('样本 ' + (i+1),
            esc(s.f14) + '　代码 ' + esc(s.f12)
            + '　现价 ' + esc(s.f2)
            + '　股息率 ' + esc(s.f37));
        }
        rows += kv('结论', '接口已恢复，可以进行下一步开发');
        elDet.innerHTML = rows;
        elCard.style.display = 'block';
      })
      .catch(function(err){
        var ms = Date.now() - t0;
        setState('bad', '接口不可用 ✗',
          '耗时 ' + ms + ' ms　·　' + (err && err.message ? err.message : '网络错误'));
        elDet.innerHTML =
          kv('错误类型', esc(err && err.name ? err.name : 'Error'))
          + kv('错误信息', esc(err && err.message ? err.message : '网络错误'))
          + kv('可能原因', '当前 IP 仍被接口方限流（或网络异常）')
          + kv('建议', '<b>不要连续点击</b>，过一段时间再试');
        elCard.style.display = 'block';
      })
      .then(function(){
        elBtn.disabled = false;
      });
  });

})();
</script>
</body>
</html>
