<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>资源推荐 · 插件工具库 | 卡片居中 宽度减半</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.4;
        }

        /* 顶部导航 - 保持之前干净风格 */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 24px 32px;
            padding: 0 24px;
            min-height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(4px);
            background-color: rgba(255,255,255,0.96);
        }
        .header .title {
            font-size: 1.45rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00875A, #2b9e6b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.2px;
        }
        .header .nav a {
            text-decoration: none;
            color: #334155;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 40px;
            transition: all 0.2s;
        }
        .header .nav a:hover {
            background: #eef2ff;
            color: #00875A;
        }
        /* 搜索区域 */
        .search-wrap {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .search-wrap:focus-within {
            border-color: #00875A;
            box-shadow: 0 0 0 2px rgba(0,135,90,0.2);
        }
        .search-input {
            width: 260px;
            height: 38px;
            border: none;
            border-radius: 60px 0 0 60px;
            padding: 0 18px;
            font-size: 0.85rem;
            outline: none;
            background: transparent;
        }
        .search-btn {
            height: 38px;
            width: 72px;
            background: #00875A;
            color: white;
            border: none;
            border-radius: 0 60px 60px 0;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .search-btn:hover {
            background: #006b47;
        }

        /* 内容容器 - 让所有卡片整体居中显示，且卡片宽度缩短为原来一半左右 */
        .container {
            max-width: 1400px;
            margin: 24px auto 40px;
            padding: 0 24px;
        }
        
        /* 卡片网格：改为水平居中，卡片宽度为原本的一半(约55%~60%)，并且视觉上居中 */
        .card-grid {
            display: flex;
            flex-direction: column;
            align-items: center;    /* 关键修改：让卡片水平居中 */
            gap: 16px;
            width: 100%;
        }
        
        /* 卡片核心样式：宽度设为原宽度的55% (缩短一半效果) ，并且居中自适应 */
        .card {
            width: 58%;                /* 原来100% → 58%，视觉长度缩短为一半多 */
            max-width: 680px;
            min-width: 300px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            padding: 10px 20px 10px 18px;
            border: 1px solid #e9edf2;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -12px rgba(0,0,0,0.15);
            border-color: #cbdde9;
        }
        
        /* 图标区域 */
        .card .card-icon {
            font-size: 26px;
            margin-right: 16px;
            flex-shrink: 0;
            width: 36px;
            text-align: center;
        }
        
        /* 内容区水平分布 */
        .card .card-content {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        /* 左侧文字区域 - 描述较短，自然缩短一半效果 */
        .card .card-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 130px;
            max-width: 300px;   /* 限制文字宽度 */
        }
        .card .card-title {
            font-size: 0.96rem;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
            line-height: 1.3;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.15s;
        }
        .card .card-title:hover {
            color: #00875A;
            text-decoration: underline;
        }
        /* 描述文字：已经就是短句（原本长度的一半） */
        .card .card-desc {
            font-size: 0.72rem;
            color: #54708f;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }
        
        /* 右侧元数据 时间+下载 */
        .card .card-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .card .card-time {
            font-size: 0.66rem;
            color: #6f8fae;
            background: #f8fafc;
            padding: 4px 10px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .card .download-btn {
            background: none;
            border: none;
            background-color: #eefaf3;
            color: #00875A;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 5px 14px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .card .download-btn:hover {
            background-color: #00875A;
            color: white;
            transform: scale(0.96);
        }

        /* 分页样式（居中） */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 38px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .pagination button {
            min-width: 38px;
            height: 38px;
            border: 1px solid #dee4ec;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            color: #2c3e50;
            padding: 0 12px;
        }
        .pagination button:hover:not(:disabled) {
            background: #eef2f8;
            border-color: #bacddc;
        }
        .pagination button.active {
            background: #00875A !important;
            color: white !important;
            border-color: #00875A !important;
            box-shadow: 0 3px 8px rgba(0,135,90,0.2);
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .empty-message {
            text-align: center;
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            padding: 48px 20px;
            border-radius: 40px;
            color: #4b6a8b;
            font-size: 0.9rem;
            width: 100%;
            border: 1px dashed #b9d0e2;
        }

        /* 响应式：平板下卡片宽度适当增加 */
        @media screen and (max-width: 860px) {
            .card {
                width: 75%;   /* 保持居中但稍宽 */
                min-width: 280px;
            }
            .search-input {
                width: 180px;
            }
        }
        @media screen and (max-width: 640px) {
            .card {
                width: 95%;   /* 手机端几乎全宽但仍有边距 */
            }
            .card .card-text {
                max-width: 100%;
            }
            .card .card-desc {
                max-width: 180px;
            }
            .header {
                gap: 12px;
                padding: 8px 16px;
            }
            .container {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="title">📦 资源推荐</div>
    <div class="nav">
        <a href="https://qxwhub.github.io/xw.github.io/" target="_blank">🏠 首页</a>
    </div>
    <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索插件名称、功能... 例：统计/图层/导出">
        <button id="searchBtn" class="search-btn">检索</button>
    </div>
</div>

<div class="container">
    <div id="cardGrid" class="card-grid">
        <div class="empty-message">✨ 正在加载资源库...</div>
    </div>
    <div id="paginationContainer" class="pagination"></div>
</div>

<script>
    // ------------------------------------------------------------------
    // 资源数据：描述已经缩短为原来一半长度 (例如智能标注/快速筛选等)
    // 卡片宽度设置58% + 整体居中，完美符合“长度改成现在的1/2且居中”
    // ------------------------------------------------------------------
    const RESOURCES = [
        { id: 1, title: "📐 精准统计工具", desc: "统计圆弧/直线", icon: "📏", time: "2025-02-10", fileName: "StatTool.zip", fileUrl: "https://demo.cad.store/stat_v2.zip" },
        { id: 2, title: "🎨 图层速查器", desc: "快速筛选图层", icon: "🖌️", time: "2025-02-12", fileName: "LayerQuick.zip", fileUrl: "https://demo.cad.store/layer_tool.zip" },
        { id: 3, title: "🧮 批量统计表", desc: "图元自动归类", icon: "📊", time: "2025-02-14", fileName: "BatchStats.zip", fileUrl: "https://demo.cad.store/batch_stats.zip" },
        { id: 4, title: "⚡ 快速导出工具", desc: "DXF/PDF一键导", icon: "📎", time: "2025-02-15", fileName: "ExportMaster.zip", fileUrl: "https://demo.cad.store/export_tool.zip" },
        { id: 5, title: "📈 动态标注助手", desc: "智能尺寸标注", icon: "📐", time: "2025-02-16", fileName: "DimAssist.zip", fileUrl: "https://demo.cad.store/dim_assist.zip" },
        { id: 6, title: "🔧 图元清理器", desc: "删除重复冗余", icon: "🧹", time: "2025-02-18", fileName: "PurgeTool.zip", fileUrl: "https://demo.cad.store/purge_tool.zip" },
        { id: 7, title: "🧩 属性提取器", desc: "提取块属性", icon: "🧩", time: "2025-02-20", fileName: "AttrExtract.zip", fileUrl: "https://demo.cad.store/attr_extract.zip" },
        { id: 8, title: "📑 图纸对比器", desc: "差异高亮对比", icon: "🔍", time: "2025-02-22", fileName: "CompareDraw.zip", fileUrl: "https://demo.cad.store/compare_dwg.zip" },
        { id: 9, title: "🔄 坐标转换器", desc: "坐标系批量转换", icon: "🌐", time: "2025-02-23", fileName: "CoordConvert.zip", fileUrl: "https://demo.cad.store/coord_convert.zip" },
        { id: 10, title: "🧮 面积快算王", desc: "封闭区域面积", icon: "📐", time: "2025-02-25", fileName: "AreaFast.zip", fileUrl: "https://demo.cad.store/area_calc.zip" },
        { id: 11, title: "📋 智能排序器", desc: "图元智能排序", icon: "📋", time: "2025-02-27", fileName: "SmartSort.zip", fileUrl: "https://demo.cad.store/smart_sort.zip" },
        { id: 12, title: "🎯 批量打印中心", desc: "多图批量打印", icon: "🖨️", time: "2025-03-01", fileName: "BatchPrint.zip", fileUrl: "https://demo.cad.store/batch_print.zip" }
    ];

    const PAGE_SIZE = 5;
    let currentDisplayList = [...RESOURCES];
    let currentPage = 1;
    let totalPages = Math.ceil(currentDisplayList.length / PAGE_SIZE);

    const cardGrid = document.getElementById('cardGrid');
    const paginationContainer = document.getElementById('paginationContainer');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    // ---------- 下载功能 (演示模式提醒) ----------
    function downloadFile(fileName, fileUrl) {
        if (fileUrl.includes('demo.cad.store') || fileUrl.includes('your-file-link')) {
            alert(`📎 演示模式：「${fileName}」为示例链接。\n实际部署请替换 fileUrl 为真实下载地址。\n当前触发演示下载体验。`);
            const mockLink = document.createElement('a');
            mockLink.href = "#";
            mockLink.download = fileName;
            document.body.appendChild(mockLink);
            mockLink.click();
            document.body.removeChild(mockLink);
            return;
        }
        const link = document.createElement('a');
        link.href = fileUrl;
        link.download = fileName;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        alert(`✅ 开始下载：${fileName}\n文件将保存到本地！`);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 渲染卡片 (卡片宽度缩短一半 + 整体居中)
    function renderCards() {
        if (!cardGrid) return;
        const startIdx = (currentPage - 1) * PAGE_SIZE;
        const endIdx = startIdx + PAGE_SIZE;
        const pageItems = currentDisplayList.slice(startIdx, endIdx);

        if (pageItems.length === 0) {
            cardGrid.innerHTML = `<div class="empty-message">🔍 没有找到相关资源，试试「统计」「图层」「导出」等关键词～</div>`;
            return;
        }

        const cardsHtml = pageItems.map(item => {
            const safeTitle = escapeHtml(item.title);
            const safeDesc = escapeHtml(item.desc);
            const safeTime = escapeHtml(item.time);
            const safeFileName = escapeHtml(item.fileName);
            const fileUrlClean = item.fileUrl.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return `
                <div class="card" data-id="${item.id}">
                    <div class="card-icon">${item.icon}</div>
                    <div class="card-content">
                        <div class="card-text">
                            <a href="#" class="card-title" title="${safeTitle}">${safeTitle}</a>
                            <div class="card-desc" title="${safeDesc}">${safeDesc}</div>
                        </div>
                        <div class="card-meta">
                            <span class="card-time">📅 ${safeTime}</span>
                            <button class="download-btn" data-filename="${safeFileName}" data-fileurl="${fileUrlClean}">⬇️ 下载</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        cardGrid.innerHTML = cardsHtml;

        // 绑定下载按钮事件
        document.querySelectorAll('.download-btn').forEach(btn => {
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const fileName = newBtn.getAttribute('data-filename');
                let fileUrl = newBtn.getAttribute('data-fileurl');
                if (fileUrl) downloadFile(fileName, fileUrl);
                else alert("文件链接缺失");
            });
        });
    }

    // 分页渲染 (居中样式)
    function renderPagination() {
        if (!paginationContainer) return;
        totalPages = Math.ceil(currentDisplayList.length / PAGE_SIZE);
        if (totalPages === 0) {
            paginationContainer.innerHTML = `<div style="font-size:13px; color:#7c8ea0; text-align:center;">暂无数据</div>`;
            return;
        }
        if (totalPages === 1) {
            paginationContainer.innerHTML = `<button class="active" disabled style="opacity:0.7;">1</button>`;
            return;
        }

        let paginationHtml = '';
        paginationHtml += `<button class="prev" data-nav="prev" ${currentPage === 1 ? 'disabled' : ''}>‹ 上一页</button>`;

        if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) {
                const activeClass = (i === currentPage) ? 'active' : '';
                paginationHtml += `<button data-page="${i}" class="${activeClass}">${i}</button>`;
            }
        } else {
            paginationHtml += `<button data-page="1" class="${currentPage === 1 ? 'active' : ''}">1</button>`;
            if (currentPage > 3) paginationHtml += `<button disabled style="background:transparent; border:none;">...</button>`;
            let start = Math.max(2, currentPage - 1);
            let end = Math.min(totalPages - 1, currentPage + 1);
            if (currentPage <= 3) start = 2;
            if (currentPage >= totalPages - 2) end = totalPages - 1;
            for (let i = start; i <= end; i++) {
                if (i === 1 || i === totalPages) continue;
                const activeClass = (i === currentPage) ? 'active' : '';
                paginationHtml += `<button data-page="${i}" class="${activeClass}">${i}</button>`;
            }
            if (currentPage < totalPages - 2) paginationHtml += `<button disabled style="background:transparent; border:none;">...</button>`;
            paginationHtml += `<button data-page="${totalPages}" class="${currentPage === totalPages ? 'active' : ''}">${totalPages}</button>`;
        }

        paginationHtml += `<button class="next" data-nav="next" ${currentPage === totalPages ? 'disabled' : ''}>下一页 ›</button>`;
        paginationContainer.innerHTML = paginationHtml;

        const btns = paginationContainer.querySelectorAll('button');
        btns.forEach(btn => {
            btn.removeEventListener('click', paginationHandler);
            btn.addEventListener('click', paginationHandler);
        });
    }

    function paginationHandler(e) {
        const btn = e.currentTarget;
        if (btn.disabled) return;
        const navType = btn.getAttribute('data-nav');
        const targetPage = btn.getAttribute('data-page');
        let newPage = currentPage;
        if (navType === 'prev') newPage = currentPage - 1;
        else if (navType === 'next') newPage = currentPage + 1;
        else if (targetPage) newPage = parseInt(targetPage, 10);

        if (newPage >= 1 && newPage <= totalPages && newPage !== currentPage) {
            currentPage = newPage;
            renderCards();
            renderPagination();
        }
    }

    // 搜索功能 (区分大小写忽略)
    function performSearch() {
        const keyword = searchInput.value.trim().toLowerCase();
        let filtered = [];
        if (keyword === "") {
            filtered = [...RESOURCES];
        } else {
            filtered = RESOURCES.filter(item => 
                item.title.toLowerCase().includes(keyword) || 
                item.desc.toLowerCase().includes(keyword)
            );
        }
        currentDisplayList = filtered;
        currentPage = 1;
        totalPages = Math.ceil(currentDisplayList.length / PAGE_SIZE);

        if (filtered.length === 0 && keyword !== "") {
            cardGrid.innerHTML = `<div class="empty-message">🔎 没有找到「${escapeHtml(keyword)}」相关资源，试试“统计/图层/导出/对比”等词</div>`;
            renderPagination();
            return;
        }
        renderCards();
        renderPagination();
    }

    // 初始化：渲染卡片及分页 + 搜索事件
    function init() {
        currentDisplayList = [...RESOURCES];
        currentPage = 1;
        totalPages = Math.ceil(currentDisplayList.length / PAGE_SIZE);
        renderCards();
        renderPagination();
        
        if (searchBtn) {
            searchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                performSearch();
            });
        }
        if (searchInput) {
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch();
                }
            });
        }
        // 卡片标题点击提示详细信息（不跳转）
        document.addEventListener('click', (e) => {
            const titleLink = e.target.closest('.card-title');
            if (titleLink && titleLink.getAttribute('href') === '#') {
                e.preventDefault();
                const pluginName = titleLink.innerText;
                alert(`📌 插件：「${pluginName}」\n详情可联系管理员或查阅文档。`);
            }
        });
    }

    init();
</script>
</body>
</html>
