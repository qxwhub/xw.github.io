name: 同步博客文章

on:
  schedule:
    - cron: '23 2 * * *'   # 每天凌晨 2:23 自动同步一次
  workflow_dispatch:          # 也支持手动触发

permissions:
  contents: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 从服务器拉取最新文章
        run: |
          curl -fsSL https://navlemon.com/api/posts -o /tmp/posts.json
          python3 -c "import json; d=json.load(open('/tmp/posts.json')); print('已拉取文章数:', len(d.get('posts', [])))"

      - name: 生成 blog-data.js（单向只增不删：服务器已删除的文章在 GitHub 上保留）
        run: |
          python3 -c "
          import json

          def load_local(path):
              try:
                  src = open(path, encoding='utf-8').read()
                  return json.loads(src.split('=', 1)[1].strip().rstrip(';'))
              except Exception:
                  return {'posts': [], 'trash': []}

          remote = json.load(open('/tmp/posts.json'))
          local = load_local('pages/blog-data.js')

          remote_posts = remote.get('posts', [])
          local_posts = local.get('posts', [])
          remote_ids = {str(p.get('id')) for p in remote_posts}
          # 只增不删：服务器有 → 用服务器最新版本；仅本地（GitHub）有 → 保留
          merged = list(remote_posts)
          kept = [p for p in local_posts if str(p.get('id')) not in remote_ids]
          merged += kept

          out = {'posts': merged, 'trash': local.get('trash', [])}
          with open('pages/blog-data.js', 'w', encoding='utf-8') as f:
              f.write('/* 由 GitHub Actions 自动同步，请勿手动修改 */\n')
              f.write('window.BLOG = ' + json.dumps(out, ensure_ascii=False, indent=2) + ';\n')
          print('服务器文章:', len(remote_posts), '| GitHub 保留(服务器已删):', len(kept), '| 合计:', len(merged))
          "

      - name: 有变化则提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/blog-data.js
          if git diff --cached --quiet; then
            echo "文章无变化，跳过提交"
          else
            git commit -m "chore: 同步博客文章 [自动]"
            git push
            echo "已同步到 GitHub"
          fi
